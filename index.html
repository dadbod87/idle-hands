  };
  const dress = async (target, outfitId) => {
    const row = await guard(() => api.dress(target.id, outfitId));
    if (!row) return;
    const nm = COSTUMES[outfitId]?.name;
    if (target.id === me?.id) { say(`You put on ${nm}. Nobody asked.`, "sys"); flash(nm); }
    else {
      say(DEED_TEXT.dress.mine(target.name, nm), "bad");
      flash("They'll find out. It says who.");
    }
    setPanel(null);
    setFloor(await loadFloor());
  };

  const grabChair = async () => {
    const row = await guard(() => api.grabChair());
    loadOffice().then(setOffice).catch(() => {});
    if (row) {
      sfx("chair");
      if (row.frenzy_until && new Date(row.frenzy_until) > new Date()) {
        say("You found the good chair. Seven times output for 77 seconds.", "good");
        flash("THE GOOD CHAIR · 7× for 77s");
      } else {
        say("You found the good chair. Underneath it: unfiled expense receipts.", "good");
        flash("Windfall · ten minutes of production");
      }
    }
  };

  /* ---------------------------- derived --------------------------- */
  const board = (floor.players || []).map((p) =>
    me && p.id === me.id ? { ...me, pp, lifetime } : p)
    .sort((a, b) => (b.lifetime || 0) - (a.lifetime || 0));
  const names = Object.fromEntries(board.map((p) => [p.id, p.name]));
  const fund = board.reduce((s, p) => s + (p.lifetime || 0), 0);
  const nextTier = FUND_TIERS.find((t) => t.at > fund) || FUND_TIERS[FUND_TIERS.length - 1];
  const prevTier = [...FUND_TIERS].reverse().find((t) => t.at <= fund);
  const wire = (floor.deeds || []).map((d) => ({
    ...d, from: d.hush ? "Someone" : (names[d.actor] || "Someone"), toName: names[d.target] || "someone",
  }));
  const feuds = buildFeuds(floor.deeds || [], names);
  const myOffice = me ? officeFor(board, me.id) : null;
  const atDesk = myOffice
    ? Math.abs(pos.x - myOffice.cx) < 150 && Math.abs(pos.y - myOffice.cy) < 170 : false;
  atDeskRef.current = atDesk;
  officeRef.current = myOffice;
  const cam = {
    x: ROOM.w <= view.w ? 0 : clamp(pos.x - view.w / 2, 0, ROOM.w - view.w),
    y: ROOM.h <= view.h ? 0 : clamp(pos.y - view.h / 2, 0, ROOM.h - view.h),
  };
  const jamClaim = office?.printer || null;
  const jamFixedBy = jam && jamClaim && jamClaim.window === jam.window ? jamClaim.by : null;
  const printerBox = FIXTURES.find((x) => x.id === "printer");
  const atPrinter = !!printerBox && dist(pos, {
    x: printerBox.x + printerBox.w / 2,
    y: printerBox.y + printerBox.h / 2 + 40,
  }) < REACH;
  const jamMine = !!(jamClaim && jamClaim.mine);
  const chairClaim = office?.chair || null;
  const chairTakenBy = chair && chairClaim && chairClaim.window === chair.window
    ? chairClaim.by : null;

  const cool = me?.last_deed
    ? Math.max(0, 300000 - (Date.now() - new Date(me.last_deed).getTime())) : 0;

  /**
   * Offices have one door. Walking straight at a wall doesn't work, so any
   * trip that crosses an office threshold gets routed through the doorway:
   * out of the room you're in, then into the one you're going to.
   */
  const routeTo = (tx, ty, then, forceOffice) => {
    const path = [];
    const p = posRef.current;
    // centre of an office doorway, offset outward (+) or inward (-)
    const off = (o, d) => {
      const cx = o.x + o.w / 2;
      return o.door === "bottom"
        ? { x: cx, y: o.y + o.h + d }
        : { x: cx, y: o.y - d };
    };

    // then offices
    const from = officeAt(p.x, p.y);
    const to = forceOffice || officeAt(tx, ty);
    const outside = (o) => off({ ...o, door: o.door }, 52);
    const inside  = (o) => off({ ...o, door: o.door }, -62);
    if (from && from !== to) path.push(inside(from), outside(from));
    if (to && to !== from) path.push(outside(to), inside(to));

    path.push({ x: tx, y: ty });
    goRef.current = { path, then };
  };

  const walkClick = (e) => {
    if (!roomRef.current) return;
    const r = stageRef.current.getBoundingClientRect();
    routeTo((e.clientX - r.left) / zoom + cam.x, (e.clientY - r.top) / zoom + cam.y);
  };
  const openFixture = (f) => {
    if (!f) return;
    if (f.id === "restroom") {
      const tries = (knocks.restroom || 0) + 1;
      setKnocks((k) => ({ ...k, restroom: tries }));
      if (tries >= 50 && !eggs.current.opened) {
        eggs.current.opened = true;
        sfx("good");
        sayAt(f.x + f.w / 2, f.y + f.h + 4,
          "The door opens. A man you have never seen looks up from a paperback, says " +
          "\"nearly done\", and closes it again. It never opens again.", 11000);
        return;
      }
    }
    if (f.deny) {                       // some doors don't open
      setKnocks((k) => ({ ...k, [f.id]: (k[f.id] || 0) + 1 }));
      // Once a week, across the whole office, one of these doors opens onto
      // something else entirely. The server decides; this returns null almost always.
      api.cowTry().then((res) => {
        if (!res) return;
        sfx("cowin");
        setCow({ ...res, got: 0 });
      }).catch(() => { /* a locked door staying locked is not an error */ });
      const extra = (catRef.current.deny_extra || {})[f.id] || [];
      const line = pick(f.deny.concat(extra));
      sfx("deny");
      sayAt(f.x + f.w / 2, f.y + f.h + 4, line);
      if (Math.random() < 0.4) say(line, "sys");
      return;
    }
    sfx("door");
    setPanel(f.panel);
  };
  const walkTo = (f, e) => {
    e?.stopPropagation?.();          // the jam banner calls this with no event
    routeTo(f.x + f.w / 2, Math.min(ROOM.h - 50, f.y + f.h + 60), f.id);
  };

  /* ------------------------------- ui ----------------------------- */
  if (phase === "boot") return <div className="pg-root"><div className="pg-boot">Retrieving personnel file…</div></div>;
  if (phase === "error") return (
    <div className="pg-root"><div className="pg-hirepage">
      <div className="pg-eyebrow">Patron Group</div>
      <h1 className="pg-h1">The floor is closed</h1>
      <p className="pg-lede">{err}</p>
      <p className="pg-fine">Usually this means the environment variables are missing or the SQL
      hasn't been run yet. Check README step 2 and step 5.</p>
    </div></div>
  );
  if (phase === "code") return (
    <div className="pg-root pg-marble">
      <CodeDoor onOk={async (c) => {
        setCode(c);
        try { localStorage.setItem("ih_code", c); } catch { /* private mode */ }
        const u = await getUser();
        if (u) { setUser(u); setCat(await loadCatalog().catch(() => cat)); setPhase("hire"); }
        else setPhase("gate");
      }} />
    </div>
  );
  if (phase === "sign") return (
    <div className="pg-root pg-marble">
      <SignPapers name={me?.name}
                  onSigned={(row) => { applyServer(row); setShowHelp(true); setPhase("play"); }} />
    </div>
  );
  if (phase === "gate") return (
    <div className="pg-root pg-marble">
      <Gate onNew={async () => { try { boot(await startAnonymous()); } catch (e) { setErr(e.message); setPhase("error"); } }} />
    </div>
  );
  if (phase === "hire") return (
    <div className="pg-root pg-marble">
      <Onboard user={user} code={code} onDone={(row) => { applyServer(row); setPhase("sign"); }} />
    </div>
  );

  return (
    <div className="pg-root">
      <div className="pg-hud">
        <Face src={me?.avatar_url} name={me?.name} size={40} />
        <div className="pg-hudid">
          <div className="pg-hudname">{me?.name}</div>
          <div className="pg-hudrole">{roleFor(lifetime)}{me?.equity ? ` · ${me.equity} equity` : ""}</div>
        </div>
        <div className="pg-hudpp">
          <div className="pg-ppnum">{fmt(pp)}</div>
          <div className="pg-pplabel">Patron Points</div>
          <div className="pg-ppsub">
            earning {fmt(rate)} PP every second
            {(me?.buffs || []).filter((b) => new Date(b.until) > new Date()).map((b, i) => (
              <span key={i} className={"pg-tag " + (b.mult > 1 ? "good" : "bad")}>
                {b.mult > 1 ? "▲" : "▼"} {b.from_name || b.from || b.kind}
              </span>
            ))}
            {me?.raises > 0 && <span className="pg-tag good">+{me.raises * 2}% raises</span>}
            {heat > 0 && !underReview && <span className="pg-tag warn">heat {heat}/{HEAT_LIMIT}</span>}
            {underReview && <span className="pg-tag bad">under review −25%</span>}
          </div>
        </div>
        <div className="pg-hudbtns">
          <button className="pg-help" onClick={() => setShowHelp(true)}>?</button>
        <button className="pg-help" onClick={() => { const m = setMuted(!mute); setMute(m);
                if (!m) { wakeAudio(); sfx("door"); } }}
                title={mute ? "Sound off" : "Sound on"}>{mute ? "\u2715" : "\u266a"}</button>
        <button className="pg-help" onClick={() => setPanel("account")} title="Your account">
          {user?.is_anonymous ? "!" : "✓"}
        </button>
        </div>
      </div>

      {user?.is_anonymous && (
        <button className="pg-unsaved" onClick={() => setPanel("account")}>
          This desk only exists in this browser. <em>Add an email to keep it →</em>
        </button>
      )}

      {chair && chairTakenBy && (
        <div className="pg-jam done">
          {chairClaim?.mine ? "You got the good chair." : `${chairTakenBy} got the good chair.`}
          <em>gone</em>
        </div>
      )}

      {jam && (
        jamFixedBy ? (
          <div className="pg-jam done">
            {jamMine ? "You fixed the printer. Nobody knows how."
                     : `${jamFixedBy} got to the printer first.`}
            <em>sorted</em>
          </div>
        ) : (
          <button className="pg-jam" onClick={() => {
                    const f = FIXTURES.find((x) => x.id === "printer");
                    if (f) walkTo(f);
                  }}>
            The printer has jammed. <em>{Math.ceil(jam.endsIn / 1000)}s — {atPrinter
              ? "you're there, open it" : "get to the printer"}</em>
          </button>
        )
      )}

      {office?.hit && (
        <div className="pg-marg">
          <b>MARGARITA FRIDAY</b>
          <span>The office hit the goal. Everybody doubles for 24 hours.</span>
          {office.streak > 1 && <em>{office.streak} weeks running</em>}
        </div>
      )}

      {stale && (
        <div className="pg-stale">
          <span>A newer version of Idle Hands is out. Your points are safe either way.</span>
          <button onClick={() => location.reload()}>Refresh</button>
        </div>
      )}

      {underReview && (
        <button className="pg-summons" onClick={() => setPanel("owner")}>
          Dave wants to see you in his office. <em>Go now</em>
        </button>
      )}

      <div className={"pg-event" + (ev ? (ev.mult >= 1 ? " on good" : " on bad") : "")}>
        {ev ? (
          <>
            <b>{ev.name}</b>
            <span>{ev.line}</span>
            <em>{ev.mult}× · {countdown(ev.end - Date.now())} left</em>
          </>
        ) : nextEv ? (
          <>
            <b>Next: {nextEv.name}</b>
            <span className="pg-evhide">{nextEv.line}</span>
            <em>starts in {countdown(nextEv.start - Date.now())}</em>
          </>
        ) : <b>The floor is calm. Suspiciously calm.</b>}
        {!notify && (
          <button className="pg-evbell" onClick={askNotify} title="Get told when events start">
            alert me
          </button>
        )}
      </div>

      <div ref={stageRef} className="pg-stage" style={{ height: stage.h }}>
        <div ref={roomRef} className="pg-room"
             style={{ width: ROOM.w, height: ROOM.h, transformOrigin: "0 0",
                      transform: `scale(${zoom}) translate(${-cam.x}px, ${-cam.y}px)` }}
             onClick={walkClick}>
          <div className="pg-wall" style={{ height: WALL_H }} />
          <div className="pg-carpet" style={{ top: WALL_H }} />

          {DECOR.map((d, i) => d.t === "kitchenfloor" ? (
            <div key={"d" + i} className="pg-kitchenfloor"
                 style={{ left: d.x, top: d.y, zIndex: 0 }}>
              <i /><span>The Kitchen</span>
            </div>
          ) : d.t === "mascot" ? (
            <div key={"d" + i}
                 className={"pg-decor pg-mascotframe" + (mascotReal ? " real" : "")}
                 style={{ left: d.x, top: d.y, zIndex: Math.round(d.y) - 1 }}
                 onClick={() => {
                   eggs.current.stag = (eggs.current.stag || 0) + 1;
                   if (eggs.current.stag % 10 === 0) {
                     setMascotReal(true);
                     sfx("good");
                     setTimeout(() => setMascotReal(false), 4000);
                   }
                 }}>
              <BadStag />
              <div className="pg-mascotplate">OUR BRAND</div>
              <div className="pg-mascotfine">2026 refresh &middot; do not reprint</div>
            </div>
          ) : (
            <div key={"d" + i} className={"pg-decor pg-" + d.t}
                 style={{ left: d.x, top: d.y, zIndex: d.t === "rug" ? 0 : Math.round(d.y) - 1 }} />
          ))}

          {FIXTURES.map((f) => (
            <div key={f.id} className={"pg-fx" + (near?.id === f.id ? " near" : "")}
                 style={{ left: f.x, top: f.y, width: f.w, height: f.h,
                          zIndex: Math.round(f.y + f.h) }}
                 onClick={(e) => walkTo(f, e)}>
              <FixtureArt id={f.id} board={board} tierPct={Math.min(100, (fund / nextTier.at) * 100)} />
              <div className="pg-fxlabel">{f.label}</div>
            </div>
          ))}

          {OFFICES.map((o) => {
            const order = [...board].sort((a, b) =>
              new Date(a.created_at || 0) - new Date(b.created_at || 0));
            const chances = o.i >= STAFF_OFFICES;
            const p = chances ? null : order[o.i];
            const mine = me && p && p.id === me.id;
            return (
              <div key={"o" + o.i} className={"pg-office " + o.door + (mine ? " mine" : "")}
                   style={{ left: o.x, top: o.y, width: o.w, height: o.h,
                            zIndex: Math.round(o.y) }}>
                <div className={"pg-officefloor" + (p?.kit?.rug ? " rug-" + p.kit.rug : "")} />
                {p?.kit?.art && <div className={"pg-officeart art-" + p.kit.art} />}
                {p?.kit?.chair && <div className={"pg-officechair chair-" + p.kit.chair} />}
                <div className="pg-officedoor"
                     style={{ left: o.doorX - o.x, width: DOOR_W }}><i /><span /><i /></div>
                <div className={"pg-officeplate " + o.door + (chances ? " ghost" : "")}>
                  {chances
                    ? <><b>Chance</b><span>Former Employee</span></>
                    : p ? <><b>{p.name}</b>
                            {p.ooo && <span className="pg-ooo">{p.ooo}</span>}
                            {(deptName(cat, p.dept) || jobFor(p.name)) &&
                              <span className="pg-job">{deptName(cat, p.dept) || jobFor(p.name)}</span>}
                            <span>{fmt(p.lifetime || 0)} PP</span></>
                        : <b className="pg-vacant">Vacant</b>}
                </div>
                <div className={"pg-officedesk" + (mine ? " mine" : "") + (chances ? " ghost" : "")}
                     style={{ left: o.deskX - o.x, top: o.deskY - o.y,
                              width: o.deskW, height: o.deskH }}
                   data-desk={p?.kit?.desk || ""}
                     onClick={(e) => {
                       e.stopPropagation();
                       if (mine) routeTo(o.cx, o.cy + 40, "desk", o);
                       else if (chances) sayAt(o.cx, o.deskY - 6, pick(GHOST_DESK.lines));
                     }}>
                  <span /><b />
                  {mine && <div className="pg-fxlabel">Your Desk</div>}
                </div>
              </div>
            );
          })}

          {board.map((p) => {
            const live = peers[p.id];
            if (!live || (me && p.id === me.id)) return null;
            return (
              <div key={"live" + p.id} className="pg-me"
                   style={{ left: live.x, top: live.y, zIndex: 5000 + Math.round(live.y) }}>
                {chatter?.id === p.id && <div className="pg-mumble said">{chatter.text}</div>}
                <Body p={p} src={p.avatar_url} moving={live.m} facing={live.f || 1} emote={live.e} />
                <div className="pg-peername">{p.name}</div>
              </div>
            );
          })}

          {chance && (
            <div className={"pg-me pg-chance" + (chance.leaving ? " leaving" : "")}
                 style={{ left: chance.x, top: chance.y, zIndex: 5000 + Math.round(chance.y) }}>
              <div className="pg-mumble">{chance.line}</div>
              <ChanceBody facing={chance.facing} />
              <div className="pg-peername">Chance <em>former employee</em></div>
            </div>
          )}

          {dave && (
            <div className={"pg-me pg-chance" + (dave.leaving ? " leaving" : "")}
                 style={{ left: dave.x, top: dave.y, zIndex: 5000 + Math.round(dave.y) }}>
              <div className="pg-mumble">{dave.line}</div>
              <DaveBody facing={dave.facing} />
              <div className="pg-peername">Dave <em>owner</em></div>
            </div>
          )}


          {chair && !chairTakenBy && (
            <button className="pg-chair" style={{ left: chair.x, top: chair.y }}
                    onClick={(e) => { e.stopPropagation(); grabChair(); }}>
              <svg viewBox="0 0 40 48">
                <rect x="8" y="2" width="24" height="22" rx="3" fill="#B23B2E" />
                <rect x="5" y="24" width="30" height="7" rx="2" fill="#8A2C21" />
                <rect x="19" y="31" width="3" height="9" fill="#3C3C3C" />
                <rect x="8" y="40" width="25" height="4" rx="2" fill="#3C3C3C" />
              </svg>
            </button>
          )}

          {bubble && (
            <div key={bubble.k} className="pg-deskbubble"
                 style={{ left: bubble.x, top: bubble.y, zIndex: 6000 + Math.round(bubble.y) }}>
              {bubble.text}
            </div>
          )}

          <div className="pg-me" style={{ left: pos.x, top: pos.y, zIndex: 5000 + Math.round(pos.y) }}>
            <Body p={me || { name: me?.name }} src={me?.avatar_url} me
                  moving={moving} facing={facing}
                  emote={emote && emote.until > Date.now() ? emote.id : null} />
          </div>
        </div>
        <MiniMap pos={pos} board={board} meId={me?.id} cam={cam} view={view} chair={chair} />
        {chair && (chair.x < cam.x || chair.x > cam.x + view.w ||
                   chair.y < cam.y || chair.y > cam.y + view.h) && (
          <div className="pg-chairping" style={{
            left: clamp(chair.x - cam.x, 26, view.w - 26),
            top: clamp(chair.y - cam.y, 26, view.h - 26),
          }}>&#9670;<span>good chair</span></div>
        )}
      </div>

      <div className="pg-bar">
        <button className={"pg-work" + (atDesk ? "" : " away")} onClick={doWork}>
          {atDesk ? <>Do actual work <em>+{fmt(clickPow)} PP</em></>
                  : <>Go to your desk <em>work happens there</em></>}
        </button>
        <div className="pg-emotes">
          {EMOTES.map((e) => (
            <button key={e.id} className="pg-emote" onClick={() => doEmote(e.id)} title={e.label}>
              {EMOTE_ICON[e.id]}
            </button>
          ))}
        </div>
        <div className="pg-prompt">
          {near
            ? (<><b>{near.label}</b> — {near.sub}<button className="pg-open" onClick={() => openFixture(near)}>Open</button></>)
            : "Tap the floor to walk (arrow keys work too). Walk up to anything and open it."}
        </div>
      </div>

      <div className="pg-wirestrip">
        {feed.slice(0, 3).map((f) => <div key={f.k} className={"pg-wl " + (f.tone || "")}>{f.text}</div>)}
        <div className="pg-build">Patron Group · {BUILD}</div>
      </div>

      {showHelp && <Help onClose={() => setShowHelp(false)} rate={rate} />}

      {panel && (
        <Panel onClose={() => setPanel(null)} title={PANEL_TITLES[panel]}>
          {panel === "shop" && (
            <Shop cat={cat} me={me} pp={pp} rate={rate}
              pins={pins}
              onPin={async (x) => {
                try {
                  applyServer(await api.buyPin(x.id));
                  setFloor(await loadFloor());
                  api.spendBoard().then(setSpend).catch(() => {});
      api.betaTesters().then(setTesters).catch(() => {});
      api.allPrices().then(setPrices).catch(() => {});
                  sfx("buy");
                  flash(x.name + " — pinned on.");
                } catch (e) { flash(prettyError(e)); }
              }}
              onWear={async (id) => {
                try { applyServer(await api.setPin(id)); setFloor(await loadFloor()); }
                catch (e) { flash(prettyError(e)); }
              }}
              onFitting={async (which, x) => {
                try {
                  applyServer(await api.buyFitting(which, x.id));
                  setFloor(await loadFloor());
                  sfx("buy");
                  flash(x.name + " — installed.");
                } catch (e) { flash(prettyError(e)); }
              }} clickPow={clickPow} lifetime={lifetime}
                  onBuy={buy} onUp={buyUp} guard={guard} flash={flash}
                  onRestructure={() => guard(() => api.restructure(), "Restructured")} />
          )}
          {panel === "standings" && <Standings board={board} me={me} fund={fund} feuds={feuds} />}
          {(panel === "kindness" || panel === "sabotage") && (
            <Targets good={panel === "kindness"} board={board} me={me} cat={cat}
                     lifetime={lifetime} pp={pp} cool={cool} onCommit={commit} prices={prices} />
          )}
          {panel === "owner" && (
            <Owner me={me} board={board} lifetime={lifetime} pp={pp} cool={cool} cat={cat}
                   prices={prices}
                   onMeeting={() => guard(() => api.takeMeeting(), "File cleared")}
                   onRaise={async () => { const r = await guard(() => api.askRaise(), "+2% forever");
                                          if (r) sfx("raise"); }}
                   onBlame={commit} />
          )}
          {panel === "wire" && (
            <Wire wire={wire} feed={feed} lifetime={lifetime} testers={testers} prices={prices}
                  onPineapple={() => guard(() => api.pineapple(), "Pineapple.")} />
          )}
          {panel === "personnel" && (
            <Personnel me={me} lifetime={lifetime} cat={cat}
              spend={spend} pins={pins}
              onWear={async (id) => {
                try { applyServer(await api.setPin(id)); setFloor(await loadFloor()); }
                catch (e) { flash(prettyError(e)); }
              }}
              onDept={async (id) => {
                const r = await guard(() => api.setDept(id));
                if (r) { sfx("badge"); flash("Department updated."); }
              }} />
          )}
          {panel === "account" && <Account user={user} onLinked={() => setPanel(null)} />}
          {panel === "mirror" && (
            <Mirror me={me} user={user}
              onLook={async (look) => {
                try { applyServer(await api.setLook(look)); } catch { /* cosmetic */ }
              }}
              onSave={async (name, dataUrl) => {
                try {
                  let url = null;
                  if (dataUrl) url = await uploadBadge(user.id, dataUrl);

          <p className="pg-big">+{fmt(report.earned)} PP</p>
          <p className="pg-small">That is the whole idea of this game: you earn while you're gone.</p>
          <button className="pg-btn" onClick={() => setReport(null)}>Back to it</button>

      {incidents.length > 0 && (
        <Modal onClose={() => setIncidents([])}>
          <div className="pg-stamp">Incident report</div>
          {incidents.map((g) => {
            const T = DEED_TEXT[g.kind]; if (!T) return null;
            return (
              <div key={g.id} className="pg-inc">
                <Face name={g.from} size={38} />
                <div>
                  <b>{g.from}</b>
                  <span className={T.good ? "good" : "bad"}>{T.eff}{g.amount ? ` · ${fmt(g.amount)} PP` : ""}</span>
                  <em>{T.hit(g.from, COSTUMES[g.detail]?.name)}</em>

          })}
          <div className="pg-incbtns">
            <button className="pg-btn" onClick={() => setIncidents([])}>Let it go</button>
            {incidents.some((g) => DEED_TEXT[g.kind] && !DEED_TEXT[g.kind].good) && (
              <button className="pg-btn danger" onClick={() => { setIncidents([]); setPanel("sabotage"); }}>Get them back</button>
            )}
          </div>
        </Modal>
      )}

      {toast && <div key={toast.k} className="pg-toast">{toast.text}</div>}
    </div>
  );
}

/** Two people trading hostilities is a story. Count the exchanges and name it. */
function buildFeuds(deeds, names) {
  const pairs = {};
  const cutoff = Date.now() - 24 * 3600e3;
  for (const d of deeds) {
    const T = DEED_TEXT[d.kind];
    if (!T || T.good) continue;
    if (new Date(d.created_at).getTime() < cutoff) continue;
    const key = [d.actor, d.target].sort().join("|");
    const p = pairs[key] || (pairs[key] = { a: null, b: null, n: 0, by: {}, last: 0 });
    p.n++;
    p.by[d.actor] = (p.by[d.actor] || 0) + 1;
    p.last = Math.max(p.last, new Date(d.created_at).getTime());
    [p.a, p.b] = key.split("|");
  }
  return Object.values(pairs)
    .filter((p) => p.n >= 3 && Object.keys(p.by).length > 1)   // mutual, not one-sided
    .map((p) => ({
      ...p,
      names: [names[p.a] || "someone", names[p.b] || "someone"],
      heat: p.n >= 8 ? "open warfare" : p.n >= 5 ? "escalating" : "brewing",
    }))
    .sort((x, y) => y.n - x.n)
    .slice(0, 5);
}

/** Feet-sized collision against the office walls. */
function blocked(x, y) {
  for (const w of WALLS) {
    if (x > w.x - 13 && x < w.x + w.w + 13 && y > w.y - 6 && y < w.y + w.h + 10) return true;
  }
  return false;
}

function prettyError(e) {
  const raw = e?.message || e?.error_description || e?.details || String(e || "");
  const m = raw.toLowerCase();
  if (m.includes("afford")) return "Not enough Patron Points.";
  if (m.includes("cooling")) return "Cooling off. One office favor at a time.";
  if (m.includes("goodwill")) return "Dave asks what you've done for anyone lately.";
  if (m.includes("clear your file")) return "Clear your file first. Read the room.";
  if (m.includes("nothing on file")) return "Nothing on your file. Enjoy it.";
  if (m.includes("cover up")) return "Nothing to cover up. Yet.";
  if (m.includes("too early")) return "The cooler opens at eleven. Have some water.";
  if (m.includes("caffeinated")) return "You just had something. Give it twenty minutes.";
  if (m.includes("cycle")) return "Not enough earned this cycle yet.";
  if (m.includes("unlocked")) return "Not unlocked yet — hire more of that first.";
  if (m.includes("already owned")) return "You already have that one.";
  if (m.includes("maxed")) return "That's maxed out.";
  if (m.includes("equity")) return "Not enough equity.";
  if (m.includes("closed")) return "The office is closed to new staff.";
  if (m.includes("full")) return "The office is full.";
  if (m.includes("fetch") || m.includes("network") || m.includes("failed to"))
    return "Lost the connection for a second. Try again.";
  // Nothing matched — show the real thing rather than a shrug, so a bug
  // reports itself instead of hiding behind a friendly sentence.
  return raw ? "Error: " + raw.slice(0, 120) : "That didn't work.";
}

function wearing(p) {
  const o = p?.outfit;
  if (!o || !COSTUMES[o.id]) return null;
  if (new Date(o.until).getTime() < Date.now()) return null;
  return o;
}

/** Mail order. None of it earns you anything. That is the entire appeal. */
function Catalogue({ cat, me, pp, rate, onFitting, pins, onPin, onWear }) {
  const [which, setWhich] = useState("vanity");
  // the server quotes the price; the client's own rate sum disagrees with it
  const [quote, setQuote] = useState(null);
  useEffect(() => {
    let live = true;
    api.fittingPrices().then((q) => { if (live) setQuote(q); }).catch(() => {});
    const t = setInterval(() => {
      api.fittingPrices().then((q) => { if (live) setQuote(q); }).catch(() => {});
    }, 20000);
    return () => { live = false; clearInterval(t); };
  }, []);
  const list = (which === "vanity" ? cat.vanity : cat.office_kit) || [];
  const have = which === "vanity" ? (me?.vanity || {}) : (me?.kit || {});
  const slots = [...new Set(list.map((x) => x.slot))];
  const tierOf = (id) => (list.find((x) => x.id === id) || {}).tier || 0;
  const priceOf = (x) => quote?.prices?.[x.id]
    ?? Math.max(1000, (rate || 0) * (x.secs || 0));
  const spell = (secs) => secs >= 86400 ? Math.round(secs / 86400) + "d of output"
                        : secs >= 3600  ? Math.round(secs / 3600) + "h of output"
                        : Math.round(secs / 60) + " min of output";

  return (
    <div>
      <div className="pg-earnbar">
        None of this makes you a single point. Everybody can see all of it. Bought in order,
        kept forever, survives a restructure.
      </div>
      <div className="pg-catswitch">
        <button className={"pg-btn" + (which === "vanity" ? " on" : "")}
                onClick={() => setWhich("vanity")}>Yourself</button>
        <button className={"pg-btn" + (which === "office_kit" ? " on" : "")}
                onClick={() => setWhich("office_kit")}>Your Office</button>
      </div>

      {slots.map((slot) => {
        const tiers = list.filter((x) => x.slot === slot).sort((a, b) => a.tier - b.tier);
        const owned = tierOf(have[slot]);
        return (
          <div key={slot} className="pg-catslot">
            <h4 className="pg-h4">{SLOT_NAMES[slot] || slot}</h4>
            <div className="pg-list">
              {tiers.map((x, i) => {
                const mine = x.tier <= owned;
                const next = x.tier === owned + 1;
                const price = priceOf(x);
                const afford = pp >= price;
                return (
                  <button key={x.id}
                          className={"pg-row" + (i % 2 ? " alt" : "") + (mine ? " done" : "")
                                     + (next && !afford ? " poor" : "")}
                          disabled={!next || !afford}
                          onClick={() => onFitting(which, x)}>
                    <span className="pg-main"><b>{x.name}</b><span>{x.note}</span></span>
                    <span className="pg-right">
                      {mine ? <b>owned</b>
                            : <><b>{fmt(price)}</b>
                                <span>{next ? spell(x.secs) : "locked"}</span></>}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

const SLOT_NAMES = { glow: "Glow", size: "Presence", held: "Something To Carry",
                     aura: "Atmosphere", desk: "The Desk", chair: "The Chair",
                     rug: "The Floor", art: "The Wall" };

function Shop({ cat, me, pp, rate, clickPow, lifetime, onBuy, onUp, onRestructure,
                onFitting, pins, onPin, onWear, guard, flash }) {
  const owned = me?.owned || {}, ups = me?.upgrades || [];
  const cycle = me?.cycle || 0;
  const avail = cycle <= 1e9 ? 0 : Math.floor(1.6 * Math.log10(cycle / 1e9));
  return (
    <>
      <div className="pg-earnbar">
        Your desk earns <b>{fmt(rate)} PP/sec</b> — that's <b>{fmt(rate * 3600)} PP</b> an hour,
        whether this tab is open or not. Buy more staff to raise it.
      </div>
      <Tabsy tabs={[["hire", "Requisitions"], ["ups", "Approvals"],
                    ["today", "Today"], ["restr", "Equity"], ["cat", "Catalogue"]]}>
        {(t) => t === "cat" ? (
          <Catalogue cat={cat} me={me} pp={pp} rate={rate} onFitting={onFitting}
                     pins={pins} onPin={onPin} onWear={onWear} />
        ) : t === "hire" ? (
          <div className="pg-list">
            {(cat.items || []).map((it, i) => {
              const have = owned[it.id] || 0, c = costOf(it, have);
              const hidden = have === 0 && c > Math.max(pp, lifetime * 0.35) * 3;
              return (
                <button key={it.id} className={"pg-row" + (i % 2 ? " alt" : "") + (pp < c ? " poor" : "")}
                        onClick={() => onBuy(it)} disabled={pp < c}>
                  <span className="pg-ct">{have || "—"}</span>
                  <span className="pg-main">
                    <b>{hidden ? "Position not yet approved" : it.name}</b>
                    <span>{hidden ? "Keep earning." : it.note}</span>
                  </span>
                  <span className="pg-right">
                    <b>{fmt(c)} PP</b>
                    <span>+{fmt(it.rate * itemMult(ups, cat.upgrades, it.id))}/sec</span>
                  </span>
                </button>
              );
            })}
          </div>
        ) : t === "ups" ? (
          <div className="pg-list">
            {(cat.upgrades || []).filter((u) => (owned[u.req[0]] || 0) >= u.req[1] || ups.includes(u.id))
              .map((u, i) => (
              <button key={u.id}
                      className={"pg-row" + (i % 2 ? " alt" : "") + (ups.includes(u.id) ? " done" : pp < u.cost ? " poor" : "")}
                      onClick={() => onUp(u)} disabled={ups.includes(u.id) || pp < u.cost}>
                <span className="pg-ct">{ups.includes(u.id) ? "✓" : "—"}</span>
                <span className="pg-main"><b>{u.name}</b><span>{u.note}</span></span>
                <span className="pg-right"><b>{ups.includes(u.id) ? "owned" : fmt(u.cost)}</b>
                  <span>×{u.mult}</span></span>
              </button>
            ))}
            <div className="pg-note">Approvals unlock as you hire. They multiply what you already own.</div>
          </div>
        ) : t === "today" ? (
          <Today me={me}
            onClaim={async (i) => {
              const r = await guard(() => api.claimContract(i));
              if (r) { sfx("achieve"); flash("Contract cleared."); }
            }}
            onMail={async () => {
              const r = await guard(() => api.openMail());
              if (r) sfx("kind");
            }} />
        ) : (
          <div className="pg-pad">
            <p>Restructuring wipes your desk: points, hires and approvals all go. Your lifetime PP
              and your place on the whiteboard stay exactly where they are.</p>
            <p>You keep <b>equity</b> — a permanent <b>+3%</b> to everything, per point, forever.</p>
            <p className="pg-big">{avail} equity available</p>
            <p className="pg-small">You hold {me?.equity || 0}. Next point at {fmt(Math.pow(10, (avail + 1) / 1.6) * 1e9)} PP this cycle.</p>
            <button className="pg-btn danger" disabled={avail < 1} onClick={onRestructure}>
              Restructure the department
            </button>
            <EquityShop me={me} cat={cat}
              onBuy={async (id) => {
                const r = await guard(() => api.buyPerk(id));
                if (r) { sfx("raise"); flash("Spent."); }
              }} />
          </div>
        )}
      </Tabsy>
      <div className="pg-note">Clicking "Do actual work" gives {fmt(clickPow)} PP. Useful early,
        irrelevant later — the staff are the point.</div>
    </>
  );
}

  const worst = [...board].sort((a, b) => (b.notoriety || 0) - (a.notoriety || 0))[0];
  const hottest = [...board].sort((a, b) => (b.heat || 0) - (a.heat || 0))[0];
  return (
    <div>
      <div className="pg-tabs">
        <button className={"pg-tab" + (tab === "week" ? " on" : "")} onClick={() => setTab("week")}>This week</button>
        <button className={"pg-tab" + (tab === "all" ? " on" : "")} onClick={() => setTab("all")}>All time</button>
      </div>
      <div className="pg-earnbar">
        {tab === "week"
          ? <>Settled Friday at five. Whoever tops it gets a <b>trophy</b> that never goes away, and the new week starts straight away — the weekend counts toward it.</>
          : <>Every point anyone has ever earned. This one never resets.</>}
      </div>
      <div className="pg-list">
        {ranked.map((p, i) => (
          <div key={p.id} className={"pg-row static" + (i % 2 ? " alt" : "") + (me && p.id === me.id ? " mine" : "")}>
            <span className="pg-ct">{i + 1}</span>
            <Face src={p.avatar_url} name={p.name} size={34} />
            {p.last_seen && Date.now() - new Date(p.last_seen).getTime() < 120000 && (
              <i className="pg-here" title="on the floor now" />
            )}
            <span className="pg-main">
              <b>{p.name}{me && p.id === me.id ? " (you)" : ""}
                {p.pin && PIN_INDEX[p.pin] && (
                  <i className="pg-boardpin" title={PIN_INDEX[p.pin].name + " — " + PIN_INDEX[p.pin].note}
                     style={{ background: PIN_INDEX[p.pin].hue }}>{PIN_INDEX[p.pin].glyph}</i>
                )}
                {p.trophies > 0 && <span className="pg-trophy">{"\u25C6".repeat(Math.min(p.trophies, 5))}</span>}</b>
              <span>{roleFor(p.lifetime || 0)}{p.equity ? ` · ${p.equity} equity` : ""}
                {(p.heat || 0) >= HEAT_LIMIT ? " · under review" : ""}</span>
            </span>
            <span className="pg-right">
              <b>{fmt((tab === "week" ? p.week_pp : p.lifetime) || 0)} PP</b>
              <span>{tab === "week" ? "this week" : "lifetime"}</span>
            </span>
          </div>
        ))}
      </div>
      {feuds.length > 0 && (
        <>
          <div className="pg-feudhead">Ongoing situations</div>
          <div className="pg-list">
            {feuds.map((f, i) => (
              <div key={i} className={"pg-row static" + (i % 2 ? " alt" : "")}>
                <span className={"pg-dot " + (f.n >= 8 ? "bad" : "")} />
                <span className="pg-main">
                  <b>{f.names[0]} vs {f.names[1]}</b>
                  <span>{f.n} hostilities in 24 hours · {f.heat}</span>
                </span>
                <span className="pg-right"><b>{f.n}</b></span>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="pg-stats">
        <div><b>{kindest?.goodwill ? kindest.name : "—"}</b><span>most generous</span></div>
        <div><b>{worst?.notoriety ? worst.name : "—"}</b><span>most notorious</span></div>
        <div><b>{hottest?.heat ? hottest.name : "—"}</b><span>most heat on file</span></div>
        <div><b>{fmt(fund)}</b><span>office total</span></div>

function Targets({ good, board, me, cat, lifetime, pp, cool, onCommit, prices }) {
  const [sel, setSel] = useState(null);

    (k) => DEED_TEXT[k].good === good && !DEED_TEXT[k].office && !DEED_TEXT[k].elsewhere);
  const others = board.filter((p) => !me || p.id !== me.id);
  const target = others.find((p) => p.id === sel);
  return (
    <div>
      {cool > 0 && <div className="pg-note">Cooling off — {Math.ceil(cool / 1000)}s until you can do this again.</div>}
      {others.length === 0 && <div className="pg-note">Nobody else has badged in yet. Send them the link.</div>}

          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>
            <Face src={p.avatar_url} name={p.name} size={44} /><span>{p.name}</span>
          </button>
        ))}

      {target && cool > 0 && (
        <div className="pg-note pg-tooearly">

  );

/* ------------------------------------------------------------------
   THE COW LEVEL
   Forty five seconds. Twenty four cows. Tap them. The reward is settled
   on the server — this is where you find out what it was.
   ------------------------------------------------------------------ */
function CowLevel({ data, onDone }) {
  const [left, setLeft] = useState(45);
  const [hit, setHit] = useState([]);
  const [done, setDone] = useState(null);
  const [busy, setBusy] = useState(false);
  const herd = useRef(null);
  if (!herd.current) {
    // integer hash, not (i * k) % n — a linear formula lays the herd out on a
    // diagonal lattice, which is exactly what it looked like the first time.
    const rnd = (n) => {
      n = (n ^ 61) ^ (n >>> 16);
      n = n + (n << 3); n = n ^ (n >>> 4);
      n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
      return (n >>> 0) / 4294967296;
    };
    herd.current = Array.from({ length: data.orbs }, (_, i) => ({
      id: i,
      x: 3 + rnd(i * 3 + 1) * 82,
      y: 9 + rnd(i * 3 + 2) * 74,
      d: 5 + rnd(i * 3 + 3) * 6,
      f: rnd(i * 7 + 5) > 0.5 ? 1 : -1,
    }));
  }
  useEffect(() => {
    if (done) return;
    if (left <= 0) { finish(); return; }
    const t = setTimeout(() => setLeft((v) => v - 1), 1000);
    return () => clearTimeout(t);
  }, [left, done]);

  const finish = async () => {
    if (busy) return;
    setBusy(true);
    try {
      await api.cowFinish(hit.length);
      setDone({ got: hit.length, loot: data.loot });
    } catch { setDone({ got: hit.length, loot: data.loot, err: true }); }
  };

  const tap = (id) => {
    if (hit.includes(id) || done) return;
    sfx("moo");
    setHit((h) => h.concat(id));
  };

  return (
    <div className="pg-cowlevel">
      <div className="pg-cowsky" />
      {!done && (
        <>
          <div className="pg-cowhud">
            <b>{hit.length} / {data.orbs}</b>
            <span>{left}s</span>
          </div>
          {herd.current.map((c) => hit.includes(c.id) ? null : (
            <button key={c.id} className="pg-cow"
                    style={{ left: c.x + "%", top: c.y + "%",
                             animationDuration: c.d + "s",
                             transform: `scaleX(${c.f})` }}
                    onClick={() => tap(c.id)}>
              <svg viewBox="0 0 64 44" aria-hidden="true">
                <ellipse cx="32" cy="26" rx="21" ry="13" fill="#FBFCF7" />
                <ellipse cx="24" cy="22" rx="7" ry="5" fill="#2C2622" />
                <ellipse cx="40" cy="30" rx="5" ry="4" fill="#2C2622" />
                <rect x="16" y="36" width="5" height="8" fill="#2C2622" />
                <rect x="43" y="36" width="5" height="8" fill="#2C2622" />
                <ellipse cx="53" cy="17" rx="10" ry="9" fill="#FBFCF7" />
                <path d="M45 10c-3-4-2-7 1-6 2 1 3 3 3 5Zm16 0c3-4 2-7-1-6-2 1-3 3-3 5Z" fill="#C9B79A" />
                <ellipse cx="50" cy="16" rx="1.6" ry="2" fill="#2C2622" />
                <ellipse cx="57" cy="16" rx="1.6" ry="2" fill="#2C2622" />
                <ellipse cx="54" cy="22" rx="5" ry="3.5" fill="#E8A9A9" />
                <circle cx="52" cy="22" r="0.9" fill="#2C2622" />
                <circle cx="56" cy="22" r="0.9" fill="#2C2622" />
              </svg>
            </button>
          ))}
          <div className="pg-cowfoot">There is no cow level.</div>
        </>
      )}
      {done && (
        <div className="pg-cowdone">
          <b>{done.got} of {data.orbs}</b>
          <p>You are back at your desk. Nobody saw you leave.</p>
          <p className="pg-cowloot">{COW_LOOT[done.loot]?.name || done.loot}</p>
          <p className="pg-cowsmall">{COW_LOOT[done.loot]?.note || ""}</p>
          {done.err && <p className="pg-cowsmall">The paperwork did not go through. Tell Nick.</p>}
          <button className="pg-btn" onClick={onDone}>Back to the floor</button>
        </div>
      )}
    </div>
  );
}

function Cooler({ cat, me, onDrink }) {

function Wardrobe({ me, board, lifetime, pp, cool, cat, onDress, onChange, onCommit, onNickname, prices }) {
  const [nick, setNick] = useState("");
  const [sel, setSel] = useState(me?.id || null);
  const target = board.find((p) => p.id === sel);
  const mine = target && me && target.id === me.id;
  const worn = wearing(me);
  const list = cat.costumes || [];
  const committed = !!worn?.committed;

  return (
    <div>
      {worn && (
        <div className="pg-wearing">
          <b>You are currently wearing {COSTUMES[worn.id]?.name}.</b>
          <span>{worn.by_name ? `Courtesy of ${worn.by_name}.` : "Your own doing."}

          <div className="pg-incbtns">
            <button className="pg-btn" disabled={committed || !worn.by_name} onClick={onCommit}>

            </button>
            <button className="pg-btn danger" onClick={onChange}>

            </button>

          <div className="pg-fine">
            {worn.by_name
              ? "Wearing it out earns more than hiding does. Dignity is not one of the tracked statistics."
              : "You put this on yourself, so there's no bit to commit to. The bonus is for wearing something somebody else chose for you."}
          </div>
        </div>
      )}

      <div className="pg-earnbar">
        Costumes last 45 minutes and everyone can see them on the floor.
        Dressing yourself is half price. Dressing somebody else costs double, adds heat to your
        file, and posts to the bulletin board with your name on it.
      </div>

      <div className="pg-picks">
        {board.map((p) => (
          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>
            <Face src={p.avatar_url} name={p.name} size={44} />
            <span>{me && p.id === me.id ? "yourself" : p.name}</span>

      {target && !mine && (
        <div className="pg-nickbox">
          <h4 className="pg-h4">Call them something</h4>
          <div className="pg-field">
            <span>Nickname</span>
            <input value={nick} maxLength={18} placeholder="Two Lunches"
                   onKeyDown={(e) => e.stopPropagation()}
                   onChange={(e) => setNick(e.target.value)} />
          </div>
          <button className="pg-btn pg-wide" disabled={nick.trim().length < 2}
                  onClick={() => { onNickname(target, nick.trim()); setNick(""); }}>
            Make it stick — {fmt(prices?.nickname ?? Math.max(100, lifetime * 0.012))} PP
          </button>
          <div className="pg-fine">Hangs under their name for an hour, for everybody. They
            can't take it off, but somebody else can replace it. Keep it office-safe.</div>
        </div>

      {target && !mine && cool > 0 && (
        <div className="pg-note pg-tooearly">
          You did something to somebody {Math.ceil(cool / 60000) >= 1
            ? `${Math.ceil(cool / 60000)} minute(s)` : "moments"} ago. There's a five minute
          cooling-off period before you can do anything to a coworker again — dressing yourself
          still works.
        </div>
      )}

      {target && (
        <div className="pg-list">
          {list.map((c, i) => {
            const base = prices?.["cos_" + c.id] ?? Math.max(120, lifetime * c.cost);
            const price = base * (mine ? 1 : 2);
            const broke = pp < price;
            const cooling = !mine && cool > 0;
            const disabled = broke || cooling;
            return (
              <button key={c.id} className={"pg-row" + (i % 2 ? " alt" : "") + (disabled ? " poor" : "")}
                      disabled={disabled} onClick={() => onDress(target, c.id)}>
                <span className="pg-costume"><Hat kind={COSTUMES[c.id]?.hat} />
                  {!COSTUMES[c.id]?.hat && <i style={{ background: COSTUMES[c.id]?.shirt }} />}</span>
                <span className="pg-main"><b>{c.name}</b><span>{COSTUMES[c.id]?.note}</span></span>
                <span className="pg-right"><b>{fmt(price)}</b>
                  <span>{cool > 0 ? "cooling off" : pp < price ? "can't afford" : "PP"}</span></span>
              </button>
            );
          })}
          <div className="pg-note">
            {mine
              ? "No heat, no wire entry. Just a choice you made."
              : `${target.name} gets an incident report naming you, and the whole floor sees them wearing it.`}
          </div>
        </div>
      )}
    </div>
  );
}

function Mirror({ me, user, onSave, onLook }) {
  const [img, setImg] = useState(null);
  const [name, setName] = useState(me?.name || "");
  const [busy, setBusy] = useState(false);
  const [look, setLook] = useState(lookFor(me));
  const fileRef = useRef(null);
  const cycle = (key, list) => setLook((L) => ({
    ...L, [key]: list[(list.indexOf(L[key]) + 1) % list.length] }));
  const cycleN = (key, n) => setLook((L) => ({ ...L, [key]: ((L[key] || 0) + 1) % n }));

  const onFile = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const S = 256, cv = document.createElement("canvas");
        cv.width = S; cv.height = S;
        const ctx = cv.getContext("2d");
        const side = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
        setImg(cv.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };

  return (
    <div>
      <div className="pg-earnbar">
        Full length, slightly smudged, tilted just enough to be unflattering. Everyone checks it
        on the way past and nobody admits to it.
      </div>
      <div className="pg-mirrorrow">
        <div>
          <div className="pg-mirrorlabel">Now</div>
          <div className="pg-preview"><Body p={me} src={me?.avatar_url} /></div>
        </div>
        <div className="pg-mirrorarrow">&rarr;</div>
        <div>
          <div className="pg-mirrorlabel">After</div>
          <div className="pg-preview">
            <Body p={{ ...me, name: name || me?.name, look }} src={img || me?.avatar_url} />
          </div>
        </div>
      </div>

      <div className="pg-lookrow">
        <button className="pg-lookbtn" onClick={() => cycle("build", BUILD_LIST)}>
          <span>Build</span><b>{BUILD_LABEL[look.build]}</b>
        </button>
        <button className="pg-lookbtn" onClick={() => cycle("bottom", BOTTOM_LIST)}>
          <span>Bottoms</span><b>{BOTTOM_LABEL[look.bottom]}</b>
        </button>
        <button className="pg-lookbtn" onClick={() => cycleN("top", TOPS.length)}>
          <span>Shirt</span><i style={{ background: TOPS[look.top % TOPS.length] }} />
        </button>
        <button className="pg-lookbtn" onClick={() => cycleN("legs", LEGS.length)}>
          <span>Colour</span><i style={{ background: LEGS[look.legs % LEGS.length] }} />
        </button>
        <button className="pg-lookbtn wide" onClick={() => setLook(randomLook())}>
          <b>Shuffle</b>
        </button>
      </div>

      <div className="pg-pad">
        <button className="pg-btn ghost pg-wide" onClick={() => fileRef.current?.click()}>
          {img ? "Try a different photo" : "New badge photo"}
        </button>
        <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{ display: "none" }} />
        <label className="pg-field" style={{ marginTop: 14 }}>
          <span>Name on the badge <i className="pg-count">{name.length}/12</i></span>
          <input value={name} maxLength={12} onKeyDown={(e) => e.stopPropagation()}
                 onChange={(e) => setName(e.target.value.slice(0, 12))} />
        </label>
        <button className="pg-work big" disabled={busy}
                onClick={async () => {
                  setBusy(true);
                  await onLook(look);
                  await onSave(name.trim(), img);
                  setBusy(false);
                }}>
          {busy ? "Reissuing…" : "Reissue the badge"}
        </button>
        <div className="pg-fine">Your points, standing, streak and personnel file are untouched.
          Only the face and the name plate change.</div>
      </div>
    </div>
  );
}

function SignPapers({ name, onSigned }) {
  const [read, setRead] = useState(false);
  const [ack, setAck] = useState(false);
  const [sig, setSig] = useState(name || "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const scroller = useRef(null);

  const onScroll = (e) => {
    const el = e.target;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 24) setRead(true);
  };

  const sign = async () => {
    if (busy || !ack || sig.trim().length < 2) return;
    setBusy(true); setErr(null);
    try { onSigned(await api.signAgreement(sig.trim(), AGREEMENT_VERSION)); }
    catch (e) { setErr(e.message || "Couldn't file that."); setBusy(false); }
  };

  return (
    <div className="pg-papers">
      <div className="pg-papershead">
        <PatronMark size={30} wordmark={false} />
        <div>
          <b>Before you can earn</b>
          <span>Two documents. Standard. Everyone signs them.</span>
        </div>
      </div>

      <div className="pg-doc" ref={scroller} onScroll={onScroll}>
        {PAPERS.map((doc) => (
          <section key={doc.id} className="pg-docsec">
            <h2>{doc.title}</h2>
            <div className="pg-docsub">{doc.subtitle}</div>
            {doc.body.map(([h, t]) => (<p key={h}><b>{h}.</b> {t}</p>))}
          </section>
        ))}
        <div className="pg-docend">— end of document —</div>
      </div>

      {!read && <div className="pg-scrollnag">Scroll to the bottom. All of it. That's how this works.</div>}

      <label className={"pg-ackrow" + (read ? "" : " off")}>
        <input type="checkbox" checked={ack} disabled={!read}
               onChange={(e) => setAck(e.target.checked)} />
        <span>I have read the foregoing, or have scrolled past it convincingly.</span>
      </label>

      <div className="pg-signline">
        <label>
          <span>Signature</span>
          <input className="pg-sigfield" value={sig} disabled={!ack}
                 onChange={(e) => setSig(e.target.value.slice(0, 40))}
                 onKeyDown={(e) => { e.stopPropagation(); if (e.key === "Enter") sign(); }}
                 placeholder="type your name" />
        </label>
        <div className="pg-sigdate">
          <span>Dated</span>
          <b>{new Date().toLocaleDateString()}</b>
        </div>
      </div>

      <p className="pg-closing">{CLOSING_LINE}</p>
      {err && <div className="pg-fine pg-err">{err}</div>}
      <button className="pg-work big" disabled={!ack || sig.trim().length < 2 || busy} onClick={sign}>
        {busy ? "Filing…" : "Sign and start earning"}
      </button>
    </div>
  );
}

function CodeDoor({ onOk }) {
  const [v, setV] = useState("");
  const [busy, setBusy] = useState(false);
  const [bad, setBad] = useState(false);

  const submit = async (val) => {
    if (busy) return;
    setBusy(true); setBad(false);
    try {
      if (await checkCode(val)) { onOk(val); return; }
      setBad(true); setV("");
    } catch { setBad(true); }
    setBusy(false);
  };

  const onChange = (e) => {
    const val = e.target.value.replace(/\D/g, "").slice(0, 4);
    setV(val);
    setBad(false);
    if (val.length === 4) submit(val);
  };

  return (
    <div className="pg-door-page">
      <div className="pg-dooreyebrow">The Patron Group</div>
      <h1 className="pg-goldtitle">Idle Hands</h1>
      <p className="pg-goldrule"><span>invite only</span></p>
      <p className="pg-doorlede">Enter the four-digit code you were given.</p>
      <input className={"pg-code" + (bad ? " bad" : "")} value={v} onChange={onChange}
             inputMode="numeric" pattern="[0-9]*" maxLength={4} autoFocus
             placeholder="••••" aria-label="Invite code"
             onKeyDown={(e) => { e.stopPropagation(); if (e.key === "Enter") submit(v); }} />
      <div className="pg-codemsg">
        {busy ? "Checking…" : bad ? "That's not it. Ask whoever sent you the link." : "\u00a0"}
      </div>
      <div className="pg-doorfine">
        There is nothing behind this door until the code is right — no account is created,
        nothing is saved. If you found this by accident, you found nothing.
      </div>
    </div>
  );
}

function deptName(cat, id) {
  if (!id) return null;
  const d = (cat?.depts || []).find((x) => x.id === id);
  return d ? d.name : null;
}

function Today({ me, onClaim, onMail }) {
  const c = me?.contracts;
  const list = c?.list || [];
  const claimed = c?.claimed || [];
  const done = (k) => Number((me?.today || {})[k] || 0);
  const mail = me?.mail;
  const opened = !!mail?.opened;
  const item = mail?.item;

  return (
    <div>
      <div className="pg-earnbar">
        Three jobs a day, drawn fresh each morning. They reset when you badge in, so there is no
        way to bank them and no penalty for missing one.
      </div>
      <div className="pg-list">
        {list.length === 0 && <div className="pg-note">Nothing assigned yet. Badge in tomorrow.</div>}
        {list.map((x, i) => {
          const n = done(x.key), need = x.n;
          const got = claimed.includes(x.id);
          const ready = n >= need;
          return (
            <button key={x.id} className={"pg-row" + (i % 2 ? " alt" : "") + (got || !ready ? " poor" : "")}
                    disabled={got || !ready} onClick={() => onClaim(i)}>
              <span className="pg-ct">{got ? "✓" : ready ? "!" : Math.min(n, need) + "/" + need}</span>
              <span className="pg-main"><b>{x.label}</b>
                <span>{got ? "collected" : ready ? "ready to collect" : `${n} of ${need} so far`}</span></span>
              <span className="pg-right"><b>{got ? "—" : "collect"}</b></span>
            </button>
          );
        })}
      </div>

      <div className="pg-mail">
        <div className="pg-mailhead">Today's post</div>
        {!item ? <p className="pg-small">Nothing came for you.</p>
          : opened
            ? <p className="pg-small">{item.text}</p>
            : <>
                <p className="pg-small">An envelope is sitting on your desk. It has your name on it,
                  spelled correctly, which is unusual.</p>
                <button className="pg-btn" onClick={onMail}>Open it</button>
              </>}
      </div>
    </div>
  );
}

function EquityShop({ me, cat, onBuy }) {

  return (
    <div className="pg-equity">

      <p className="pg-small">Equity is the only thing that survives a restructure. You can hold it
        for the multiplier, or spend it here on things that change how the job works.</p>
      <div className="pg-list">
        {perks.map((k, i) => {
          const n = have(k.id), maxed = n >= k.max;
          const afford = (me?.equity || 0) >= k.cost;
          return (
            <button key={k.id} className={"pg-row" + (i % 2 ? " alt" : "") + (maxed || !afford ? " poor" : "")}
                    disabled={maxed || !afford} onClick={() => onBuy(k.id)}>
              <span className="pg-ct">{n}/{k.max}</span>
              <span className="pg-main"><b>{k.name}</b><span>{k.note}</span></span>
              <span className="pg-right"><b>{maxed ? "maxed" : k.cost + " eq"}</b></span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Gate({ onNew }) {
  const [mode, setMode] = useState(null);
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const send = async () => {
    if (!email.includes("@") || busy) return;
    setBusy(true); setMsg(null);
    try { await sendMagicLink(email.trim()); setSent(true); }
    catch (e) {
      setMsg(/not found|signups/i.test(e.message || "")
        ? "No desk found for that email. If you never added one, start a new character instead."
        : (e.message || "Couldn't send the link."));
    }
    setBusy(false);
  };

  return (
    <div className="pg-hirepage pg-gate">
      <div className="pg-gatehead">The Patron Group</div>
      <div className="pg-eyebrow">A Patron Group production · {BUILD}</div>
      <h1 className="pg-h1">Idle Hands</h1>
      <p className="pg-tagline">An idle office game. It plays while you work.</p>
      <ul className="pg-pitch">
        <li><b>Patron Points pile up every second</b> — at your desk, at lunch, overnight,
          tab closed. Come back and collect.</li>
        <li><b>Spend them on staff who earn faster.</b> Interns, then managers, then an
          offshore office you never visit.</li>
        <li><b>Most earned tops the whiteboard.</b> That's the whole score.</li>
        <li><b>Your coworkers are the rest of the game.</b> They can buy you a coffee, book you
          into a recurring meeting, or put you in a traffic cone for 45 minutes.</li>
      </ul>
      <p className="pg-fine">Takes a minute to learn. Check in twice a day and you're playing it right.</p>

      {!mode && (
        <>
          <button className="pg-work big" onClick={onNew}>I'm new — badge in</button>
          <button className="pg-btn ghost pg-wide" onClick={() => setMode("back")}>
            I've been here before
          </button>
        </>
      )}

      {mode === "back" && !sent && (
        <>
          <label className="pg-field">
            <span>Email on your badge</span>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                   onKeyDown={(e) => e.stopPropagation()} placeholder="you@work.com" autoFocus />
          </label>
          {msg && <div className="pg-fine pg-err">{msg}</div>}
          <button className="pg-work big" disabled={busy || !email.includes("@")} onClick={send}>
            {busy ? "Sending…" : "Email me a link back in"}
          </button>
          <button className="pg-btn ghost pg-wide" onClick={() => setMode(null)}>Back</button>
        </>
      )}

      {sent && (
        <div className="pg-pad">
          <div className="pg-stamp">Check your email</div>
          <p>Link sent to <b>{email}</b>. Open it on this device and you'll land back at your
            desk with every point intact.</p>
          <p className="pg-fine">Nothing in the inbox after a minute? Check spam, then try again.</p>
        </div>
      )}
    </div>
  );
}

function Account({ user, onLinked }) {
  const [email, setEmail] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const anon = !!user?.is_anonymous;

  const link = async () => {
    if (!email.includes("@") || busy) return;
    setBusy(true); setMsg(null);
    try {
      await linkEmail(email.trim());
      setMsg("Confirmation sent. Open it and your desk is saved for good.");
    } catch (e) { setMsg(e.message || "Couldn't send that."); }
    setBusy(false);
  };

  return (
    <div className="pg-pad">
      {anon ? (
        <>
          <div className="pg-stamp">Unsaved</div>
          <p>Your desk lives in <b>this browser only</b>. Closing the browser is fine — it'll
            still be here tomorrow. But it's gone for good if you clear your browsing data,
            use a private window, or switch to another computer or your phone.</p>
          <p>Add an email and it follows you anywhere.</p>
          <label className="pg-field">
            <span>Email</span>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                   onKeyDown={(e) => e.stopPropagation()} placeholder="you@work.com" />
          </label>
          {msg && <div className="pg-fine">{msg}</div>}
          <button className="pg-btn" disabled={busy || !email.includes("@")} onClick={link}>
            {busy ? "Sending…" : "Save my desk"}
          </button>
          <div className="pg-fine">One confirmation email. No password to remember — you get a
            sign-in link whenever you need one.</div>
        </>
      ) : (
        <>
          <div className="pg-stamp">Saved</div>
          <p>This desk is tied to <b>{user?.email}</b>. Sign in from any device with an emailed
            link and you'll pick up exactly where you left off, points and all.</p>
          <button className="pg-btn danger" onClick={async () => { await signOutAll(); location.reload(); }}>
            Sign out on this device
          </button>
          <div className="pg-fine">Signing out is safe now — your progress is on the server,
            not in this browser.</div>
        </>
      )}
    </div>
  );
}

function Onboard({ user, code, onDone }) {
  const [name, setName] = useState("");
  const [img, setImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const fileRef = useRef(null);

  const onFile = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const S = 256, cv = document.createElement("canvas");
        cv.width = S; cv.height = S;
        const ctx = cv.getContext("2d");
        const side = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
        setImg(cv.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };

  const go = async () => {
    if (!name.trim() || busy) return;
    setBusy(true);
    try {
      let url = null;
      if (img) { try { url = await uploadBadge(user.id, img); } catch { /* optional */ } }
      if (!code) throw new Error("missing office code — reload and enter it at the door");
      const row = await api.upsertPlayer(name.trim().slice(0, 12), url, code);
      try { await api.setLook(randomLook()); } catch { /* cosmetic */ }
      onDone(row);
    } catch (e) {
      const m = (e.message || "").toLowerCase();
      setErr(m.includes("code") ? "That's not the office code."
        : m.includes("full") ? "The office is full. Ask whoever runs it to add a desk."
        : m.includes("closed") ? "The office is closed to new staff."
        : "Couldn't badge in: " + (e.message || e));
      setBusy(false);
    }
  };

  const badgeId = "PG-" + String(
    1000 + ((name || "new").split("").reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 8999));

  return (
    <div className="pg-hirepage pg-paper">
      <div className="pg-eyebrow">Idle Hands · new hire intake · {BUILD}</div>
      <h1 className="pg-h1">Badge in</h1>
      <p className="pg-lede">Two things and you're on the floor. Everyone sees both.</p>

      <div className="pg-badge">
        <div className="pg-badgetop">
          <span><PatronMark size={16} wordmark={false} /> PATRON GROUP</span><i>EMPLOYEE</i>
        </div>
        <div className="pg-badgemain">
          <div className="pg-badgephoto">
            <Face src={img} name={name} size={74} />
            {!img && <div className="pg-badgehint">no photo<br />on file</div>}
          </div>
          <div className="pg-badgeid">
            <b>{name || "\u2014\u2014\u2014\u2014\u2014\u2014"}</b>
            <span>Probationary</span>
            <em>{badgeId}</em>
            <div className="pg-badgeline">ISSUED {new Date().toLocaleDateString()}</div>
          </div>
        </div>
        <div className="pg-barcode" aria-hidden="true">
          {Array.from({ length: 36 }).map((_, i) => (
            <i key={i} style={{ width: ((badgeId.charCodeAt(i % badgeId.length) + i * 3) % 3) + 1 }} />
          ))}
        </div>
      </div>

      <label className="pg-field">
        <span>Name on the badge <i className="pg-count">{name.length}/12</i></span>
        <input value={name} onChange={(e) => setName(e.target.value.slice(0, 12))}
               onKeyDown={(e) => e.stopPropagation()} autoComplete="off" autoFocus
               placeholder="e.g. Dana R." maxLength={12} />
        <div className="pg-fine">Twelve characters. It has to fit on a desk plate.</div>
      </label>

      <div className="pg-field">
        <span>Badge photo</span>
        <button className="pg-btn ghost pg-wide" onClick={() => fileRef.current?.click()}>
          {img ? "Use a different photo" : "Choose a photo"}
        </button>
        <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{ display: "none" }} />
        <div className="pg-fine">Cropped square. It goes on your character's head, so pick
          something you don't mind walking around as.</div>
      </div>

      {err && <div className="pg-fine pg-err">{err}</div>}
      <button className="pg-work big" disabled={!name.trim() || busy} onClick={go}>
        {busy ? "Processing paperwork…" : "Start the shift"}
      </button>
      <div className="pg-fine pg-center">You start earning the second you badge in.</div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<PatronFloor />);
} catch (err) {
  window.__boot(err && err.stack ? err.stack : String(err));
}
