function Face({ src, name, size = 40, look }) {
  const ini = (name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  return (
    <span className={look ? "pg-face pg-face-custom" : "pg-face"} style={{ width: size, height: size, fontSize: size * 0.36 }}>
      {look ? <AvatarHead look={look} src={src} size={size}/> : src ? <img src={src} alt="" /> : <b>{ini}</b>}
    </span>
  );
}

function WornPin({id}) {
  const pin=PIN_INDEX[id];
  if(!pin)return null;
  return <svg className="pg-wornpin" data-worn-pin={id} viewBox="0 0 24 24" role="img" aria-label={pin.name+" pin"}>
    <title>{pin.name+" — "+pin.note}</title>
    <circle cx="12" cy="12" r="10.5" fill={pin.hue} stroke="#2B2B2B" strokeWidth="2"/>
    <circle cx="12" cy="12" r="8" fill="none" stroke={isSpecialPin(id)?"#FFD36B":"#FFF8E6"} strokeWidth="1"/>
    <text x="12" y="16.5" textAnchor="middle" fontSize="14" fontFamily="Arial, sans-serif" fontWeight="700" fill="#FFF8E6">{pin.glyph}</text>
  </svg>;
}

function Body({ p, src, me, moving, facing = 1, emote }) {
  const worn = wearing(p);
  const c = worn ? COSTUMES[worn.id] : null;
  const L = lookFor(p);
  const v = p?.vanity || {};
  const nickOn = p?.nickname && new Date(p.nickname.until) > new Date();
  const nick = nickOn ? p.nickname.text : null;
  const B = avatarBody(L);
  const wardrobeItem=WARDROBE.find(x=>x.id===L.clothing);
  const shirt = c?.shirt || ({nora:"#343B43",gus:"#F8F1E3",theo:"#F8F1E3",iris:"#AD9AC1",wren:"#4A5260",hal:"#E3C878"}[p?.cast]) || wardrobeItem?.shirt || TOPS[L.top % TOPS.length];
  const pants = LEGS[L.legs % LEGS.length];
  const bottom = c ? "trousers" : L.bottom;      // costumes override the outfit
  const cls = [
    "pg-body", c ? "costumed" : "cutout", me ? "me" : "", c?.big ? "big" : "",
    moving ? "walking" : "idling", emote ? "em-" + emote : "",
    "style-"+(L.gender||"neutral"), "bt-" + bottom, "garment-" + (L.clothing || "starter"),
    v.glow ? "glow-" + v.glow : "", v.size ? "size-" + v.size : "",
    v.aura ? "aura-" + v.aura : "",
    MOUNTS[p?.mount] ? "riding" : "",
  ].filter(Boolean).join(" ");

  return (
    <div className={cls} style={{"--skin":AVATAR_SKIN[normalizedAvatar(L).skin]}}>
      {emote && <div className="pg-bubble">{EMOTE_ICON[emote] || "!"}</div>}
      <div className="pg-flip" style={{ transform: `scaleX(${facing})` }}>
      {/* inside the flip wrapper so the bull turns with you, and behind the rig so
          the near leg can hang over its flank */}
      {MOUNTS[p?.mount] && (
        <span className="pg-mount"><svg viewBox="0 0 74 62">{MOUNTS[p.mount].art}</svg></span>
      )}
      <div className="pg-rig">
        {c?.art && <CostumeSuit art={c.art} layer="back" />}
        {c && <Hat kind={c.hat} />}
        <span className="pg-avatar-head" style={{width:48,height:52}}><AvatarHead look={{...L,head:!p?.look?.build&&(src||p?.avatar_url)?"photo":L.head,expression:emote==="panic"?"surprised":emote==="dance"?"happy":L.expression}} src={src||p?.avatar_url} size={48}/></span>
        {c?.art && <CostumeSuit art={c.art} layer="front" />}
        <svg viewBox="0 0 60 46" className="pg-torso" aria-hidden="true">
          <path className="pg-body-outline" d={B.torso} fill={shirt} />
          {wardrobeItem&&<>
            {(L.clothing==="hoodie"||L.clothing==="hoodie_gold")&&<><path d="M21 0Q30 13 39 0" stroke="#263446" strokeWidth="4" fill="none"/><path d="M30 15v23" stroke="#DCE7EA" strokeWidth="1.5"/><path d="M20 24q10 4 20 0v10H20Z" fill="rgba(0,0,0,.13)" stroke="#2B2B2B" strokeWidth="1.5"/><path d="M26 7v9M34 7v9" stroke="#F8F1E3" strokeWidth="1.5"/></>}
            {(L.clothing==="cardigan")&&<><path d="M21 1l9 14 9-14M30 12v26" fill="none" stroke="#F4DFCE" strokeWidth="4"/><circle cx="30" cy="19" r="1.6" fill="#2B2B2B"/><circle cx="30" cy="29" r="1.6" fill="#2B2B2B"/></>}
            {L.clothing==="blazer"&&<><path d="M17 2l10 14-7 8-8-17M43 2L33 16l7 8 8-17" fill="#E5E1D8" stroke="#2B2B2B" strokeWidth="1.4"/><path d="M30 10l4 5-4 14-4-14Z" fill="#D16E5F" stroke="#2B2B2B" strokeWidth="1.3"/></>}
            {L.clothing==="hawaiian"&&<>{[[18,13],[38,19],[25,28],[42,35]].map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r="4" fill="#FFDC8E"/><path d={`M${x-2} ${y}q2-4 4 0q-2 4-4 0`} fill="#45866F"/></g>)}</>}
            {L.clothing==="friday"&&<><path d="M14 12h32M12 23h36M16 34h28" stroke="#FFD36B" strokeWidth="3" opacity=".65"/><circle cx="30" cy="14" r="5" fill="#FFF2C2" stroke="#2B2B2B" strokeWidth="1.5"/><path d="M28 14h4M28 16q2 2 4 0" stroke="#2B2B2B" strokeWidth="1"/></>}
          </>}
          {c?.skirt && <path d="M12 30h36l5 15H7Z" fill={c.skirt} />}
          {c?.tie && <path d="M30 6l4 4-4 16-4-16Z" fill={c.tie} />}
          {c?.floral && <>
            <circle cx="20" cy="18" r="3" fill="#F2E6B0" /><circle cx="40" cy="24" r="3" fill="#F2E6B0" />
            <circle cx="28" cy="31" r="2.5" fill="#F2E6B0" />
          </>}
          {!c && <>
            <path d="M30 0c-3 5-3 9 0 13 3-4 3-8 0-13Z" fill="#EDF0E6" />
            <path d="M24 1l6 3-6 4Zm12 0l-6 3 6 4Z" fill="rgba(0,0,0,.18)" />
          </>}
        </svg>
        {bottom === "skirt" && (
          <svg viewBox="0 0 60 26" className="pg-skirt" aria-hidden="true">
            <path d="M14 0h32l7 24H7Z" fill={pants} />
          </svg>
        )}
        <span className="pg-arm left"  style={{ background: shirt, "--skin":AVATAR_SKIN[normalizedAvatar(L).skin], width: B.arm, left: 30 - B.legX - 4 }} />
        <span className="pg-arm right" style={{ background: shirt, "--skin":AVATAR_SKIN[normalizedAvatar(L).skin], width: B.arm, right: 30 - B.legX - 4 }} />
        <span className="pg-leg left"  style={{ background: pants, width: B.legW, left: B.legX }} />
        <span className="pg-leg right" style={{ background: pants, width: B.legW, right: B.legX }} />
        <WornPin id={p?.pin}/>
        {p?.cast&&<CastAccessory id={p.cast}/>}
        {c?.sign && (
          <div className="pg-sign" style={{
            transform: facing < 0 ? "translateX(-50%) scaleX(-1)" : "translateX(-50%)",
          }}>{c.sign}</div>
        )}
      </div>
      </div>
      <span className="pg-shadow" />
      {v.aura && <i className={"pg-aura aura-" + v.aura}><AuraArt id={v.aura}/></i>}
      {v.held && <i className={"pg-held held-" + v.held}><HeldItemArt id={v.held}/></i>}
      {PETS[p?.pet] && (
        <span className="pg-pet"><svg viewBox="0 0 34 34">{PETS[p.pet].art}</svg></span>
      )}
      {nick && <div className="pg-nick">"{nick}"</div>}
      {c && <div className="pg-worn">{c.name}</div>}
    </div>
  );
}

function wearing(p) {
  const o = p?.outfit;
  if (!o || !COSTUMES[o.id]) return null;
  if (new Date(o.until).getTime() < Date.now()) return null;
  return o;
}

/**
 * Costumes that need more than a shirt colour. Drawn in two layers so the
 * player's photo sits inside the suit — in the dinosaur's open mouth, which
 * is exactly how those things look in real life.
 */
/** Interiors. You can see all of it. You can enter almost none of it. */
/** The rooms nobody enters are just doors. Each one tells you why. */
function DoorArt({ id }) {
  const sign = { confb: "BOOKED", lounge: "COMING SOON", restroom: "OCCUPIED",
                 meeting: "IN USE" }[id];
  return (
    <div className={"pg-door " + id}>
      <i className="frame" />
      <i className="panel" />
      <i className="knob" />
      {id === "lounge" && <i className="tape" />}
      {id === "restroom" && <i className="vac" />}
      <span className="sign">{sign}</span>
    </div>
  );
}

function MiniMap({ pos, board, meId, cam, view, chair }) {
  const W = 148, H = Math.round((ROOM.h / ROOM.w) * W);
  const sx = W / ROOM.w, sy = H / ROOM.h;
  return (
    <div className="pg-map" style={{ width: W, height: H }}>
      <div className="pg-mapwall" style={{ height: WALL_H * sy }} />
      {FIXTURES.map((f) => (
        <div key={f.id} className={"pg-mapfx" + (f.id === "owner" ? " boss" : "")}
             style={{ left: f.x * sx, top: f.y * sy,
                      width: Math.max(4, f.w * sx), height: Math.max(4, f.h * sy) }} />
      ))}
      {OFFICES.map((o) => (
        <div key={o.i} className="pg-mapoffice"
             style={{ left: o.x * sx, top: o.y * sy, width: o.w * sx, height: o.h * sy }} />
      ))}
      <div className="pg-mapview" style={{ left: cam.x * sx, top: cam.y * sy,
                                           width: view.w * sx, height: view.h * sy }} />
      {chair && <div className="pg-mapchair" style={{ left: chair.x * sx, top: chair.y * sy }} />}
      <div className="pg-mapme" style={{ left: pos.x * sx, top: pos.y * sy }} />
      <div className="pg-maplabel">You are here</div>
    </div>
  );

function useDialogFocus(onClose){
 const ref=useRef(null),closeRef=useRef(onClose);closeRef.current=onClose;
 useEffect(()=>{
  const previous=document.activeElement,root=ref.current;if(!root)return;
  root.focus({preventScroll:true});
  const key=e=>{
   const shells=document.querySelectorAll(".pg-modal");if(!shells[shells.length-1]?.contains(root))return;
   if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeRef.current?.();}
   if(e.key!=="Tab")return;
   const items=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);
   if(!items.length){e.preventDefault();return;}
   const first=items[0],last=items[items.length-1];
   if(e.shiftKey&&(document.activeElement===first||document.activeElement===root)){e.preventDefault();last.focus();}
   else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===root)){e.preventDefault();first.focus();}
  };
  document.addEventListener("keydown",key,true);
  return()=>{document.removeEventListener("keydown",key,true);if(previous?.isConnected)previous.focus({preventScroll:true});};
 },[]);
 return ref;
}

// Countdown uses the server clock; the browser timezone only formats the local note.
function weeklyTimeLeft(schedule, now = Date.now()) {
  const end = Date.parse(schedule?.ends_at), server = Date.parse(schedule?.server_now);
  if (!Number.isFinite(end) || !Number.isFinite(server) || !Number.isFinite(schedule?.received_at)) return null;
  return Math.max(0, Math.ceil((end - server - (now - schedule.received_at)) / 1000));
}
function weeklyCountdown(seconds) {
  const days = Math.floor(seconds / 86400), hours = Math.floor(seconds % 86400 / 3600);
  const mins = Math.floor(seconds % 3600 / 60), secs = seconds % 60;
  return `${days ? days + "d " : ""}${String(hours).padStart(2,"0")}h ${String(mins).padStart(2,"0")}m ${String(secs).padStart(2,"0")}s left`;
}
function WeeklyDeadline({schedule, compact=false}) {
  const [now,setNow] = useState(Date.now());
  useEffect(()=>{const timer=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(timer);},[]);
  const left=weeklyTimeLeft(schedule,now);
  if(left===null)return <div className={compact?"pg-weekclock compact":"pg-weekclock"}>Weekly deadline unavailable · reconnect to check.</div>;
  const options={weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"};
  const deadline=new Date(schedule.ends_at);
  const officeDate=new Intl.DateTimeFormat("en-US",{...options,timeZone:schedule.timezone}).format(deadline);

              <span>{roleFor(p.week_pp || 0)}{p.equity ? ` · ${p.equity} Seniority` : ""}

        </>

 const [inspected,setInspected]=useState(null),phase=((variant%3)+3)%3;
 const total=Number(office?.total),target=Number(office?.target),hasGoal=Number.isFinite(total)&&Number.isFinite(target)&&target>0;
 return <div className="pg-office-moments" data-testid="office-moments">
 <section className="pg-break-hero"><SceneryArt kind="break"/><div><h3>A meeting with no action items.</h3><p>Invite whoever is online to the break table, or send a wave. Participation is gloriously optional.</p>
 <div className="pg-break-actions"><button className="pg-btn primary" disabled={!liveReady||inviting||!canInvite} onClick={onInvite}>{inviting?"Sending invitation…":!canInvite?"Coffee break invited":"Start a coffee break"}</button><button className="pg-btn" onClick={onWave}>Wave with the room</button></div>
 <small>{!liveReady?"Live invites need a connection. Waves and kind acts are still here.":invite?"Live invitation is open for "+(names[invite.id]||"the office")+". No extra points, just company.":"A 45-second live invitation. No purchase, reward or attendance sheet."}</small></div></section>
 {office?.hit?<div className="pg-shared-goal hit"><b>THE OFFICE DID A THING.</b><span>The shared goal is met. The donut box has been promoted.</span></div>:hasGoal?<div className="pg-shared-goal"><b>One office. One snack budget.</b><meter min="0" max={target} value={Math.min(total,target)} aria-label="Shared office goal"/><span>{fmt(total)} / {fmt(target)} BW · the vending machine has the details</span></div>:null}
 <KindnessBoard wire={wire}/>
 <section className="pg-prop-stories"><h3>Developing stories. Very slowly.</h3><p>The office props have their own problems.</p><div className="pg-prop-cards">{[["plant","Inspect the plant"],["apology","Read the printer apology"],["calendar","Check the calendar"]].map(([kind,label])=><button key={kind} className={"pg-prop-card"+(inspected===kind?" selected":"")} aria-label={label} aria-pressed={inspected===kind} onClick={()=>{setInspected(kind);onInspect?.(kind,PROP_PUNCHLINES[kind][phase]);}}><SceneryArt kind={kind} variant={phase}/><b>{label}</b></button>)}</div>
 {inspected&&<p className="pg-prop-punchline" role="status">{PROP_PUNCHLINES[inspected][phase]}</p>}</section>
 <h3 className="pg-kindness-heading">Make somebody's shift better.</h3>
 </div>;

function Targets({ good, board, me, cat, lifetime, pp, cool, onCommit, prices }) {
  const [sel, setSel] = useState(null);
  const kinds = Object.keys(DEED_TEXT).filter(
    (k) => DEED_TEXT[k].good === good && !DEED_TEXT[k].office && !DEED_TEXT[k].elsewhere);
  const others = board.filter((p) => !me || p.id !== me.id);
  const target = others.find((p) => p.id === sel);
  return (
    <div>
      {cool > 0 && <div className="pg-note">Cooling off — {Math.ceil(cool / 1000)}s until you can do this again.</div>}
      {others.length === 0 && <div className="pg-note">Nobody else has badged in yet. Send them the link.</div>}
      <div className="pg-picks">
        {others.map((p) => (
          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>
            <Face src={p.avatar_url} name={p.name} look={p.look} size={44} /><span>{p.name}</span>
          </button>
        ))}
      </div>
      {target && cool > 0 && (
        <div className="pg-note pg-tooearly">
          You did something to somebody recently. There's a five minute cooling-off period
          before you can do anything to a coworker again.
        </div>
      )}

      {target && (
        <div className="pg-list">
          {kinds.map((k, i) => {
            const price = prices?.["deed_" + k]
              ?? Math.max(60, lifetime * (cat.deeds?.[k]?.cost || 0.02));
            return (
              <button key={k} className={"pg-row" + (i % 2 ? " alt" : "") + (pp < price || cool > 0 ? " poor" : "")}
                      disabled={pp < price || cool > 0} onClick={() => onCommit(target, k)}>
                <OfficeIcon kind={DEED_TEXT[k].label} compact/><span className={"pg-dot " + (good ? "good" : "bad")} />
                <span className="pg-main"><b>{DEED_TEXT[k].label}</b><span>{DEED_TEXT[k].eff}</span></span>
                <span className="pg-right"><b>{fmt(price)}</b>
                  <span>{cool > 0 ? "cooling off" : pp < price ? "can't afford" : "BW"}</span></span>
              </button>
            );
          })}
          <div className="pg-note">
            {good
              ? `${target.name} gets an incident report with your name on it. Every kind act is +1% to your own output, forever, up to 30.`
              : `${target.name} will be told exactly who did this. Each one also puts heat on your file — five and Dave wants a word.`}
          </div>
        </div>
      )}
    </div>
  );
}

function Owner({ me, board, lifetime, pp, cool, cat, prices, onMeeting, onRaise, onBlame }) {
  const [sel, setSel] = useState(null);
  const heat = me?.heat || 0;
  const others = board.filter((p) => p.id !== me?.id);
  const target = others.find((p) => p.id === sel);
  // the server prices these off current output; lifetime never resets
  const meetingCost = prices?.meeting ?? Math.max(500, lifetime * 0.05);
  const raiseCost   = prices?.raise   ?? Math.max(1000, lifetime * 0.12);
  // build guard 7: never price from lifetime without a server quote behind it.
  // all_prices() publishes deed_blame from deed_price(), which is seconds of CURRENT
  // output and therefore resets on restructure. lifetime never resets.
  const blameCost = prices?.deed_blame
    ?? (cat.deeds?.blame ? null : null);   // no local fallback: there is no safe one
  return (
    <div>
      <div className="pg-boss-hero">
        <div className="pg-bossdoor" />
        <div><b>Dave</b><span>Owner. Sees everything. Mentions almost none of it.</span></div>
      </div>
      <div className="pg-stats">
        <div><b>{heat}</b><span>heat on your file</span></div>
        <div><b>{me?.raises || 0}</b><span>raises · +{(me?.raises || 0) * 2}%</span></div>
      </div>
      <div className="pg-note">
        {heat >= HEAT_LIMIT
          ? "Dave is looking at you over the top of his monitor. Output down 25% until this is sorted."
          : heat > 0
            ? `Dave has heard some things. ${HEAT_LIMIT - heat} more and he'll want the meeting.`
            : "Your file is clean. Dave has no reason to know your name, which is the goal."}
      </div>
      <div className="pg-list">
        <button className={"pg-row" + (heat <= 0 || pp < meetingCost ? " poor" : "")}
                disabled={heat <= 0 || pp < meetingCost} onClick={onMeeting}>
          <span className="pg-dot good" />
          <span className="pg-main"><b>Take the meeting</b><span>Own it. Clears every point of heat.</span></span>
          <span className="pg-right"><b>{fmt(meetingCost)}</b><span>BW</span></span>
        </button>
        <button className={"pg-row alt" + (heat > 0 || (me?.goodwill || 0) < 3 || pp < raiseCost ? " poor" : "")}
                disabled={heat > 0 || (me?.goodwill || 0) < 3 || pp < raiseCost} onClick={onRaise}>
          <span className="pg-dot good" />
          <span className="pg-main"><b>Ask for a raise</b>
            <span>+2% output permanently. Needs a clean file and 3 goodwill.</span></span>
          <span className="pg-right"><b>{fmt(raiseCost)}</b><span>BW</span></span>
        </button>
      </div>
      <div className="pg-note">Or don't own it at all:</div>
      <div className="pg-picks">
        {others.map((p) => (
          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>
            <Face src={p.avatar_url} name={p.name} look={p.look} size={44} /><span>{p.name}</span>
          </button>
        ))}
      </div>
      {target && cool > 0 && (
        <div className="pg-note pg-tooearly">
          You did something to somebody recently. There's a five minute cooling-off period
          before you can do anything to a coworker again.
        </div>
      )}

      {target && (
        <div className="pg-list">
          <button className={"pg-row" +
                    ((blameCost != null && pp < blameCost) || cool > 0 || heat <= 0 ? " poor" : "")}
                  disabled={blameCost == null || pp < blameCost || cool > 0 || heat <= 0}
                  onClick={() => onBlame(target, "blame")}>
            <span className="pg-dot bad" />
            <span className="pg-main"><b>Pin it on {target.name}</b>
              <span>Your heat goes to zero. Three points land on theirs. The wire names you.</span></span>
            <span className="pg-right"><b>{blameCost == null ? "\u2026" : fmt(blameCost)}</b>
              <span>BW</span></span>
          </button>
        </div>
      )}
    </div>
  );
}

function Wire({ wire, feed, lifetime, onPineapple, testers, prices }) {
  return (
    <>
      {(testers || []).length > 0 && (
        <div className="pg-betanote">
          <b>β  Opening Week</b>
          <span>{testers.join(" · ")} were here before it worked.</span>
        </div>
      )}
    <div className="pg-list">
      {wire.length === 0 && <div className="pg-note">Nothing has happened yet. Somebody should do something.</div>}
      {wire.map((d, i) => {
        const T = DEED_TEXT[d.kind];
        if (!T || typeof T.wire !== "function") return null;   // never crash the board
        return (
          <div key={d.id} className={"pg-row static" + (i % 2 ? " alt" : "")}>
            <span className={"pg-dot " + (T.good ? "good" : "bad")} />
            <span className="pg-main"><b>{T.wire(d.from, d.toName, d.amount, COSTUMES[d.detail]?.name)}</b><span>{ago(d.created_at)}</span></span>
          </div>
        );
      })}
      <div className="pg-note">Everything anyone does to anyone lands here, with names attached.</div>
      <div className="pg-pad">
        <button className="pg-btn danger" onClick={onPineapple}>
          Say pineapple <em>{fmt(prices?.pineapple ?? Math.max(200, lifetime * 0.08))} BW</em>
        </button>
        <div className="pg-fine">Scrubs your name off your most recent entry. The deed still
          happened — the wire just says "Someone".</div>

        {feed.slice(0, 12).map((f) => <div key={f.k} className={"pg-memo " + (f.tone || "")}>{f.text}</div>)}
      </div>
    </div>
    </>
  );
}

/** What you've poured into things that do nothing, and who has poured more. */

  const all = Object.values(PIN_INDEX);

                    <span className="pg-main">
                      <b>{has ? CRITTERS[id].name : "\u2014"}</b>

                      <b className="pg-got">{has ? (out ? "Out" : "Away") : "\u2014"}</b></span>

      <h4 className="pg-h4">Your Collection</h4>

      <div className="pg-spendrow"><b>Pins collected</b>
        <span>{mine?.pins || 0} of {mine?.total_pins || 0}</span></div>

      {owned.length > 0 && (
        <>
          <h4 className="pg-h4">Wear One</h4>
          <div className="pg-pinshelf">
            {all.filter((x) => owned.includes(x.id))

                    aria-label={(me?.pin===x.id?"Remove ":"Wear ")+x.name} aria-pressed={me?.pin===x.id}
                    className={"pg-pinchip" + (me?.pin === x.id ? " on" : "")}
                    style={{ background: x.hue,
                             boxShadow: isSpecialPin(x.id)
                               ? "0 0 0 2px #C9A253, 0 0 12px rgba(201,162,83,.7)" : undefined }}

          <div className="pg-fine" role="status">{PIN_INDEX[me?.pin]?"Wearing: "+PIN_INDEX[me.pin].name+". Tap again to take it off.":"Tap a pin to wear it on your character."}</div>
        </>
      )}

      <h4 className="pg-h4">Biggest Spenders</h4>
      <div className="pg-list">
        {(spend?.top || []).length === 0 && <div className="pg-note">Nobody has bought anything yet.</div>}
        {(spend?.top || []).map((r, i) => (
          <div key={r.name} className={"pg-row" + (i % 2 ? " alt" : "")}>
            <span className="pg-main"><b>{i + 1}. {r.name}</b>
              <span>{r.pieces} piece{r.pieces === 1 ? "" : "s"}</span></span>

            {depts.map((d, i) => (
              <button key={d.id}
                      className={"pg-row" + (i % 2 ? " alt" : "") + (me?.dept === d.id ? " mine" : "")}

                <OfficeIcon kind={d.name+" personnel"} compact/><span className="pg-ct">{me?.dept === d.id ? "✓" : "·"}</span>

            Everything above is visible to whoever asks, which is the arrangement you agreed to.

      ) : (
        <div className="pg-list">
          <div className="pg-earnbar">Office commendations · stories for your personnel file. Cosmetic awards; no Busywork bonuses.</div>
          <h4 className="pg-h4">Office legends · new commendations</h4>
          {PERSONNEL_COMMENDATIONS.map((a,i)=><div key={a.id} data-office-award={a.id} className={"pg-row static pg-office-award"+(i%2?" alt":"")}>
            <OfficeIcon kind="star senior badge"/><span className="pg-main"><b>{a.name}</b><span>{a.note}</span><em className="pg-award-goal">{a.goal}</em></span>
            <span className="pg-right"><b className={have.includes(a.id)?"pg-got":""}>{have.includes(a.id)?"Earned":"To earn"}</b></span>
          </div>)}
          <h4 className="pg-h4">The original personnel file</h4>

        </div>

const FACES = ["$", "+", "—", "?", "*", "!"];

function Fund({ fund, nextTier, prevTier, office, card, pp, quote, onVend, onSign }) {
  const [prize, setPrize] = useState(null);
  const [vending, setVending] = useState(false);
  const [reel, setReel] = useState("?");
  const vendPrice = quote?.vend ?? 0;
  const signed = !!card?.mine;
  const need = Math.max(0, (card?.staff || 0) - (card?.signers?.length || 0));
  const unlocked = FUND_TIERS.filter((t) => fund >= t.at).length;
  const g = office?.goal || {};
  const pct = office ? Math.min(100, (office.total / office.target) * 100) : 0;
  return (
    <div>
      <div className={"pg-margbox" + (office?.hit ? " won" : "")}>
        <div className="pg-mailhead">This week's office goal</div>
        <b className="pg-marghead">{g.name || "The Margarita Machine"}</b>
        <p className="pg-small">{g.blurb}</p>
        <div className="pg-progress"><i style={{ width: pct + "%" }} /></div>
        <p className="pg-small">
          <b>{fmt(office?.total || 0)}</b> of {fmt(office?.target || 0)} BW earned by the office
          this week. Individual scores don't matter here — only the pile.
        </p>
        {office?.hit
          ? <p className="pg-small pg-got"><b>Bought.</b> {g.won}</p>
          : <p className="pg-small">Miss it and the streak resets. Hit it and it stays in the
              break room for as long as the office keeps hitting it.</p>}
        <div className="pg-stats">
          <div><b>{office?.streak || 0}</b><span>week streak · +{2 * Math.min(office?.streak || 0, 10)}% each</span></div>
          <div><b>{office?.best || 0}</b><span>best run</span></div>
        </div>
      </div>
      <div className="pg-earnbar">
        Everyone's lifetime Busywork, pooled. Nobody spends it — it decides what the office
        gets. <b>Every tier the office passes gives every single person a permanent +3% to
        output.</b> Nine people earning slowly beats one person earning fast.
      </div>
      <div className="pg-stats">
        <div><b>{unlocked}</b><span>tiers unlocked</span></div>
        <div><b>+{unlocked * 3}%</b><span>on every desk, forever</span></div>
      </div>
      <div className="pg-pad">
        <div className="pg-progress">
          <i style={{ width: Math.min(100, (fund / nextTier.at) * 100) + "%" }} />
        </div>
        <p className="pg-small"><b>{fmt(fund)}</b> of {fmt(nextTier.at)} BW toward
          <b> {nextTier.label}</b></p>
      </div>
      <div className="pg-list">
        {FUND_TIERS.map((t, i) => {
          const got = fund >= t.at;
          return (
            <div key={t.at} className={"pg-row static" + (i % 2 ? " alt" : "") + (got ? "" : " poor")}>
              <span className="pg-ct">{got ? "✓" : "·"}</span>
              <span className="pg-main">
                <b>{t.label}</b>
                <span>{fmt(t.at)} BW pooled</span>
              </span>
              <span className="pg-right">
                <b className={got ? "pg-got" : ""}>+3%</b>
                <span>{got ? "active" : "locked"}</span>
              </span>
            </div>
          );
        })}
      </div>
      {prevTier && <div className="pg-note">Most recently unlocked: {prevTier.label}. Everybody
        felt that, whether they noticed or not.</div>}

      <div className="pg-sep" />
      <h4 className="pg-h4">The Machine</h4>
      <p className="pg-note">Put money in. Something comes out. Usually.</p>

      <div className={"pg-slot" + (vending ? " pulling" : "") + (prize ? " landed" : "")}>
        <div className="pg-slotwin">
          <span className="pg-slotreel">{vending ? reel : (prize ? prize.glyph : "?")}</span>
        </div>
        <div className="pg-slotout">
          {vending ? "..." : prize ? prize.text : "Nothing in the tray."}
        </div>
      </div>

      <button className="pg-btn pg-wide danger" disabled={vending || pp < vendPrice}
              onClick={async () => {
                setVending(true); setPrize(null);
                const spin = setInterval(() => setReel(FACES[Math.floor(Math.random() * FACES.length)]), 90);
                const got = await onVend();
                setTimeout(() => {
                  clearInterval(spin);
                  setPrize(got ? { text: got.text || "Something fell out.",
                                   glyph: got.kind === "pp" ? "$" : got.mult ? "+" : "—" } : null);
                  setVending(false);
                }, 1100);
              }}>
        {vending ? "..." : pp < vendPrice ? "Not enough for a pull" : "Pull — " + fmt(vendPrice) + " BW"}
      </button>
      <div className="pg-fine">One pull every ten minutes. Nine things can come out and one of
        them is nothing at all. The machine does not negotiate.</div>

      {card && (
        <>
          <div className="pg-sep" />
          <h4 className="pg-h4">The Birthday Card</h4>
          <p className="pg-note">
            {card.paid
              ? "Everybody signed. The cake happened. It was fine."
              : need === 0
                ? "Everyone has signed. Something is about to happen."
                : `${card.signers?.length || 0} of ${card.staff} have signed. ${need} to go.`}
          </p>
          <button className="pg-btn pg-wide" onClick={onSign} disabled={signed || card.paid}>
            {card.paid ? "Already done" : signed ? "You signed it" : "Sign the card"}
          </button>
          <div className="pg-fine">Everyone chips in. When the last person signs the pot doubles,
            splits, and there's cake for half an hour. One holdout stops everybody.</div>
        </>
      )}
    </div>
  );
}

/* What a pineapple says when it goes. Mostly PINEAPPLE. Occasionally not.
   Pineapple is already the word you say in this office when something needs to
   not have happened, which is why it gets its own level. */
const LAST_WORDS = ["PINEAPPLE", "PINEAPPLE", "PINEAPPLE", "PINEAPPLE!", "PINEAPPLE?",
                    "OW", "RUDE", "WHY", "NOTED", "UNSUBSCRIBE", "PER MY LAST PINEAPPLE",
                    "OK", "SUPER WEIRD", "CIRCLE BACK", "HR", "I QUIT"];

/* ------------------------------------------------------------------
   THE PINEAPPLE LEVEL
   Forty five seconds. Twenty four pineapples. Tap them. The reward is settled
   on the server — this is where you find out what it was.
   ------------------------------------------------------------------ */
function CowLevel({ data, onDone }) {
  const [left, setLeft] = useState(45);
  const [hit, setHit] = useState([]);
  const [pops, setPops] = useState([]);
  const [splats, setSplats] = useState([]);   // these never clear — the mess builds up
  const [stage, setStage] = useState("run");     // run -> prize -> open -> done
  const [result, setResult] = useState(null);
  const [combo, setCombo] = useState(0);
  const [shake, setShake] = useState(0);
  const settling = useRef(false);
  const comboRef = useRef(0);
  const lastTap = useRef(0);
  const hitRef = useRef([]);      // taps land faster than React re-renders; state alone drops them
  const herd = useRef(null);
  const junk = useRef(null);

  if (!herd.current) {
    // integer hash, not (i * k) % n — a linear formula lays the herd out on a
    // diagonal lattice, which is exactly what it looked like the first time.
    const rnd = (n) => {
      n = (n ^ 61) ^ (n >>> 16);
      n = n + (n << 3); n = n ^ (n >>> 4);
      n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
      return (n >>> 0) / 4294967296;
    };
    herd.current = Array.from({ length: data.orbs }, (_, i) => ({
      id: i,
      x: 4 + rnd(i * 5 + 1) * 78,
      y: 10 + rnd(i * 5 + 2) * 70,
      // three speeds: a lazy few, a brisk middle, and the bolters
      dur: 1.9 + rnd(i * 5 + 3) * 2.6,
      dx: (rnd(i * 5 + 4) * 2 - 1) * 42,
      dy: (rnd(i * 5 + 5) * 2 - 1) * 26,
      f: rnd(i * 9 + 7) > 0.5 ? 1 : -1,
      runner: rnd(i * 17 + 11) > 0.74,          // a few bolt about and are harder to hit
      lazy: rnd(i * 23 + 3) > 0.68,             // and a few barely move, so it is not uniform
    }));
    herd.current.forEach((c) => {
      if (c.runner) { c.dur = 0.75 + c.dur * 0.16; c.dx *= 2.6; c.dy *= 1.8; c.lazy = false; }
      else if (c.lazy) { c.dur = c.dur * 2.1; c.dx *= 0.45; c.dy *= 0.5; }
    });
    junk.current = ["PINEAPPLE", "SYNERGY", "PINEAPPLE", "PATRON STANDARD TIME", "PINEAPPLE",
                    "PLEASE HOLD", "CIRCLE BACK", "PINEAPPLE", "LET'S TAKE THIS OFFLINE",
                    "PINEAPPLE", "PER MY LAST EMAIL", "SUPER WEIRD", "PINEAPPLE", "IDEALLY",
                    "YOU'RE ON MUTE", "PINEAPPLE", "SI SENOR", "THE REALITY IS"].map((t, i) => ({
      id: i, t, top: 8 + rnd(i * 11 + 3) * 78, dur: 7 + rnd(i * 11 + 4) * 8,
      delay: rnd(i * 11 + 5) * 9,
    }));
  }

  /* the music. Gets faster and higher as the field empties. Stops itself on unmount. */
  const gone = hit.length;
  const step = Math.min(4, Math.floor(gone / 5));         // 0..4, restarts the loop
  useEffect(() => {
    if (stage !== "run") return;
    wakeAudio();
    const BASS = [55, 55, 82, 73, 55, 55, 65, 73];
    const LEAD = [330, 392, 440, 392, 330, 294, 262, 294, 330, 440, 523, 440];
    const lift = 1 + step * 0.09;
    let i = 0;
    const id = setInterval(() => {
      tone({ freq: BASS[i % BASS.length] * lift, dur: 0.24, type: "sawtooth", vol: 0.05 });
      tone({ freq: LEAD[i % LEAD.length] * lift, dur: 0.16, type: "square", vol: 0.028, delay: 0.05 });
      if (i % 2 === 0) noise({ dur: 0.04, vol: 0.022, hp: 1400 });
      if (i % 8 === 0) tone({ freq: 1046 * lift, to: 1568 * lift, dur: 0.3, type: "triangle", vol: 0.02 });
      if (step >= 3 && i % 4 === 2) tone({ freq: 82 * lift, dur: 0.1, type: "square", vol: 0.035 });
      i++;
    }, 250 - step * 26);
    return () => clearInterval(id);
  }, [step, stage]);

  /* the clock */
  useEffect(() => {
    if (stage !== "run") return;
    if (left <= 0) { settle(hitRef.current.length); return; }
    const t = setTimeout(() => setLeft((v) => v - 1), 1000);
    return () => clearTimeout(t);
  }, [left, stage]);

  const settle = async (n) => {
    if (settling.current) return;
    settling.current = true;
    const full = n >= data.orbs;
    try {
      await api.cowFinish(n);
      setResult({ got: n, full, loot: data.loot });
    } catch {
      setResult({ got: n, full, loot: data.loot, err: true });
    }
    setStage(full ? "prize" : "done");
  };

  const tap = (c) => {
    if (stage !== "run" || hitRef.current.includes(c.id)) return;
    hitRef.current = hitRef.current.concat(c.id);   // authoritative; state is for rendering

    const t = Date.now();
    const run = t - lastTap.current < 1300 ? comboRef.current + 1 : 1;
    comboRef.current = run; lastTap.current = t;
    setCombo(run);

    // the moo climbs with the combo instead of being one flat sample
    const up = Math.pow(1.055, Math.min(run, 16));
    wakeAudio();
    // a wet burst rather than a lowing: short, bright, falling
    tone({ freq: 560 * up, to: 190 * up, dur: 0.15, type: "triangle", vol: 0.075 });
    tone({ freq: 240 * up, to: 90 * up, dur: 0.22, type: "sine", vol: 0.05, delay: 0.02 });
    noise({ dur: 0.09, vol: 0.035, hp: 1100 });
    if (c.runner) tone({ freq: 1040 * up, to: 2080, dur: 0.16, type: "square", vol: 0.04 });

    setHit(hitRef.current);
    setShake(t);
    setTimeout(() => setShake((v) => (v === t ? 0 : v)), 200);
    const say = c.runner ? "PINEAPPLE!!" : LAST_WORDS[(c.id * 7 + run) % LAST_WORDS.length];
    setPops((p) => p.concat({ id: c.id, x: c.x, y: c.y, run, gold: c.runner, say }));
    setTimeout(() => setPops((p) => p.filter((q) => q.id !== c.id)), 620);
    // the splat stays for the rest of the run
    setSplats((v) => v.concat({
      id: c.id, x: c.x, y: c.y,
      rot: (c.id * 47) % 360,
      scale: 0.85 + ((c.id * 13) % 60) / 100,
      gold: c.runner,
    }));
    if (hitRef.current.length >= data.orbs) settle(hitRef.current.length);
  };

  const openPrize = () => {
    if (stage !== "prize") return;
    sfx("cowin");
    setStage("open");
    setTimeout(() => setStage("done"), 1500);
  };

  const pet = CRITTERS[result?.loot] || null;

  return (
    <div className={"pg-cowlevel" + (stage === "run" ? " live" : "") +
                    (shake ? " shaking" : "") + (step >= 3 ? " frantic" : "")}>
      <div className="pg-cowsky" style={{ animationDuration: (1.6 - step * 0.26) + "s" }} />
      <div className="pg-cowhaze" />

      {splats.map((sp) => (
        <div key={"splat" + sp.id} className={"pg-splat" + (sp.gold ? " gold" : "")}
             style={{ left: sp.x + "%", top: sp.y + "%",
                      transform: `translate(-50%,-50%) rotate(${sp.rot}deg) scale(${sp.scale})` }}>
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <path d="M60 12c13 0 17 14 27 17s21-6 27 4-8 18-8 27 12 15 7 25-19 3-27 9-9 20-20 22
                     -17-10-27-11-19 9-27 2-1-19-5-27-17-11-16-22 14-13 18-22 1-20 12-23 26 6 39-1Z"
                  fill="rgba(240,190,70,.88)" />
            <circle cx="16" cy="30" r="7" fill="rgba(240,190,70,.72)" />
            <circle cx="104" cy="88" r="9" fill="rgba(240,190,70,.72)" />
            <circle cx="30" cy="104" r="5" fill="rgba(240,190,70,.68)" />
            <circle cx="96" cy="20" r="4" fill="rgba(240,190,70,.68)" />
            <ellipse cx="46" cy="52" rx="9" ry="6" fill="rgba(176,126,28,.85)" />
            <ellipse cx="76" cy="70" rx="7" ry="5" fill="rgba(176,126,28,.8)" />
            <ellipse cx="62" cy="38" rx="5" ry="4" fill="rgba(94,140,80,.75)" />
          </svg>
        </div>
      ))}

      {stage === "run" && junk.current.map((j) => (
        <div key={j.id} className="pg-cowjunk"
             style={{ top: j.top + "%", animationDuration: j.dur + "s",
                      animationDelay: "-" + j.delay + "s" }}>{j.t}</div>
      ))}

      {pops.map((p) => (
        <div key={"pop" + p.id} className={"pg-cowpop" + (p.gold ? " gold" : "")}
             style={{ left: p.x + "%", top: p.y + "%" }}>
          <i /><i /><i /><i /><i /><i /><i /><i /><i /><i /><i /><i />
          <u /><u /><u /><u />
          <b>{p.run >= 3 ? p.say + " x" + p.run : p.say}</b>
        </div>
      ))}

      {stage === "run" && (
        <>
          <div className="pg-cowhud">
            <b>{hit.length} / {data.orbs}</b>
            <span>{left}s</span>
          </div>
          {combo >= 3 && <div key={combo} className="pg-cowcombo">x{combo}</div>}
          {herd.current.map((c) => hit.includes(c.id) ? null : (
            <button key={c.id} className={"pg-cow" + (c.runner ? " runner" : "")}
                    style={{ left: c.x + "%", top: c.y + "%",
                             "--dx": c.dx + "vw", "--dy": c.dy + "vh",
                             "--f": c.f, animationDuration: c.dur + "s" }}
                    onClick={() => tap(c)}>
              <svg viewBox="0 0 52 74" aria-hidden="true">
                <path d="M26 22c-2-9-7-14-12-15 3 5 4 10 4 15Zm0 0c2-9 7-14 12-15-3 5-4 10-4 15Z"
                      fill="#3F7449" />
                <path d="M26 22c-4-10-4-17-2-21 3 4 4 11 4 21Zm0 0c4-10 4-17 2-21-3 4-4 11-4 21Z"
                      fill="#4E8B5A" />
                <path d="M26 21c-3-6-8-9-13-8 4 3 7 6 9 9Zm0 0c3-6 8-9 13-8-4 3-7 6-9 9Z"
                      fill="#5C9E68" />
                <ellipse cx="26" cy="46" rx="19" ry="25" fill="#E0A82E" />
                <ellipse cx="20" cy="40" rx="9" ry="13" fill="#EDBE4C" opacity=".55" />
                <path d="M8 34l18 12M26 22l18 12M8 46l18 12M26 34l18 12M8 58l18 12M26 46l18 12"
                      stroke="#B07E1C" strokeWidth="1.5" fill="none" opacity=".8" />
                <path d="M44 34L26 46M26 34 8 46M44 46 26 58M26 46 8 58M44 58 26 70M26 58 8 70"
                      stroke="#B07E1C" strokeWidth="1.5" fill="none" opacity=".8" />

  const [sel, setSel] = useState(me?.id || null);
  const target = board.find((p) => p.id === sel);
  const mine = target && me && target.id === me.id;

  const list = cat.costumes || [];

  return (

      {worn && (
        <div className="pg-wearing">

      <div className="pg-earnbar">

        Dressing yourself is half price. Dressing somebody else costs double, adds heat to your
        file, and posts to the bulletin board with your name on it.

      <div className="pg-picks">
        {board.map((p) => (
          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>

          cooling-off period before you can do anything to a coworker again — dressing yourself
          still works.

        <div className="pg-list">

                  <span className="pg-right"><b>{fmt(price)}</b>
                    <span>{cooling ? "cooling off" : broke ? "can't afford" : "BW"}</span></span>
                </button>
                <button type="button" className="pg-costume-inspect" aria-label={"Preview "+c.name} aria-expanded={preview===c.id} aria-controls={"costume-detail-"+c.id}

                {preview===c.id&&<div className="pg-costume-detail" id={"costume-detail-"+c.id} data-testid="costume-detail">

          <div className="pg-note">
            {mine

          </div>
        </div>
      )}
    </div>
  );

function Mirror({ me, user, onSave, onLook, onBuyClothing }) {
  const [img, setImg] = useState(null);
  const [name, setName] = useState(me?.name || "");
  const [busy, setBusy] = useState(false);
  const [look, setLook] = useState(normalizedAvatar({...lookFor(me),head:!me?.look?.build&&me?.avatar_url?"photo":me?.look?.head}));
  const [photoBusy,setPhotoBusy]=useState(false),[photoError,setPhotoError]=useState(null);
  const fileRef = useRef(null);
  const onFile=async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;setPhotoBusy(true);setPhotoError(null);try{const photo=await prepareBadgePhoto(file);setImg(photo);setLook(v=>({...v,head:"photo"}));}catch(error){setPhotoError(error.message);}finally{setPhotoBusy(false);}};
  const saveClothingLook=next=>onLook(img&&next.head==="photo"?{...next,head:me?.look?.head||"classic"}:next);

  return (
    <div>
      <div className="pg-earnbar">
        Full length, slightly smudged, tilted just enough to be unflattering. Everyone checks it
        on the way past and nobody admits to it.
      </div>
      <div className="pg-mirrorrow">
        <div>
          <div className="pg-mirrorlabel">Now</div>
          <div className="pg-preview"><Body p={me} src={me?.avatar_url} /></div>
        </div>
        <div className="pg-mirrorarrow">&rarr;</div>
        <div>
          <div className="pg-mirrorlabel">After</div>
          <div className="pg-preview">
            <Body p={{ ...me, name: name || me?.name, look }} src={img||me?.avatar_url} />
          </div>
        </div>
      </div>

      <AvatarControls value={look} onChange={setLook} photoSrc={img||me?.avatar_url} onUpload={()=>fileRef.current?.click()} photoBusy={photoBusy} photoError={photoError} photoMessage={img?"Photo ready to preview. Reissue the badge to save your face.":null}/>
      <input ref={fileRef} type="file" aria-label="Upload custom face" accept="image/jpeg,image/png,image/webp,image/gif" onChange={onFile} hidden/>
      <div className="pg-wardrobe-stock">
        <h4 className="pg-h4">Company wardrobe · permanent purchases</h4>
        <p className="pg-fine">Spend Busywork on ridiculous outfits. Keep every purchased piece, even after restructuring. Clothes are cosmetic—no productivity bonuses.</p>
        <button className={"pg-row"+(look.clothing==="starter"?" mine":"")} type="button" disabled={busy} onClick={async ()=>{const next={...look,clothing:"starter"};setBusy(true);try{await saveClothingLook(next);setLook(next);}catch{}finally{setBusy(false);}}}><OfficeIcon kind="office shirt"/><span className="pg-main"><b>Standard Issue Outfit</b><span>Free. Disturbingly adequate.</span></span><span className="pg-right"><b>{look.clothing==="starter"?"Wearing":"Equip"}</b></span></button>
        {WARDROBE.map(it=>{
          const owned=Array.isArray(me?.wardrobe_owned)&&me.wardrobe_owned.includes(it.id);
          const active=look.clothing===it.id;
          return <button className={"pg-row"+(active?" mine":"")} type="button" key={it.id} disabled={busy} onClick={async ()=>{
            setBusy(true);
            try {
              if(!owned){const saved=await onBuyClothing(it.id);if(!saved)return;}
              const next={...look,clothing:it.id};
              await saveClothingLook(next);
              setLook(next);
            } catch { /* onLook reports the server error; keep previous selection */ }
            finally {setBusy(false);}
          }}>
            <WardrobeIcon id={it.id}/><span className="pg-main"><b>{it.name}</b><span>{it.detail}</span></span>
            <span className="pg-right"><b>{active?"Wearing":owned?"Equip":fmt(it.cost)+" BW"}</b></span>
          </button>;
        })}
      </div>
      <div className="pg-pad">
        <label className="pg-field" style={{ marginTop: 14 }}>
          <span>Name on the badge <i className="pg-count">{name.length}/12</i></span>
          <input value={name} maxLength={12} onKeyDown={(e) => e.stopPropagation()}
                 onChange={(e) => setName(e.target.value.slice(0, 12))} />
        </label>
        <button className="pg-work big" disabled={busy||photoBusy}
                onClick={async () => {
                  setBusy(true);
                  try {
                    setPhotoError(null);
                    await onSave(name.trim(), img, look);
                  } catch(error) {
                    setPhotoError(error.message||"Could not save your badge. Please try again.");
                    fileRef.current?.parentElement?.querySelector(".pg-head-picker")?.scrollIntoView({block:"start"});
                  } finally {
                    setBusy(false);
                  }
                }}>
          {busy ? "Reissuing…" : "Reissue the badge"}
        </button>
        <div className="pg-fine">Your points, standing, streak and personnel file are untouched.
          Only the face and the name plate change.</div>
      </div>
    </div>
  );
}

function SuggestionBox({ sugg, me, admin, onSend, onJudge }) {
  const [t, setT] = useState("");
  const [filing,setFiling]=useState(false);
  const isAdmin = me && admin && me.id === admin;
  const mine = (sugg || []).filter((x) => x.author === me?.id);
  const pending = (sugg || []).filter((x) => !x.approved);
  const live = (sugg || []).filter((x) => x.approved);
  return (
    <div>
      <div className="pg-earnbar">
        Write a memo. If it's approved it joins the rotation on the office wire and everybody
        reads it, forever, at random, with no explanation.
      </div>
      <div className="pg-pad">
        <textarea className="pg-suggest" maxLength={160} value={t}
                  onKeyDown={(e) => e.stopPropagation()}
                  onChange={(e) => {
                    const v = e.target.value;
                    // legal have asked us not to discuss it
                    setT(/pineapple/i.test(v)
                      ? v.replace(/pineapple/gi, "\u2588".repeat(9))
                      : v);
                  }}
                  placeholder="The microwave has been beeping since Tuesday. Nobody opened it." />
        <div className="pg-fine">{t.length}/160 · five a day, keep them office-safe</div>
        <button className="pg-btn" disabled={filing||t.trim().length < 4}
                onClick={async () => {if(filing)return;const draft=t.trim();setFiling(true);try{if(await onSend(draft))setT(current=>current.trim()===draft?"":current);}finally{setFiling(false);}}}>{filing?"Filing…":"File it"}</button>
      </div>
      {isAdmin && pending.length > 0 && (
        <>
          <div className="pg-note">Awaiting your approval:</div>
          <div className="pg-list">
            {pending.map((x) => (
              <div key={x.id} className="pg-row static">
                <span className="pg-main"><b>{x.text}</b><span>{x.author_name}</span></span>
                <span className="pg-incbtns">
                  <button className="pg-btn" onClick={() => onJudge(x.id, true)}>Post</button>
                  <button className="pg-btn danger" onClick={() => onJudge(x.id, false)}>Bin</button>
                </span>
              </div>
            ))}
          </div>
        </>
      )}
      {!isAdmin && mine.length > 0 && (
        <div className="pg-list">
          {mine.map((x) => (
            <div key={x.id} className="pg-row static">
              <span className={"pg-dot " + (x.approved ? "good" : "")} />
              <span className="pg-main"><b>{x.text}</b>
                <span>{x.approved ? "in rotation" : "awaiting approval"}</span></span>
            </div>
          ))}
        </div>
      )}
      <div className="pg-note">{live.length} suggestion(s) currently in the wire.</div>
    </div>
  );
}

  const per = cfg.per_pair_secs || 600;

  const now = n * (n - 1) / 2 * per;
  const next = (n + 1) * n / 2 * per;
  return (
    <div className="pg-pad">
      <div className="pg-stamp">In session</div>
      <p>{cfg.blurb || "No agenda. No materials. Attendance is the entire deliverable."}</p>
      <p className="pg-small">
        Everyone who attends is paid the same, and the amount goes up sharply with the
        number of people in the room. One more person is worth{" "}
        <b>{Math.round((next - now) / 60)} more minutes of output</b> to everybody here.
      </p>
      <div className="pg-list">
        {who.map((nm, i) => (
          <div key={nm + i} className={"pg-row static" + (i % 2 ? " alt" : "")}>
            <span className="pg-ct">{i + 1}</span>
            <span className="pg-main"><b>{nm}</b><span>present</span></span>
          </div>
        ))}
        {n === 0 && <div className="pg-note">Nobody is in there yet.</div>}
      </div>
      <p className="pg-small">
        {n === 0 ? "Attending alone pays nothing at all."
                 : `Currently worth ${Math.round(now / 60)} minutes of output each.`}

      {mine ? (
        <p className="pg-small">You are in the room. It ends in{" "}
          {Math.ceil((meet?.endsIn || 0) / 1000)}s.</p>
      ) : (
        <button className="pg-btn" onClick={onJoin} disabled={!near}>
          {near ? "Take a seat" : "You are not at the door"}

  const [sig, setSig] = useState(name || "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const scroller = useRef(null);

  const onScroll = (e) => {
    const el = e.target;

  };

  const sign = async () => {
    if (busy || !ack || sig.trim().length < 2) return;
    setBusy(true); setErr(null);
    try { onSigned(await api.signAgreement(sig.trim(), AGREEMENT_VERSION)); }

  return (
    <div className="pg-papers">
      <div className="pg-papershead">
        <OfficeMark size={30} wordmark={false} />

        <div className="pg-docend">— end of document —</div>

      {!read && <div className="pg-scrollnag">Scroll to the bottom. All of it. That's how this works.</div>}

        <input type="checkbox" checked={ack} disabled={!read}
               onChange={(e) => setAck(e.target.checked)} />
        <span>I have read the foregoing, or have scrolled past it convincingly.</span>
      </label>

      <div className="pg-signline">
        <label>
          <span>Signature</span>
          <input className="pg-sigfield" value={sig} disabled={!ack}
                 onChange={(e) => setSig(e.target.value.slice(0, 40))}

function CodeDoor({ onOk }) {
  const [v, setV] = useState("");
  const [busy, setBusy] = useState(false);
  const [bad, setBad] = useState(false);

  const submit = async (val) => {
    if (busy) return;
    setBusy(true); setBad(false);
    try {
      if (await checkCode(val)) { onOk(val); return; }
      setBad(true); setV("");
    } catch { setBad(true); }
    setBusy(false);
  };

  const onChange = (e) => {
    const val = e.target.value.replace(/\D/g, "").slice(0, 4);
    setV(val);
    setBad(false);
    if (val.length === 4) submit(val);
  };

  return (
    <div className="pg-door-page">
      <div className="pg-dooreyebrow">The Patron Group</div>
      <h1 className="pg-goldtitle">Idle Hands</h1>
      <p className="pg-goldrule"><span>invite only</span></p>
      <p className="pg-doorlede">Enter the four-digit code you were given.</p>
      <input className={"pg-code" + (bad ? " bad" : "")} value={v} onChange={onChange}
             inputMode="numeric" pattern="[0-9]*" maxLength={4} autoFocus
             placeholder="••••" aria-label="Invite code"
             onKeyDown={(e) => { e.stopPropagation(); if (e.key === "Enter") submit(v); }} />

        {busy ? "Checking…" : bad ? "That's not it. Ask whoever sent you the link." : "\u00a0"}

      <div className="pg-doorfine">

        nothing is saved.

      </div>
    </div>
  );
}

function deptName(cat, id) {
  if (!id) return null;
  const d = (cat?.depts || []).find((x) => x.id === id);
  return d ? d.name : null;
}

function Today({ me, onClaim, onMail }) {
  const c = me?.contracts;
  const list = c?.list || [];
  const claimed = c?.claimed || [];
  const done = (k) => Number((me?.today || {})[k] || 0);
  const mail = me?.mail;
  const opened = !!mail?.opened;
  const item = mail?.item;

  return (
    <div>
      <div className="pg-earnbar">
        Three jobs a day, drawn fresh each morning. They reset when you badge in, so there is no
        way to bank them and no penalty for missing one.
      </div>
      <div className="pg-list">
        {list.length === 0 && <div className="pg-note">Nothing assigned yet. Badge in tomorrow.</div>}
        {list.map((x, i) => {
          const n = done(x.key), need = x.n;
          const got = claimed.includes(x.id);
          const ready = n >= need;
          return (
            <button key={x.id} className={"pg-row" + (i % 2 ? " alt" : "") + (got || !ready ? " poor" : "")}
                    disabled={got || !ready} onClick={() => onClaim(i)}>
              <OfficeIcon kind={x.label+" tasks"} compact/><span className="pg-ct">{got ? "✓" : ready ? "!" : Math.min(n, need) + "/" + need}</span>
              <span className="pg-main"><b>{x.label}</b>
                <span>{got ? "collected" : ready ? "ready to collect" : `${n} of ${need} so far`}</span></span>
              <span className="pg-right"><b>{got ? "—" : "collect"}</b></span>
            </button>
          );
        })}
      </div>

      <div className="pg-mail">
        <div className="pg-mailhead">Today's post</div>
        {!item ? <p className="pg-small">Nothing came for you.</p>
          : opened
            ? <p className="pg-small">{item.text}</p>
            : <>
                <p className="pg-small">An envelope is sitting on your desk. It has your name on it,
                  spelled correctly, which is unusual.</p>
                <button className="pg-btn" onClick={onMail}>Open it</button>
              </>}
      </div>
    </div>
  );
}

      </div>

      <input ref={fileRef} type="file" aria-label="Upload custom face" accept="image/jpeg,image/png,image/webp,image/gif" onChange={onFile} hidden/>

    </div>
  );

  <div className="ar-cell"><div className="ar-npc"><HalBody/></div><strong>Dave</strong><small>Owner</small></div>
  </div>
  <h2>4. Props, cosmetics, upgrades</h2>
  <div className="ar-grid">{["Monitor upgrade","Nicer chair","Snack stash","Coffee setup","Rumor board","Operating agreement binder","Slush drinks","Joey wood","Tenant phone","Office plant","Employee badge","Office hoodie","Senior staff","Restructure"].map(name=><div className="ar-cell" key={name}><div className="ar-icons"><OfficeIcon kind={name}/><strong>{name}</strong></div></div>)}</div>
  <h2>4b. In-world fixture and office-object cutouts</h2>
  <div className="ar-grid">{["bulletin","whiteboard","portrait","hr","owner","watercooler","printer"].map(id=><div className="ar-cell" key={id}><div className="ar-fixture"><div className="pg-fx"><FixtureArt id={id} board={[]} tierPct={20} schedule={qaSchedule}/></div></div><strong>{id}</strong></div>)}</div>
  <h2>4c. Actual shop navigation and long-item text stress test</h2>
  <div data-testid="art-shop-preview" style={{maxWidth:760,margin:"0 auto 12px",border:"2px solid #2B2B2B",background:"#FFFDF5",padding:8}}>
    <Tabsy tabs={[["hire","Requisitions"],["ups","Approvals"],["costume","Wardrobe"],["furniture","Office upgrades"]]}>
    {t=><div className="pg-list">{(t==="hire"?["Office Intern","Middle Manager","The Original Patron Group"]:
      t==="ups"?["Second Monitor","Laminator Access","Restructure The Restructure"]:
      t==="costume"?["Traffic Cone","Hawaiian Shirt","Inflatable T-Rex"]:
      ["A Desk Without A Wobble","Leather. Reclining. Silent.","The Founder Portrait"]).map((name,i)=>
      <div key={name} className={"pg-row"+(i%2?" alt":"")}>
        <OfficeIcon kind={name+(t==="costume"?" costume":"")}/>
        <span className="pg-main"><b>{name}</b><span>Readability · cutout edition</span></span>
        <span className="pg-right"><b>{i===2?"1.2B":"1,350"} BW</b></span>
      </div>)}</div>}
    </Tabsy>
  </div>
  <h2>4d. Owned office upgrade silhouettes — five tier samples</h2>
  <div className="ar-grid">{["d1","d2","d3","d4","d5"].map((d,i)=><div className="ar-cell" key={d}><div className="ar-fixture" style={{height:102}}>
    <div className="pg-officedesk" data-desk={d} style={{position:"relative",width:"100%",height:75,top:0,left:0}}><OfficeDeskArt tier={d}/></div>
    <div className={"pg-officechair chair-c"+Math.min(4,i+1)} style={{top:48}}><OfficeChairArt tier={"c"+Math.min(4,i+1)}/></div>
    </div><strong>{"Desk upgrade "+(i+1)}</strong></div>)}</div>
  <h2>4e. Companions · same ink and palette at every scale</h2>
  <div className="ar-grid" data-testid="pet-qa">{Object.entries(CRITTERS).map(([id,pet])=><div className="ar-cell" key={id}><svg viewBox={id==="bull"?"0 0 74 62":"0 0 34 34"} className="pg-petart" style={{width:68,height:68}} role="img" aria-label={pet.name}>{pet.art}</svg><strong>{pet.name}</strong></div>)}</div>
  <h2>5. Small icon readability</h2>
  <div className="ar-grid">{types.map(t=><div className="ar-cell" key={t}><div className="ar-icons"><OfficeIcon kind={t}/><OfficeIcon kind={t} compact/></div><strong>{t}</strong></div>)}</div>
  <h2>5b. Actual supply closet · read-only costume try-on</h2>
  <section data-testid="closet-qa" style={{maxWidth:760,margin:"0 auto 18px",border:"2px solid #2B2B2B"}}>
    <Wardrobe me={{id:"closet-qa",name:"Preview Employee",look:demoAvatar}} board={[{id:"closet-qa",name:"Preview Employee",look:demoAvatar}]} lifetime={0} pp={5000} cool={0}
      cat={{costumes:Object.entries(COSTUMES).map(([id,c])=>({id,name:c.name,cost:.01}))}} prices={{}} onDress={()=>{}} onChange={()=>{}} onCommit={()=>{}} onNickname={()=>{}}/>
  </section>
  <h2>5c. Actual desk catalog · read-only fitting previews</h2>
  <section data-testid="fittings-qa" style={{maxWidth:760,margin:"0 auto 18px",border:"2px solid #2B2B2B"}}>
    <Catalogue cat={ART_FITTINGS} me={{id:"fittings-qa",name:"Preview Employee",look:demoAvatar}} pp={0} rate={0} preview onFitting={()=>{}}/>
  </section>
  <h2>5c.1 Premium flatscreen · four stills, one questionable purchase</h2>
  <div className="ar-grid" data-testid="tv-qa">{SPRINGER_SCREENS.map((frame,i)=><div className="ar-cell" key={frame.src}><div style={{width:180,height:124}}><SpringerTVArt screen={i}/></div><strong>{frame.label}</strong></div>)}</div>
  <h2>5d. Shared break table · donuts for everyone</h2>
  <div data-testid="break-table-qa" style={{width:240,height:195,margin:"0 auto"}}><FixtureIllustration kind="coffee"/></div>
  <h2>5e. Actual personnel file · cosmetic commendations</h2>
  <section data-testid="personnel-qa" style={{maxWidth:760,margin:"0 auto 18px",border:"2px solid #2B2B2B"}}><Personnel me={{id:"personnel-qa",achievements:["oa_welcome","oa_glue"],look:demoAvatar}} lifetime={0} cat={{depts:[]}}/></section>
  <h2>5f. Weekly whiteboard · read-only clock fixture</h2>
  <div data-testid="weekly-board-qa"><Standings board={[]} schedule={qaSchedule}/></div>
  <h2>5g. Worn beta pin · shared animated character rig</h2>
  <div data-testid="worn-pin-qa" className="ar-grid">{[null,"trex"].map((outfit,i)=><div className="ar-cell" key={i}><div style={{position:"relative",height:145}}><Body p={{name:"Pin preview",pin:"beta",look:demoAvatar,outfit:outfit?{id:outfit,until:"2099-01-01T00:00:00Z"}:null}} emote="wave"/></div><strong>{outfit?"Over a costume":"On your shirt"}</strong></div>)}</div>
  <h2>5l. Free prop performances · original scene art</h2>
  <div data-testid="performance-qa" className="ar-grid">{Object.entries(PROP_ACTIONS).map(([kind,a])=><div className="ar-cell" key={kind}><PerformanceArt kind={kind}/><b>{a.label}</b><p>{a.lines[0]}</p></div>)}</div>
  <h2>5k. Office moments · read-only shared stories and kindness board</h2>
  <div data-testid="moments-qa"><OfficeMoments variant={1} office={{total:5000,target:10000}} wire={[{id:"qa-kindness",kind:"coffee",from:"A coworker",toName:"Another coworker",created_at:new Date().toISOString()}]} onWave={()=>setDemoEmote("wave")}/></div>
  <h2>5j. Action feedback · confirmation stamps and kind gestures</h2>
  <div data-testid="reaction-qa" className="ar-grid">{["work","filed","receipt","kind","dress","oops"].map(kind=><div key={kind} className="ar-cell" style={{height:150,position:"relative"}}><FloorReaction kind={kind} label={kind}/></div>)}</div>
  <h2>5i. Lived-in office · shared scenery</h2>
  <div className="ar-grid" data-testid="environment-qa">{["plant","notice","bench","apology","calendar","shelf"].map(kind=><div className="ar-cell" key={kind}><SceneryArt kind={kind}/><b>{kind}</b></div>)}</div>
  <h2>5h. Illustrated emotes and office directory · read-only QA</h2>
  <div data-testid="polish-controls-qa"><div className="pg-emotes">{EMOTES.map(e=><EmoteButton key={e.id} item={e} active={demoEmote===e.id} onClick={()=>setDemoEmote(e.id)}/>)}</div><OfficeDirectory onGo={()=>{}}/></div>
  <h2>6. Onboarding help · small-screen scroll QA</h2>
  <button className="pg-btn" data-testid="help-preview-open" onClick={()=>setHelpOpen(true)}>Open onboarding help</button>
  {helpOpen&&<Help rate={0} onClose={()=>setHelpOpen(false)}/>}
 </main>;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(new URLSearchParams(location.search).get("art-preview")==="1" ? <ArtPreview/> : <OfficeFloor />);
} catch (err) {
  window.__boot(err && err.stack ? err.stack : String(err));
}
</script>
</body>
</html>
