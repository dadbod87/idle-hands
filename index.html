/** New player, no email yet. Their desk lives in this browser until they save it. */
async function startAnonymous() {
  const { data, error } = await supabase.auth.signInAnonymously();
  if (error) throw error;
  return data.user;
}

/**
 * Attaches an email to the current (anonymous) account, making it permanent.
 * Supabase emails a confirmation link; once clicked, the same desk is
 * reachable from any device.
 */
async function linkEmail(email) {
  const { error } = await supabase.auth.updateUser(
    { email },
    { emailRedirectTo: window.location.origin }
  );
  if (error) throw error;
}

/** Signs an existing player in on a new device / after clearing data. */
async function sendMagicLink(email) {
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin, shouldCreateUser: false },
  });
  if (error) throw error;
}

async function signOutAll() {
  await supabase.auth.signOut();
}

function onAuthChange(cb) {
  const { data } = supabase.auth.onAuthStateChange((_e, s) => cb(s?.user || null));
  return () => data.subscription.unsubscribe();
}


/* ===== lib/api.js ===== */

/* Every one of these calls a Postgres function. The client never writes
   pp, lifetime or anything else directly — RLS forbids it. If someone
   opens devtools and calls buy_item, the database still checks the price. */

async function rpc(name, args = {}) {
  const { data, error } = await supabase.rpc(name, args);
  if (error) throw error;
  return data;
}

const api = {
  upsertPlayer: (name, avatar, code) =>
    rpc("upsert_player", { p_name: name, p_avatar: avatar || null, p_code: code || null }),
  sync: () => rpc("sync"),
  buyItem: (id) => rpc("buy_item", { p_item: id }),
  buyUpgrade: (id) => rpc("buy_upgrade", { p_up: id }),
  doDeed: (target, kind) => rpc("do_deed", { p_target: target, p_kind: kind }),
  claimIncoming: () => rpc("claim_incoming"),
  takeMeeting: () => rpc("take_meeting"),
  askRaise: () => rpc("ask_raise"),
  pineapple: () => rpc("say_pineapple"),
  restructure: () => rpc("restructure"),
  grabChair: () => rpc("grab_chair"),
  saveAchievements: (list) => rpc("save_achievements", { p_list: list }),
  dress: (target, outfit) => rpc("dress", { p_target: target, p_outfit: outfit }),
  changeClothes: () => rpc("change_clothes"),
  commitToBit: () => rpc("commit_to_bit"),
  takeBreak: (drink) => rpc("take_break", { p_drink: drink }),
  doWork: (clicks) => rpc("do_work", { p_clicks: clicks }),
  markRecap: (week) => rpc("mark_recap", { p_week: week }),
  signAgreement: (sig, version) =>
    rpc("sign_agreement", { p_signature: sig, p_version: version }),
};

/** Verified before any account exists. Returns true/false, nothing else. */
async function checkCode(code) {
  const { data, error } = await supabase.rpc("check_code", { p_code: code });
  if (error) throw error;
  return data === true;
}

async function loadCatalog() {
  const { data, error } = await supabase.from("catalog").select("key,data");
  if (error) throw error;
  const out = {};
  for (const row of data) out[row.key] = row.data;
  return out;
}

async function loadFloor() {
  const [{ data: players }, { data: deeds }] = await Promise.all([
    supabase.from("players").select("*").order("lifetime", { ascending: false }).limit(60),
    supabase.from("deeds").select("*").order("created_at", { ascending: false }).limit(30),
  ]);
  return { players: players || [], deeds: deeds || [] };
}

async function uploadBadge(userId, dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${userId}.jpg`;
  const { error } = await supabase.storage
    .from("badges")
    .upload(path, blob, { upsert: true, contentType: "image/jpeg" });
  if (error) throw error;
  const { data } = supabase.storage.from("badges").getPublicUrl(path);
  return data.publicUrl;
}

/**
 * Live positions and emotes. This is broadcast-only — it never touches the
 * database, so people can wander around the floor without writing a row every
 * 200ms. If someone goes quiet for 15s we just park them back at their desk.
 */
function joinLive(meId, onPeer) {
  const ch = supabase.channel("floor-live", { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "pos" }, ({ payload }) => {
    if (payload && payload.id !== meId) onPeer(payload);
  }).subscribe();
  return {
    send: (payload) => ch.send({ type: "broadcast", event: "pos", payload }),
    leave: () => supabase.removeChannel(ch),
  };
}

/** Live updates: any change to any player or deed pushes instantly. */
function subscribeFloor(onChange) {
  const ch = supabase
    .channel("floor")
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, onChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "deeds" }, onChange)
    .subscribe();
  return () => supabase.removeChannel(ch);
}


/* ===== components/PatronFloor.jsx ===== */

const BUILD = "build 24";
const SPEED = 340;
const REACH = 170;
const SYNC_MS = 10000;

function PatronFloor() {
  const [phase, setPhase] = useState("boot");
  const [user, setUser] = useState(null);
  const [cat, setCat] = useState({ items: [], upgrades: [], deeds: {} });
  const [me, setMe] = useState(null);
  const [floor, setFloor] = useState({ players: [], deeds: [] });
  const [drift, setDrift] = useState(0);          // points earned since last server sync
  const [feed, setFeed] = useState([]);
  const [panel, setPanel] = useState(null);
  const [incidents, setIncidents] = useState([]);
  const [report, setReport] = useState(null);
  const [toast, setToast] = useState(null);
  const [chair, setChair] = useState(null);
  const [pos, setPos] = useState({ x: 900, y: 700 });
  const [near, setNear] = useState(null);
  const [view, setView] = useState({ w: 900, h: 560 });
  const [showHelp, setShowHelp] = useState(false);
  const [ev, setEv] = useState(null);
  const [nextEv, setNextEv] = useState(null);
  const [notify, setNotify] = useState(false);
  const lastEvId = useRef(null);
  const chanceSeen = useRef(false);
  const [emote, setEmote] = useState(null);        // {id, until}
  const [peers, setPeers] = useState({});          // live positions of everyone else
  const [moving, setMoving] = useState(false);
  const [chance, setChance] = useState(null);
  const [chatter, setChatter] = useState(null);
  const [knocks, setKnocks] = useState({});      // per door, times you've tried it anyway
  const [beers, setBeers] = useState(0);   // {id, text} — somebody said a thing
  const [recap, setRecap] = useState(null);
  const [code, setCode] = useState("");
  const [facing, setFacing] = useState(1);
  const liveRef = useRef(null);
  const lastSent = useRef(0);
  const facingRef = useRef(1);
  const clickBuf = useRef(0);
  const [err, setErr] = useState(null);

  const posRef = useRef({ x: 900, y: 700 });
  const goRef = useRef(null);
  const keysRef = useRef({});
  const roomRef = useRef(null);
  const stageRef = useRef(null);
  const syncedAt = useRef(Date.now());
  const meRef = useRef(null);
  meRef.current = me;
  const emoteRef = useRef(null);
  emoteRef.current = emote && emote.until > Date.now() ? emote.id : null;

  const say = useCallback((text, tone) => {
    setFeed((f) => [{ text, tone, k: Math.random() }, ...f].slice(0, 60));
  }, []);
  const flash = useCallback((text) => {
    setToast({ text, k: Math.random() });
    setTimeout(() => setToast(null), 2800);
  }, []);

  const applyServer = useCallback((row) => {
    if (!row) return;
    setMe(row);
    setDrift(0);
    syncedAt.current = Date.now();
  }, []);

  const guard = useCallback(async (fn, okMsg) => {
    try {
      const row = await fn();
      applyServer(row);
      if (okMsg) flash(okMsg);
      return row;
    } catch (e) {
      flash(prettyError(e));
      return null;
    }
  }, [applyServer, flash]);

  /* ------------------------------ boot ---------------------------- */
  const boot = useCallback(async (u) => {
    try {
      setUser(u);
      setCat(await loadCatalog());
      const { data: existing } = await supabase
        .from("players").select("*").eq("id", u.id).maybeSingle();
      if (existing) {
        const row = await api.sync();
        const gained = (row.pp || 0) - (existing.pp || 0);
        applyServer(row);
        if (gained > 1) {
          const mins = Math.round(
            (new Date(row.last_tick) - new Date(existing.last_tick)) / 60000);
          if (mins >= 4) setReport({ mins, earned: gained });
        }
        setPhase(row.signed_at ? "play" : "sign");
      } else {
        setPhase("hire");
      }
      setFloor(await loadFloor());
      try {
        const { data: last } = await supabase.from("seasons")
          .select("*").order("closed_at", { ascending: false }).limit(1).maybeSingle();
        const { data: pl } = await supabase.from("players")
          .select("seen_recap").eq("id", u.id).maybeSingle();
        if (last && last.stats && pl?.seen_recap !== last.week_key) setRecap(last);
      } catch { /* no seasons yet */ }
    } catch (e) {
      setErr(e.message || String(e));
      setPhase("error");
    }
  }, [applyServer]);

  useEffect(() => {
    (async () => {
      const u = await getUser();
      if (u) { boot(u); return; }
      // No account yet: nobody gets past the door without the code.
      const held = typeof localStorage !== "undefined" ? localStorage.getItem("ih_code") : null;
      if (held && (await checkCode(held).catch(() => false))) {
        setCode(held);
        setPhase("gate");
      } else {
        setPhase("code");
      }
    })();
    // A magic link lands back here with a session in the URL. When that
    // resolves, pick it up without making anyone reload.
    return onAuthChange((u) => {
      if (u && !meRef.current) boot(u);
    });
  }, [boot]);

  /* ------------------------- live + heartbeat --------------------- */
  useEffect(() => {
    if (phase !== "play") return;
    const refresh = async () => setFloor(await loadFloor());
    const un = subscribeFloor(refresh);
    const t = setInterval(async () => {
      try { applyServer(await api.sync()); } catch { /* offline, keep drifting */ }
      await claim();
    }, SYNC_MS);
    claim();
    return () => { un(); clearInterval(t); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase]);

  const claim = useCallback(async () => {
    try {
      const rows = await api.claimIncoming();
      if (!rows || !rows.length) return;
      const names = {};
      for (const p of (await loadFloor()).players) names[p.id] = p.name;
      const shown = rows.map((d) => ({
        ...d, from: d.hush ? "Someone" : (names[d.actor] || "Someone"),
        fromId: d.hush ? null : d.actor,
      }));
      shown.forEach((d) => {
        const T = DEED_TEXT[d.kind];
        if (T) say(T.hit(d.from, COSTUMES[d.detail]?.name), T.good ? "good" : "bad");
      });
      setIncidents(shown);
      applyServer(await api.sync());
    } catch { /* nothing to claim */ }
  }, [applyServer, say]);

  /* --------------------------- local tick ------------------------- */
  const evMult = ev ? ev.mult : 1;
  const rate = me ? calcRate(me, cat) * liveMult(me) * evMult : 0;
  const clickPow = (1 + rate * 0.1) *
    (cat.upgrades || []).filter((u) => u.t === "click" && (me?.upgrades || []).includes(u.id))
      .reduce((m, u) => m * u.mult, 1);
  const pp = (me?.pp || 0) + drift;
  const lifetime = (me?.lifetime || 0) + drift;
  const heat = me?.heat || 0;
  const underReview = heat >= HEAT_LIMIT;

  useEffect(() => {
    if (phase !== "play") return;
    let last = Date.now();
    const t = setInterval(() => {
      const now = Date.now(), dt = (now - last) / 1000; last = now;
      const p = meRef.current;
      if (!p) return;
      const cur = eventAt(now);
      const r = calcRate(p, cat) * liveMult(p) * (cur ? cur.mult : 1);
      if (r > 0) setDrift((v) => v + r * dt);
    }, 150);
    return () => clearInterval(t);
  }, [phase, cat]);

  /* ----------------------- live floor presence -------------------- */
  useEffect(() => {
    if (phase !== "play" || !me?.id) return;
    const live = joinLive(me.id, (p) => {
      setPeers((prev) => ({ ...prev, [p.id]: p }));
    });
    liveRef.current = live;
    const sweep = setInterval(() => {
      const cut = Date.now() - 15000;
      setPeers((prev) => {
        const next = {}; let changed = false;
        for (const k of Object.keys(prev)) {
          if (prev[k].t > cut) next[k] = prev[k]; else changed = true;
        }
        return changed ? next : prev;
      });
    }, 4000);
    return () => { clearInterval(sweep); live.leave(); liveRef.current = null; };
  }, [phase, me?.id]);

  const doEmote = (id) => {
    setEmote({ id, until: Date.now() + 2600 });
    setTimeout(() => setEmote((e) => (e && e.until <= Date.now() ? null : e)), 2700);
    if (liveRef.current) {
      const p = posRef.current;
      liveRef.current.send({ id: me?.id, x: Math.round(p.x), y: Math.round(p.y),
                             f: facing, m: false, e: id, t: Date.now() });
    }
  };

  /* --------------------------- events ----------------------------- */
  useEffect(() => {
    if (phase !== "play") return;
    const beat = () => {
      const now = Date.now();
      const cur = eventAt(now);
      setEv(cur);
      setNextEv(cur ? null : nextEvent(now));
      const id = cur ? cur.id + cur.start : null;
      if (id && id !== lastEvId.current) {
        lastEvId.current = id;
        say(`${cur.name.toUpperCase()} — ${cur.line}`, cur.mult >= 1 ? "good" : "bad");
        flash(`${cur.name} · ${cur.mult}× for 4 minutes`);
        if (notify && typeof Notification !== "undefined" && Notification.permission === "granted") {
          new Notification("Patron Group — " + cur.name,
            { body: `${cur.line} (${cur.mult}× for 4 minutes)`, tag: "patron-event" });
        }
      }
      if (!cur) lastEvId.current = null;
      const ch = chanceAt(now);
      setChance(ch);
      if (ch && !chanceSeen.current) {
        chanceSeen.current = true;
        say("Chance is on the floor. Chance does not work here.", "sys");
      }
      if (!ch) chanceSeen.current = false;
    };
    beat();
    const t = setInterval(beat, 1000);
    return () => clearInterval(t);
  }, [phase, notify, say, flash]);

  const askNotify = async () => {
    if (typeof Notification === "undefined") { flash("This browser can't do alerts."); return; }
    const r = await Notification.requestPermission();
    setNotify(r === "granted");
    flash(r === "granted" ? "You'll be told when something happens." : "Alerts stayed off.");
  };

  /* --------------------------- movement --------------------------- */
  useEffect(() => {
    if (phase !== "play") return;
    let raf, last = performance.now();
    let prevX = posRef.current.x, prevY = posRef.current.y;
    const step = (t) => {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      const p = posRef.current, k = keysRef.current;
      const dx = (k.right ? 1 : 0) - (k.left ? 1 : 0);
      const dy = (k.down ? 1 : 0) - (k.up ? 1 : 0);
      if (dx || dy) {
        goRef.current = null;
        const l = Math.hypot(dx, dy) || 1;
        p.x += (dx / l) * SPEED * dt; p.y += (dy / l) * SPEED * dt;
      } else if (goRef.current) {
        const g = goRef.current, d = dist(p, g);
        if (d < 10) {
          goRef.current = null;
          if (g.then) {
            const id = g.then;
            setTimeout(() => openFixture(FIXTURES.find((f) => f.id === id)), 40);
          }
        } else {
          p.x += ((g.x - p.x) / d) * SPEED * dt;
          p.y += ((g.y - p.y) / d) * SPEED * dt;
        }
      }
      p.x = clamp(p.x, 45, ROOM.w - 45);
      p.y = clamp(p.y, WALL_H + 40, ROOM.h - 30);
      const dx2 = p.x - prevX;
      const went = Math.abs(dx2) + Math.abs(p.y - prevY);
      const dir = Math.abs(dx2) > 0.4 ? (dx2 > 0 ? 1 : -1) : facingRef.current;
      facingRef.current = dir;
      if (Math.abs(dx2) > 0.4) setFacing(dir);
      setMoving(went > 0.4);
      prevX = p.x; prevY = p.y;
      setPos({ x: p.x, y: p.y });
      const now2 = Date.now();
      if (liveRef.current && now2 - lastSent.current > 180) {
        lastSent.current = now2;
        liveRef.current.send({
          id: meRef.current?.id, x: Math.round(p.x), y: Math.round(p.y),
          f: dir, m: went > 0.4, e: emoteRef.current, t: now2,
        });
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [phase]);

  useEffect(() => {
    if (phase !== "play") return;
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    const typing = (e) => {
      const t = e.target, tag = (t?.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || tag === "select" || t?.isContentEditable;
    };
    const dn = (e) => {
      if (typing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (map[e.key]) { keysRef.current[map[e.key]] = true; e.preventDefault(); }
      if (e.key === "Enter" && near && !panel) openFixture(near);
      if (e.key === "Escape") setPanel(null);
    };
    const up = (e) => { if (map[e.key]) keysRef.current[map[e.key]] = false; };
    const drop = () => { keysRef.current = {}; };
    window.addEventListener("keydown", dn);
    window.addEventListener("keyup", up);
    window.addEventListener("blur", drop);
    return () => {
      window.removeEventListener("keydown", dn);
      window.removeEventListener("keyup", up);
      window.removeEventListener("blur", drop);
    };
  }, [near, panel, phase]);

  // The floor is 1800x1200. Show as much of it as the window allows, capped so
  // it never exceeds the room itself and never gets silly on a huge monitor.
  useEffect(() => {
    const fit = () => {
      const el = stageRef.current;
      if (!el) return;
      const w = Math.min(el.clientWidth, ROOM.w);
      const top = el.getBoundingClientRect().top;
      const chrome = 170;                       // action bar + ticker + breathing room
      const avail = window.innerHeight - top - chrome;
      const h = clamp(Math.round(avail), 320, Math.min(ROOM.h, 820));
      setView((v) => (v.w === w && v.h === h ? v : { w, h }));
    };
    fit();
    window.addEventListener("resize", fit);
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(fit) : null;
    if (ro && stageRef.current) ro.observe(stageRef.current);
    const t = setTimeout(fit, 250);
    return () => {
      window.removeEventListener("resize", fit);
      if (ro) ro.disconnect();
      clearTimeout(t);
    };
  }, [phase]);

  useEffect(() => {
    let best = null, bd = REACH;
    for (const f of FIXTURES) {
      const d = dist(pos, { x: f.x + f.w / 2, y: f.y + f.h / 2 + 40 });
      if (d < bd) { bd = d; best = f; }
    }
    setNear((n) => (n && best && n.id === best.id ? n : best));
  }, [pos]);

  /* ------------------------ chair + ambience ---------------------- */
  useEffect(() => {
    if (phase !== "play") return;
    let to;
    const spawn = () => {
      const born = Date.now();
      setChair({ x: 200 + Math.random() * (ROOM.w - 400),
                 y: WALL_H + 90 + Math.random() * (ROOM.h - WALL_H - 220), born });
      setTimeout(() => setChair((c) => (c && c.born === born ? null : c)), 26000);
      to = setTimeout(spawn, 150000 + Math.random() * 210000);
    };
    to = setTimeout(spawn, 40000 + Math.random() * 60000);
    return () => clearTimeout(to);
  }, [phase]);

  // Somebody on the floor says something. It is never important.
  useEffect(() => {
    if (phase !== "play") return;
    const t = setInterval(() => {
      const others = (floor.players || []).filter((p) => !me || p.id !== me.id);
      const pool = others.length ? others : (me ? [me] : []);
      if (!pool.length) return;
      const who = pick(pool);
      setChatter({ id: who.id, text: pick(CATCHPHRASES) });
      setTimeout(() => setChatter((c) => (c && c.id === who.id ? null : c)), 5200);
    }, 17000);
    return () => clearInterval(t);
  }, [phase, floor.players, me]);

  useEffect(() => {
    if (phase !== "play") return;
    say("You badge in. The floor is quiet. The ledger is not.", "sys");
    const t = setInterval(() => {
      const who = meRef.current?.name || "you";
      say(pick(MEMOS).replace(/\{me\}/g, who), "sys");
    }, 55000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase]);

  /* ------------------------- achievements ------------------------- */
  useEffect(() => {
    if (!me) return;
    const have = me.achievements || [];
    const got = ACHV.filter((a) => !have.includes(a.id) &&
      a.test({ ...me, lifetime, knocks, beers, committed: me.outfit?.committed ? 1 : 0 }));
    if (!got.length) return;
    const next = [...have, ...got.map((g) => g.id)];
    setMe((m) => ({ ...m, achievements: next }));
    got.forEach((g) => say(`Personnel file updated — "${g.name}": ${g.note}`, "good"));
    flash(`Achievement: ${got[0].name}`);
    api.saveAchievements(next).catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [Math.floor(lifetime / 100), me?.goodwill, me?.notoriety, me?.grabs, me?.equity,
      me?.busted, me?.raises, me?.hush, me?.quits, knocks, beers]);

  /* ---------------------------- actions --------------------------- */
  const doWork = () => {
    setDrift((v) => v + clickPow);   // instant feedback
    clickBuf.current += 1;           // banked, then credited by the server
    if (Math.random() < 0.04) say(`You ${pick(WORK_VERBS)}. Nobody saw. The ledger saw.`, "sys");
  };

  // Flush banked clicks every few seconds. The server recomputes the value of
  // each click from its own numbers, so this can't be inflated from the console.
  useEffect(() => {
    if (phase !== "play") return;
    const t = setInterval(async () => {
      const n = clickBuf.current;
      if (!n) return;
      clickBuf.current = 0;
      try { applyServer(await api.doWork(n)); } catch { clickBuf.current += n; }
    }, 2500);
    return () => clearInterval(t);
  }, [phase, applyServer]);

  const buy = (item) => guard(() => api.buyItem(item.id));
  const buyUp = (u) => guard(() => api.buyUpgrade(u.id), `Approved: ${u.name}`);
  const commit = async (target, kind) => {
    const T = DEED_TEXT[kind];
    const row = await guard(() => api.doDeed(target.id, kind));
    if (row) {
      say(T.mine(target.name), T.good ? "good" : "bad");
      flash(T.good ? "Logged. With your name on it." : "Logged. They will see it was you.");
      setPanel(null);
      setFloor(await loadFloor());
    }
  };
  const dress = async (target, outfitId) => {
    const row = await guard(() => api.dress(target.id, outfitId));
    if (!row) return;
    const nm = COSTUMES[outfitId]?.name;
    if (target.id === me?.id) { say(`You put on ${nm}. Nobody asked.`, "sys"); flash(nm); }
    else {
      say(DEED_TEXT.dress.mine(target.name, nm), "bad");
      flash("They'll find out. It says who.");
    }
    setPanel(null);
    setFloor(await loadFloor());
  };

  const grabChair = async () => {
    setChair(null);
    const row = await guard(() => api.grabChair());
    if (row) {
      if (row.frenzy_until && new Date(row.frenzy_until) > new Date()) {
        say("You found the good chair. Seven times output for 77 seconds.", "good");
        flash("THE GOOD CHAIR · 7× for 77s");
      } else {
        say("You found the good chair. Underneath it: unfiled expense receipts.", "good");
        flash("Windfall");
      }
    }
  };

  /* ---------------------------- derived --------------------------- */
  const board = (floor.players || []).map((p) =>
    me && p.id === me.id ? { ...me, pp, lifetime } : p)
    .sort((a, b) => (b.lifetime || 0) - (a.lifetime || 0));
  const names = Object.fromEntries(board.map((p) => [p.id, p.name]));
  const fund = board.reduce((s, p) => s + (p.lifetime || 0), 0);
  const nextTier = FUND_TIERS.find((t) => t.at > fund) || FUND_TIERS[FUND_TIERS.length - 1];
  const prevTier = [...FUND_TIERS].reverse().find((t) => t.at <= fund);
  const wire = (floor.deeds || []).map((d) => ({
    ...d, from: d.hush ? "Someone" : (names[d.actor] || "Someone"), toName: names[d.target] || "someone",
  }));
  const feuds = buildFeuds(floor.deeds || [], names);
  const spots = deskSpots(Math.max(1, board.length));
  const cam = {
    x: ROOM.w <= view.w ? 0 : clamp(pos.x - view.w / 2, 0, ROOM.w - view.w),
    y: ROOM.h <= view.h ? 0 : clamp(pos.y - view.h / 2, 0, ROOM.h - view.h),
  };
  const cool = me?.last_deed
    ? Math.max(0, 300000 - (Date.now() - new Date(me.last_deed).getTime())) : 0;

  const walkClick = (e) => {
    if (!roomRef.current) return;
    const r = roomRef.current.getBoundingClientRect();
    goRef.current = { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  const openFixture = (f) => {
    if (!f) return;
    if (f.deny) {                       // some doors don't open
      setKnocks((k) => ({ ...k, [f.id]: (k[f.id] || 0) + 1 }));
      const line = pick(f.deny);
      flash(line);
      if (Math.random() < 0.5) say(line, "sys");
      return;
    }
    setPanel(f.panel);
  };
  const walkTo = (f, e) => {
    e.stopPropagation();
    goRef.current = { x: f.x + f.w / 2, y: Math.min(ROOM.h - 50, f.y + f.h + 60), then: f.id };
  };

  /* ------------------------------- ui ----------------------------- */
  if (phase === "boot") return <div className="pg-root"><div className="pg-boot">Retrieving personnel file…</div></div>;
  if (phase === "error") return (
    <div className="pg-root"><div className="pg-hirepage">
      <div className="pg-eyebrow">Patron Group</div>
      <h1 className="pg-h1">The floor is closed</h1>
      <p className="pg-lede">{err}</p>
      <p className="pg-fine">Usually this means the environment variables are missing or the SQL
      hasn't been run yet. Check README step 2 and step 5.</p>
    </div></div>
  );
  if (phase === "code") return (
    <div className="pg-root pg-marble">
      <CodeDoor onOk={(c) => {
        setCode(c);
        try { localStorage.setItem("ih_code", c); } catch { /* private mode */ }
        setPhase("gate");
      }} />
    </div>
  );
  if (phase === "sign") return (
    <div className="pg-root pg-marble">
      <SignPapers name={me?.name}
                  onSigned={(row) => { applyServer(row); setShowHelp(true); setPhase("play"); }} />
    </div>
  );
  if (phase === "gate") return (
    <div className="pg-root pg-marble">
      <Gate onNew={async () => { try { boot(await startAnonymous()); } catch (e) { setErr(e.message); setPhase("error"); } }} />
    </div>
  );
  if (phase === "hire") return (
    <div className="pg-root pg-marble">
      <Onboard user={user} code={code} onDone={(row) => { applyServer(row); setPhase("sign"); }} />
    </div>
  );

  return (
    <div className="pg-root">
      <div className="pg-hud">
        <div className="pg-hudmark"><PatronMark size={26} wordmark={false} /></div>
        <Face src={me?.avatar_url} name={me?.name} size={40} />
        <div className="pg-hudid">
          <div className="pg-hudname">{me?.name}</div>
          <div className="pg-hudrole">{roleFor(lifetime)}{me?.equity ? ` · ${me.equity} equity` : ""}</div>
        </div>
        <div className="pg-hudpp">
          <div className="pg-ppnum">{fmt(pp)}</div>
          <div className="pg-pplabel">Patron Points</div>
          <div className="pg-ppsub">
            earning {fmt(rate)} PP every second
            {(me?.buffs || []).filter((b) => new Date(b.until) > new Date()).map((b, i) => (
              <span key={i} className={"pg-tag " + (b.mult > 1 ? "good" : "bad")}>
                {b.mult > 1 ? "▲" : "▼"} {b.from}
              </span>
            ))}
            {me?.raises > 0 && <span className="pg-tag good">+{me.raises * 2}% raises</span>}
            {heat > 0 && !underReview && <span className="pg-tag warn">heat {heat}/{HEAT_LIMIT}</span>}
            {underReview && <span className="pg-tag bad">under review −25%</span>}
          </div>
        </div>
        <button className="pg-help" onClick={() => setShowHelp(true)}>?</button>
        <button className="pg-help" onClick={() => setPanel("account")} title="Your account">
          {user?.is_anonymous ? "!" : "✓"}
        </button>
      </div>

      {user?.is_anonymous && (
        <button className="pg-unsaved" onClick={() => setPanel("account")}>
          This desk only exists in this browser. <em>Add an email to keep it →</em>
        </button>
      )}

      {underReview && (
        <button className="pg-summons" onClick={() => setPanel("owner")}>
          Dave wants to see you in his office. <em>Go now</em>
        </button>
      )}

      <div className={"pg-event" + (ev ? (ev.mult >= 1 ? " on good" : " on bad") : "")}>
        {ev ? (
          <>
            <b>{ev.name}</b>
            <span>{ev.line}</span>
            <em>{ev.mult}× · {countdown(ev.end - Date.now())} left</em>
          </>
        ) : nextEv ? (
          <>
            <b>Next: {nextEv.name}</b>
            <span className="pg-evhide">{nextEv.line}</span>
            <em>starts in {countdown(nextEv.start - Date.now())}</em>
          </>
        ) : <b>The floor is calm. Suspiciously calm.</b>}
        {!notify && (
          <button className="pg-evbell" onClick={askNotify} title="Get told when events start">
            alert me
          </button>
        )}
      </div>

      <div ref={stageRef} className="pg-stage" style={{ height: view.h }}>
        <div ref={roomRef} className="pg-room"
             style={{ width: ROOM.w, height: ROOM.h, transform: `translate(${-cam.x}px, ${-cam.y}px)` }}
             onClick={walkClick}>
          <div className="pg-wall" style={{ height: WALL_H }} />
          <div className="pg-carpet" style={{ top: WALL_H }} />

          {DECOR.map((d, i) => d.t === "mascot" ? (
            <div key={"d" + i} className="pg-decor pg-mascotframe"
                 style={{ left: d.x, top: d.y, zIndex: Math.round(d.y) - 1 }}>
              <BadStag />
              <div className="pg-mascotplate">OUR BRAND</div>
              <div className="pg-mascotfine">2026 refresh &middot; do not reprint</div>
            </div>
          ) : (
            <div key={"d" + i} className={"pg-decor pg-" + d.t}
                 style={{ left: d.x, top: d.y, zIndex: d.t === "rug" ? 0 : Math.round(d.y) - 1 }} />
          ))}

          {FIXTURES.map((f) => (
            <div key={f.id} className={"pg-fx" + (near?.id === f.id ? " near" : "")}
                 style={{ left: f.x, top: f.y, width: f.w, height: f.h }}
                 onClick={(e) => walkTo(f, e)}>
              <FixtureArt id={f.id} board={board} tierPct={Math.min(100, (fund / nextTier.at) * 100)} />
              <div className="pg-fxlabel">{f.label}</div>
            </div>
          ))}

          {board.map((p, i) => {
            const s = spots[i]; if (!s) return null;
            const mine = me && p.id === me.id;
            const live = peers[p.id];
            return (
              <div key={p.id} className="pg-desk" style={{ left: s.x - 54, top: s.y, zIndex: Math.round(s.y) }}>
                {!mine && !live && (
                  <div className="pg-worker">
                    {chatter?.id === p.id && <div className="pg-mumble said">{chatter.text}</div>}
                    <Body p={p} src={p.avatar_url} />
                  </div>
                )}
                <div className="pg-deskart" />
                <div className="pg-desklabel">
                  {i === 0 && <em>Employee of the moment</em>}
                  <b>{p.name}{mine ? " (you)" : ""}</b>
                  <span>{fmt(p.lifetime || 0)} PP</span>
                </div>
              </div>
            );
          })}

          {board.map((p) => {
            const live = peers[p.id];
            if (!live || (me && p.id === me.id)) return null;
            return (
              <div key={"live" + p.id} className="pg-me"
                   style={{ left: live.x, top: live.y, zIndex: Math.round(live.y) + 4 }}>
                {chatter?.id === p.id && <div className="pg-mumble said">{chatter.text}</div>}
                <Body p={p} src={p.avatar_url} moving={live.m} facing={live.f || 1} emote={live.e} />
                <div className="pg-peername">{p.name}</div>
              </div>
            );
          })}

          {chance && (
            <div className={"pg-me pg-chance" + (chance.leaving ? " leaving" : "")}
                 style={{ left: chance.x, top: chance.y, zIndex: Math.round(chance.y) + 6 }}>
              <div className="pg-mumble">{chance.line}</div>
              <ChanceBody facing={chance.facing} />
              <div className="pg-peername">Chance <em>former employee</em></div>
            </div>
          )}

          <div className="pg-desk ghost" style={{ left: GHOST_DESK.x, top: GHOST_DESK.y,
                                                  zIndex: Math.round(GHOST_DESK.y) }}
               onClick={(e) => { e.stopPropagation(); say(pick(GHOST_DESK.lines), "sys"); }}>
            <div className="pg-deskart" />
            <div className="pg-desklabel">
              <em>{GHOST_DESK.plate}</em>
              <b>{GHOST_DESK.name}</b>
              <span>— PP</span>
            </div>
          </div>

          {chair && (
            <button className="pg-chair" style={{ left: chair.x, top: chair.y }}
                    onClick={(e) => { e.stopPropagation(); grabChair(); }}>
              <svg viewBox="0 0 40 48">
                <rect x="8" y="2" width="24" height="22" rx="3" fill="#B23B2E" />
                <rect x="5" y="24" width="30" height="7" rx="2" fill="#8A2C21" />
                <rect x="19" y="31" width="3" height="9" fill="#3C3C3C" />
                <rect x="8" y="40" width="25" height="4" rx="2" fill="#3C3C3C" />
              </svg>
            </button>
          )}

          <div className="pg-me" style={{ left: pos.x, top: pos.y, zIndex: Math.round(pos.y) + 5 }}>
            <Body p={me || { name: me?.name }} src={me?.avatar_url} me
                  moving={moving} facing={facing}
                  emote={emote && emote.until > Date.now() ? emote.id : null} />
          </div>
        </div>
        <MiniMap pos={pos} board={board} spots={spots} meId={me?.id} cam={cam} view={view} />
      </div>

      <div className="pg-bar">
        <button className="pg-work" onClick={doWork}>Do actual work <em>+{fmt(clickPow)} PP</em></button>
        <div className="pg-emotes">
          {EMOTES.map((e) => (
            <button key={e.id} className="pg-emote" onClick={() => doEmote(e.id)} title={e.label}>
              {EMOTE_ICON[e.id]}
            </button>
          ))}
        </div>
        <div className="pg-prompt">
          {near
            ? (<><b>{near.label}</b> — {near.sub}<button className="pg-open" onClick={() => openFixture(near)}>Open</button></>)
            : "Tap the floor to walk (arrow keys work too). Walk up to anything and open it."}
        </div>
      </div>

      <div className="pg-wirestrip">
        {feed.slice(0, 3).map((f) => <div key={f.k} className={"pg-wl " + (f.tone || "")}>{f.text}</div>)}
        <div className="pg-build">Patron Group · {BUILD}</div>
      </div>

      {showHelp && <Help onClose={() => setShowHelp(false)} rate={rate} />}

      {panel && (
        <Panel onClose={() => setPanel(null)} title={PANEL_TITLES[panel]}>
          {panel === "shop" && (
            <Shop cat={cat} me={me} pp={pp} rate={rate} clickPow={clickPow} lifetime={lifetime}
                  onBuy={buy} onUp={buyUp}
                  onRestructure={() => guard(() => api.restructure(), "Restructured")} />
          )}
          {panel === "standings" && <Standings board={board} me={me} fund={fund} feuds={feuds} />}
          {(panel === "kindness" || panel === "sabotage") && (
            <Targets good={panel === "kindness"} board={board} me={me} cat={cat}
                     lifetime={lifetime} pp={pp} cool={cool} onCommit={commit} />
          )}
          {panel === "owner" && (
            <Owner me={me} board={board} lifetime={lifetime} pp={pp} cool={cool} cat={cat}
                   onMeeting={() => guard(() => api.takeMeeting(), "File cleared")}
                   onRaise={() => guard(() => api.askRaise(), "+2% forever")}
                   onBlame={commit} />
          )}
          {panel === "wire" && (
            <Wire wire={wire} feed={feed} lifetime={lifetime}
                  onPineapple={() => guard(() => api.pineapple(), "Pineapple.")} />
          )}
          {panel === "personnel" && <Personnel me={me} lifetime={lifetime} />}
          {panel === "account" && <Account user={user} onLinked={() => setPanel(null)} />}
          {panel === "cooler" && (
            <Cooler cat={cat} me={me}
                    onDrink={async (id, name) => {
                      const row = await guard(() => api.takeBreak(id), name);
                      if (row) { setBeers((b) => b + 1); say(`You had a ${name}. At work. Openly.`, "good"); }
                    }} />
          )}
          {(panel === "coffee" || panel === "fridge") && (
            <BreakRoom where={panel} cat={cat} me={me}
                       onDrink={(id, name) => guard(() => api.takeBreak(id), name)} />
          )}
          {panel === "wardrobe" && (
            <Wardrobe me={me} board={board} lifetime={lifetime} pp={pp} cool={cool} cat={cat}
                      onDress={dress}
                      onChange={() => guard(() => api.changeClothes(), "Changed.")}
                      onCommit={() => guard(() => api.commitToBit(), "+25% for the duration")} />
          )}
          {panel === "fund" && <Fund fund={fund} nextTier={nextTier} prevTier={prevTier} />}
        </Panel>
      )}

      {recap && (
        <Modal onClose={() => { api.markRecap(recap.week_key).catch(() => {}); setRecap(null); }}>
          <Recap season={recap} />
          <button className="pg-btn" onClick={() => {
            api.markRecap(recap.week_key).catch(() => {}); setRecap(null);
          }}>Back to work</button>
        </Modal>
      )}

      {report && (
        <Modal onClose={() => setReport(null)}>
          <div className="pg-stamp">While you were out</div>
          <p>Away about {report.mins} minutes. Your desk kept working.</p>
          <p className="pg-big">+{fmt(report.earned)} PP</p>
          <p className="pg-small">That is the whole idea of this game: you earn while you're gone.</p>
          <button className="pg-btn" onClick={() => setReport(null)}>Back to it</button>
        </Modal>
      )}

      {incidents.length > 0 && (
        <Modal onClose={() => setIncidents([])}>
          <div className="pg-stamp">Incident report</div>
          {incidents.map((g) => {
            const T = DEED_TEXT[g.kind]; if (!T) return null;
            return (
              <div key={g.id} className="pg-inc">
                <Face name={g.from} size={38} />
                <div>
                  <b>{g.from}</b>
                  <span className={T.good ? "good" : "bad"}>{T.eff}{g.amount ? ` · ${fmt(g.amount)} PP` : ""}</span>
                  <em>{T.hit(g.from, COSTUMES[g.detail]?.name)}</em>
                </div>
              </div>
            );
          })}
          <div className="pg-incbtns">
            <button className="pg-btn" onClick={() => setIncidents([])}>Let it go</button>
            {incidents.some((g) => DEED_TEXT[g.kind] && !DEED_TEXT[g.kind].good) && (
              <button className="pg-btn danger" onClick={() => { setIncidents([]); setPanel("sabotage"); }}>Get them back</button>
            )}
          </div>
        </Modal>
      )}

      {toast && <div key={toast.k} className="pg-toast">{toast.text}</div>}
    </div>
  );
}

/** Two people trading hostilities is a story. Count the exchanges and name it. */
function buildFeuds(deeds, names) {
  const pairs = {};
  const cutoff = Date.now() - 24 * 3600e3;
  for (const d of deeds) {
    const T = DEED_TEXT[d.kind];
    if (!T || T.good) continue;
    if (new Date(d.created_at).getTime() < cutoff) continue;
    const key = [d.actor, d.target].sort().join("|");
    const p = pairs[key] || (pairs[key] = { a: null, b: null, n: 0, by: {}, last: 0 });
    p.n++;
    p.by[d.actor] = (p.by[d.actor] || 0) + 1;
    p.last = Math.max(p.last, new Date(d.created_at).getTime());
    [p.a, p.b] = key.split("|");
  }
  return Object.values(pairs)
    .filter((p) => p.n >= 3 && Object.keys(p.by).length > 1)   // mutual, not one-sided
    .map((p) => ({
      ...p,
      names: [names[p.a] || "someone", names[p.b] || "someone"],
      heat: p.n >= 8 ? "open warfare" : p.n >= 5 ? "escalating" : "brewing",
    }))
    .sort((x, y) => y.n - x.n)
    .slice(0, 5);
}

function prettyError(e) {
  const m = (e?.message || "").toLowerCase();
  if (m.includes("afford")) return "Not enough Patron Points.";
  if (m.includes("cooling")) return "Cooling off. One office favor at a time.";
  if (m.includes("goodwill")) return "Dave asks what you've done for anyone lately.";
  if (m.includes("clear your file")) return "Clear your file first. Read the room.";
  if (m.includes("nothing on file")) return "Nothing on your file. Enjoy it.";
  if (m.includes("cover up")) return "Nothing to cover up. Yet.";
  if (m.includes("too early")) return "The cooler opens at eleven. Have some water.";
  if (m.includes("caffeinated")) return "You just had something. Give it twenty minutes.";
  if (m.includes("cycle")) return "Not enough earned this cycle yet.";
  return "That didn't work.";
}

function Face({ src, name, size = 40 }) {
  const ini = (name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();

function wearing(p) {
  const o = p?.outfit;
  if (!o || !COSTUMES[o.id]) return null;
  if (new Date(o.until).getTime() < Date.now()) return null;
  return o;
}

function MiniMap({ pos, board, spots, meId, cam, view }) {
  const W = 148, H = Math.round((ROOM.h / ROOM.w) * W);
  const sx = W / ROOM.w, sy = H / ROOM.h;
  return (
    <div className="pg-map" style={{ width: W, height: H }}>
      <div className="pg-mapwall" style={{ height: WALL_H * sy }} />
      {FIXTURES.map((f) => (
        <div key={f.id} className={"pg-mapfx" + (f.id === "owner" ? " boss" : "")}
             style={{ left: f.x * sx, top: f.y * sy,
                      width: Math.max(4, f.w * sx), height: Math.max(4, f.h * sy) }} />
      ))}
      {board.map((p, i) => {
        const s = spots[i]; if (!s || p.id === meId) return null;
        return <div key={p.id} className="pg-mapdot" style={{ left: s.x * sx, top: s.y * sy }} />;
      })}
      <div className="pg-mapview" style={{ left: cam.x * sx, top: cam.y * sy,
                                           width: view.w * sx, height: view.h * sy }} />
      <div className="pg-mapme" style={{ left: pos.x * sx, top: pos.y * sy }} />
      <div className="pg-maplabel">You are here</div>

  );
}

function Shop({ cat, me, pp, rate, clickPow, lifetime, onBuy, onUp, onRestructure }) {
  const owned = me?.owned || {}, ups = me?.upgrades || [];
  const cycle = me?.cycle || 0;
  const avail = Math.floor(Math.sqrt(cycle / 1e9));
  return (
    <>
      <div className="pg-earnbar">
        Your desk earns <b>{fmt(rate)} PP/sec</b> — that's <b>{fmt(rate * 3600)} PP</b> an hour,
        whether this tab is open or not. Buy more staff to raise it.
      </div>
      <Tabsy tabs={[["hire", "Requisitions"], ["ups", "Approvals"], ["restr", "Restructure"]]}>
        {(t) => t === "hire" ? (
          <div className="pg-list">
            {(cat.items || []).map((it, i) => {
              const have = owned[it.id] || 0, c = costOf(it, have);
              const hidden = have === 0 && c > Math.max(pp, lifetime * 0.35) * 3;
              return (
                <button key={it.id} className={"pg-row" + (i % 2 ? " alt" : "") + (pp < c ? " poor" : "")}
                        onClick={() => onBuy(it)} disabled={pp < c}>
                  <span className="pg-ct">{have || "—"}</span>
                  <span className="pg-main">
                    <b>{hidden ? "Position not yet approved" : it.name}</b>
                    <span>{hidden ? "Keep earning." : it.note}</span>
                  </span>
                  <span className="pg-right">
                    <b>{fmt(c)} PP</b>
                    <span>+{fmt(it.rate * itemMult(ups, cat.upgrades, it.id))}/sec</span>
                  </span>
                </button>
              );
            })}
          </div>
        ) : t === "ups" ? (
          <div className="pg-list">
            {(cat.upgrades || []).filter((u) => (owned[u.req[0]] || 0) >= u.req[1] || ups.includes(u.id))
              .map((u, i) => (
              <button key={u.id}
                      className={"pg-row" + (i % 2 ? " alt" : "") + (ups.includes(u.id) ? " done" : pp < u.cost ? " poor" : "")}
                      onClick={() => onUp(u)} disabled={ups.includes(u.id) || pp < u.cost}>
                <span className="pg-ct">{ups.includes(u.id) ? "✓" : "—"}</span>
                <span className="pg-main"><b>{u.name}</b><span>{u.note}</span></span>
                <span className="pg-right"><b>{ups.includes(u.id) ? "owned" : fmt(u.cost)}</b>
                  <span>×{u.mult}</span></span>
              </button>
            ))}
            <div className="pg-note">Approvals unlock as you hire. They multiply what you already own.</div>
          </div>
        ) : (
          <div className="pg-pad">
            <p>Restructuring wipes your desk: points, hires and approvals all go. Your lifetime PP
              and your place on the whiteboard stay exactly where they are.</p>
            <p>You keep <b>equity</b> — a permanent <b>+3%</b> to everything, per point, forever.</p>
            <p className="pg-big">{avail} equity available</p>
            <p className="pg-small">You hold {me?.equity || 0}. Next point at {fmt(Math.pow((me?.equity || 0) + 1, 2) * 1e9)} PP this cycle.</p>
            <button className="pg-btn danger" disabled={avail < 1} onClick={onRestructure}>
              Restructure the department
            </button>
          </div>
        )}
      </Tabsy>
      <div className="pg-note">Clicking "Do actual work" gives {fmt(clickPow)} PP. Useful early,
        irrelevant later — the staff are the point.</div>
    </>
  );
}

function Standings({ board, me, fund, feuds = [] }) {
  const [tab, setTab] = useState("week");
  const ranked = [...board].sort((a, b) =>
    tab === "week" ? (b.week_pp || 0) - (a.week_pp || 0) : (b.lifetime || 0) - (a.lifetime || 0));
  const kindest = [...board].sort((a, b) => (b.goodwill || 0) - (a.goodwill || 0))[0];
  const worst = [...board].sort((a, b) => (b.notoriety || 0) - (a.notoriety || 0))[0];
  const hottest = [...board].sort((a, b) => (b.heat || 0) - (a.heat || 0))[0];
  return (
    <div>
      <div className="pg-tabs">
        <button className={"pg-tab" + (tab === "week" ? " on" : "")} onClick={() => setTab("week")}>This week</button>
        <button className={"pg-tab" + (tab === "all" ? " on" : "")} onClick={() => setTab("all")}>All time</button>
      </div>
      <div className="pg-earnbar">
        {tab === "week"
          ? <>Resets Monday morning. Whoever tops it gets a <b>trophy</b> that never goes away.</>
          : <>Every point anyone has ever earned. This one never resets.</>}
      </div>
      <div className="pg-list">
        {ranked.map((p, i) => (
          <div key={p.id} className={"pg-row static" + (i % 2 ? " alt" : "") + (me && p.id === me.id ? " mine" : "")}>
            <span className="pg-ct">{i + 1}</span>
            <Face src={p.avatar_url} name={p.name} size={34} />
            <span className="pg-main">
              <b>{p.name}{me && p.id === me.id ? " (you)" : ""}
                {p.trophies > 0 && <span className="pg-trophy">{"\u25C6".repeat(Math.min(p.trophies, 5))}</span>}</b>
              <span>{roleFor(p.lifetime || 0)}{p.equity ? ` · ${p.equity} equity` : ""}
                {(p.heat || 0) >= HEAT_LIMIT ? " · under review" : ""}</span>
            </span>
            <span className="pg-right">
              <b>{fmt((tab === "week" ? p.week_pp : p.lifetime) || 0)} PP</b>
              <span>{tab === "week" ? "this week" : "lifetime"}</span>
            </span>
          </div>
        ))}
      </div>
      {feuds.length > 0 && (
        <>
          <div className="pg-feudhead">Ongoing situations</div>
          <div className="pg-list">
            {feuds.map((f, i) => (
              <div key={i} className={"pg-row static" + (i % 2 ? " alt" : "")}>
                <span className={"pg-dot " + (f.n >= 8 ? "bad" : "")} />
                <span className="pg-main">
                  <b>{f.names[0]} vs {f.names[1]}</b>
                  <span>{f.n} hostilities in 24 hours · {f.heat}</span>
                </span>
                <span className="pg-right"><b>{f.n}</b></span>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="pg-stats">
        <div><b>{kindest?.goodwill ? kindest.name : "—"}</b><span>most generous</span></div>
        <div><b>{worst?.notoriety ? worst.name : "—"}</b><span>most notorious</span></div>
        <div><b>{hottest?.heat ? hottest.name : "—"}</b><span>most heat on file</span></div>
        <div><b>{fmt(fund)}</b><span>office total</span></div>
      </div>
    </div>
  );
}

function Targets({ good, board, me, cat, lifetime, pp, cool, onCommit }) {
  const [sel, setSel] = useState(null);
  const kinds = Object.keys(DEED_TEXT).filter(
    (k) => DEED_TEXT[k].good === good && !DEED_TEXT[k].office && !DEED_TEXT[k].elsewhere);
  const others = board.filter((p) => !me || p.id !== me.id);
  const target = others.find((p) => p.id === sel);
  return (
    <div>
      {cool > 0 && <div className="pg-note">Cooling off — {Math.ceil(cool / 1000)}s until you can do this again.</div>}
      {others.length === 0 && <div className="pg-note">Nobody else has badged in yet. Send them the link.</div>}
      <div className="pg-picks">
        {others.map((p) => (
          <button key={p.id} className={"pg-pick" + (sel === p.id ? " on" : "")} onClick={() => setSel(p.id)}>
            <Face src={p.avatar_url} name={p.name} size={44} /><span>{p.name}</span>
          </button>
        ))}
      </div>
      {target && (
        <div className="pg-list">
          {kinds.map((k, i) => {
            const price = Math.max(60, lifetime * (cat.deeds?.[k]?.cost || 0.02));
            return (
              <button key={k} className={"pg-row" + (i % 2 ? " alt" : "") + (pp < price || cool > 0 ? " poor" : "")}
                      disabled={pp < price || cool > 0} onClick={() => onCommit(target, k)}>
                <span className={"pg-dot " + (good ? "good" : "bad")} />
                <span className="pg-main"><b>{DEED_TEXT[k].label}</b><span>{DEED_TEXT[k].eff}</span></span>
                <span className="pg-right"><b>{fmt(price)}</b><span>PP</span></span>
              </button>
            );
          })}
          <div className="pg-note">
            {good
              ? `${target.name} gets an incident report with your name on it. Every kind act is +1% to your own output, forever, up to 30.`
              : `${target.name} will be told exactly who did this. Each one also puts heat on your file — five and Dave wants a word.`}
          </div>
        </div>
      )}
    </div>
  );
}

function Owner({ me, board, lifetime, pp, cool, cat, onMeeting, onRaise, onBlame }) {
  const [sel, setSel] = useState(null);

function Onboard({ user, code, onDone }) {
  const [name, setName] = useState("");
  const [img, setImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const fileRef = useRef(null);

  const onFile = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const S = 256, cv = document.createElement("canvas");
        cv.width = S; cv.height = S;
        const ctx = cv.getContext("2d");
        const side = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
        setImg(cv.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };

  const go = async () => {
    if (!name.trim() || busy) return;
    setBusy(true);
    try {
      let url = null;
      if (img) { try { url = await uploadBadge(user.id, img); } catch { /* optional */ } }
      onDone(await api.upsertPlayer(name.trim().slice(0, 12), url, code));
    } catch (e) {
      const m = (e.message || "").toLowerCase();
      setErr(m.includes("code") ? "That's not the office code."
        : m.includes("full") ? "The office is full. Ask whoever runs it to add a desk."
        : m.includes("closed") ? "The office is closed to new staff."
        : "Couldn't badge in: " + (e.message || e));
      setBusy(false);
    }
  };

  const badgeId = "PG-" + String(
    1000 + ((name || "new").split("").reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 8999));

  return (
    <div className="pg-hirepage pg-paper">
      <div className="pg-eyebrow">Idle Hands · new hire intake · {BUILD}</div>
      <h1 className="pg-h1">Badge in</h1>
      <p className="pg-lede">Two things and you're on the floor. Everyone sees both.</p>

      <div className="pg-badge">
        <div className="pg-badgetop">
          <span><PatronMark size={16} wordmark={false} /> PATRON GROUP</span><i>EMPLOYEE</i>
        </div>
        <div className="pg-badgemain">
          <div className="pg-badgephoto">
            <Face src={img} name={name} size={74} />
            {!img && <div className="pg-badgehint">no photo<br />on file</div>}
          </div>
          <div className="pg-badgeid">
            <b>{name || "\u2014\u2014\u2014\u2014\u2014\u2014"}</b>
            <span>Probationary</span>
            <em>{badgeId}</em>
            <div className="pg-badgeline">ISSUED {new Date().toLocaleDateString()}</div>
          </div>
        </div>
        <div className="pg-barcode" aria-hidden="true">
          {Array.from({ length: 36 }).map((_, i) => (
            <i key={i} style={{ width: ((badgeId.charCodeAt(i % badgeId.length) + i * 3) % 3) + 1 }} />
          ))}
        </div>
      </div>

      <label className="pg-field">
        <span>Name on the badge <i className="pg-count">{name.length}/12</i></span>
        <input value={name} onChange={(e) => setName(e.target.value.slice(0, 12))}
               onKeyDown={(e) => e.stopPropagation()} autoComplete="off" autoFocus
               placeholder="e.g. Dana R." maxLength={12} />
        <div className="pg-fine">Twelve characters. It has to fit on a desk plate.</div>
      </label>

      <div className="pg-field">
        <span>Badge photo</span>
        <button className="pg-btn ghost pg-wide" onClick={() => fileRef.current?.click()}>
          {img ? "Use a different photo" : "Choose a photo"}
        </button>
        <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{ display: "none" }} />
        <div className="pg-fine">Cropped square. It goes on your character's head, so pick
          something you don't mind walking around as.</div>
      </div>

      {err && <div className="pg-fine pg-err">{err}</div>}
      <button className="pg-work big" disabled={!name.trim() || busy} onClick={go}>
        {busy ? "Processing paperwork…" : "Start the shift"}
      </button>
      <div className="pg-fine pg-center">You start earning the second you badge in.</div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<PatronFloor />);
} catch (err) {
  window.__boot(err && err.stack ? err.stack : String(err));
}
</script>
</body>
</html>
