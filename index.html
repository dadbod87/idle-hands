<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Idle Hands — a Patron Group production</title>
<style>
:root{
  --paper:#F3F5EC; --bar:#DEE8D5; --ink:#18261D; --soft:#5D6C5B; --rule:#A9BFA6;
  --stamp:#B23B2E; --brass:#8A6E1F; --edge:#8FA68C; --warn:#9A6B12;
  --carpet:#6E7A6B; --carpet2:#66725F; --wall:#D9DCCC;
  --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#C9CFBE;color:var(--ink);font-family:var(--sans)}
.pg-root{max-width:1560px;margin:0 auto;padding:8px}
.pg-boot{font-family:var(--mono);padding:40px;letter-spacing:.08em}

.pg-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);
  border:2px solid var(--ink);border-bottom-width:3px;padding:8px 10px}
.pg-hudid{min-width:0;flex:1 1 120px}
.pg-hudname{font-weight:700;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-hudrole{font-family:var(--mono);font-size:10px;color:var(--soft);white-space:normal;overflow-wrap:break-word;line-height:1.3}
.pg-hudpp{margin-left:auto;text-align:right;min-width:0;flex:0 1 auto;padding-left:10px}
.pg-ppnum{font-family:var(--mono);font-size:clamp(22px,6vw,32px);font-weight:700;line-height:1;color:var(--brass)}
.pg-pplabel{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.pg-ppsub{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-top:3px}
.pg-tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;
  padding:1px 4px;margin-left:4px;border:1px solid}
.pg-tag.good{color:#2C6B45;border-color:#2C6B45}
.pg-tag.plain{border:0;padding:0;text-transform:none;letter-spacing:0;font-size:inherit;color:inherit}
/* hover detail. Pointer devices only — nothing changes on a phone. */
@media (hover:hover){
  .pg-tag[data-tip]{position:relative}
  .pg-tag[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;
    bottom:calc(100% + 7px);transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--sans);font-size:11px;line-height:1.35;letter-spacing:.01em;
    text-transform:none;padding:7px 10px;border-radius:7px;width:max-content;max-width:260px;
    white-space:normal;text-align:center;z-index:9999;pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,.32)}
  .pg-tag[data-tip]:hover::before{content:"";position:absolute;left:50%;bottom:calc(100% + 2px);
    transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);
    z-index:9999;pointer-events:none}
}
.pg-tag.bad{color:var(--stamp);border-color:var(--stamp)}
.pg-tag.warn{color:var(--warn);border-color:var(--warn)}
.pg-hudbtns{display:flex;gap:6px;flex:none;margin-left:auto}
.pg-help{flex:none;width:28px;height:28px;border:2px solid var(--ink);background:var(--bar);
  font-family:var(--mono);font-weight:700;cursor:pointer;align-self:flex-start}

.pg-summons{display:block;width:100%;background:var(--stamp);color:#fff;border:2px solid var(--ink);
  border-top:none;padding:9px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;text-align:left}
.pg-summons em{font-style:normal;float:right;text-decoration:underline}

.pg-stage{position:relative;border:2px solid var(--ink);border-top:none;overflow:hidden;background:var(--carpet)}
.pg-room{position:absolute;left:0;top:0;cursor:crosshair;will-change:transform}
.pg-wall{position:absolute;left:0;right:0;top:0;background:var(--wall);border-bottom:6px solid #B0B6A0}
.pg-carpet{position:absolute;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(45deg,var(--carpet) 0 16px,var(--carpet2) 16px 32px)}

.pg-fx{position:absolute;z-index:3;cursor:pointer}
.pg-fxlabel{position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;white-space:nowrap;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#F6F8EE;background:rgba(18,32,22,.88);border:1px solid rgba(255,255,255,.25);padding:3px 8px}
.pg-fx.near .pg-fxlabel{background:var(--stamp);border-color:#FFE9A8;color:#fff}
.pg-fx.near::after{content:"";position:absolute;inset:-8px;border:3px dashed #FFE9A8}

.pg-wb{width:100%;height:100%;background:#FBFCF7;border:7px solid #9AA48C;padding:5px 9px;overflow:hidden;position:relative}
.pg-wbtitle{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#B23B2E}
.pg-wbrow{display:flex;align-items:center;gap:5px;font-size:11px;margin-top:3px}
.pg-wbrow b{font-family:var(--mono);color:#2B4B7A;width:9px}
.pg-wbrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-wbrow em{font-family:var(--mono);font-style:normal;color:#2C6B45}
.pg-wbtray{position:absolute;left:-7px;right:-7px;bottom:-9px;height:8px;background:#8A9480}
.pg-bb{width:100%;height:100%;background:#8A6A3E;border:6px solid #6A502D;display:grid;
  grid-template-columns:repeat(3,1fr);gap:5px;padding:7px}
.pg-bb i{background:#F2F3E8;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pg-cab{width:100%;height:100%;background:#9BA2A8;border:3px solid #6E757A;padding:6px;
  display:flex;flex-direction:column;gap:6px}
.pg-cab i{flex:1;background:#B7BEC3;border-bottom:4px solid #7E858A}
.pg-boss{width:100%;height:100%;background:#5B412A;border:5px solid #3E2C1C;position:relative}
.pg-bossglass{position:absolute;left:10px;right:10px;top:12px;height:54px;
  background:linear-gradient(160deg,#8FA8B8,#5D7480);border:3px solid #2F231A}
.pg-bossplate{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;background:#C9B063;
  color:#3A2C10;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:2px 7px;border:1px solid #6E5C22}
.pg-cm{width:100%;height:100%;background:#3A3F3B;position:relative}
.pg-cm span{position:absolute;left:14px;right:14px;top:18px;height:26px;background:#6E4B2A;border:2px solid #241A12}
.pg-cm b{position:absolute;left:20px;right:20px;bottom:16px;height:20px;background:#C8B48A}
.pg-door{width:100%;height:100%;background:#7A5B3A;border:5px solid #5B412A;position:relative}
.pg-door span{position:absolute;left:11px;right:11px;top:14px;height:54px;background:#A9C3D6;border:2px solid #4A5A66}
.pg-vm{width:100%;height:100%;background:#2E3B33;border:5px solid #1D251F;position:relative;overflow:hidden}
.pg-vm i{position:absolute;left:0;right:0;bottom:0;background:#B23B2E;opacity:.85}
.pg-vm span{position:absolute;left:9px;right:9px;top:9px;bottom:40px;background:rgba(200,220,210,.28);border:2px solid #7C8C82}
.pg-mydesk{width:100%;height:100%;background:#B79A6B;border:4px solid #8A7248;position:relative}
.pg-mydesk span{position:absolute;left:18px;top:14px;width:62px;height:40px;background:#2C3330;border-bottom:7px solid #555}
.pg-mydesk b{position:absolute;right:20px;top:26px;width:74px;height:24px;background:#DDE2D4;border:2px solid #8A7248}

.pg-desk{position:absolute;width:108px}
.pg-deskart{width:108px;height:34px;background:#B79A6B;border:3px solid #8A7248;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.pg-worker{position:absolute;left:50%;top:-54px;transform:translateX(-50%)}
.pg-desklabel{text-align:center;margin-top:3px;line-height:1.2}
.pg-desklabel b{display:block;font-size:11px;color:#F6F8EE;text-shadow:0 1px 3px rgba(0,0,0,.85);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-desklabel span{display:block;font-family:var(--mono);font-size:9.5px;color:#E8EDDD;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.pg-desklabel em{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.05em;text-transform:uppercase;color:#FFE08A;text-shadow:0 1px 3px rgba(0,0,0,.9)}

.pg-body{position:relative;width:60px;height:76px}
.pg-body .pg-face{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2}
.pg-torso{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:54px}
.pg-body.me .pg-face{border-color:var(--brass);box-shadow:0 0 0 2px #FFE9A8}
.pg-me{position:absolute;transform:translate(-30px,-62px);pointer-events:none}
.pg-me .pg-body::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:44px;height:9px;background:rgba(0,0,0,.3);border-radius:50%}

.pg-chair{position:absolute;width:46px;height:54px;background:none;border:none;padding:0;
  cursor:pointer;z-index:900;animation:pgbob 1.3s ease-in-out infinite}
.pg-chair svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #FFE9A8)}
@keyframes pgbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.pg-map{position:absolute;right:8px;top:8px;background:rgba(18,32,22,.82);
  border:2px solid rgba(246,248,238,.5);z-index:50;pointer-events:none}
.pg-mapwall{position:absolute;left:0;right:0;top:0;background:rgba(217,220,204,.35)}
.pg-mapfx{position:absolute;background:#C9CFBE;opacity:.8}
.pg-mapfx.boss{background:#C9B063}
.pg-mapdot{position:absolute;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#8FA68C}
.pg-mapview{position:absolute;border:1px solid rgba(255,233,168,.65)}
.pg-mapme{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:#FFE08A;box-shadow:0 0 0 2px rgba(178,59,46,.9)}
.pg-maplabel{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-family:var(--mono);
  font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#F6F8EE;opacity:.75}

.pg-bar{display:flex;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--ink);
  border-top:none;padding:8px;flex-wrap:wrap}
.pg-work{background:var(--ink);color:var(--paper);border:none;padding:12px 16px;cursor:pointer;
  font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.12em;
  font-weight:700;box-shadow:4px 4px 0 var(--edge);flex:none}
.pg-work:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.pg-work:disabled{opacity:.45}
.pg-statusboost{display:inline-flex;align-items:center;flex:none;font:700 10px var(--mono);border:1px solid #AD8050;border-radius:7px;padding:7px 9px;background:#4B3525;color:#F6D4A3;white-space:nowrap}
.pg-seniority-stamp{margin:12px 0;padding:13px;border:2px dashed #9A7640;background:#F4E7CA;color:#47331B;transform:rotate(-0.4deg)}
.pg-seniority-stamp strong{display:block;font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pg-drinkboost{display:inline-flex;align-items:center;flex:none;font:700 10px var(--mono);color:#F6E3AE;background:#294335;border:1px solid #A3B789;border-radius:7px;padding:7px 9px;white-space:nowrap}
.pg-work.big{width:100%;padding:16px;margin-top:6px}
.pg-work em{font-style:normal;opacity:.7;font-size:11px;margin-left:6px}
.pg-prompt{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.pg-prompt b{color:var(--ink)}
.pg-open{background:var(--stamp);color:#fff;border:none;padding:6px 10px;cursor:pointer;
  font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em}

.pg-wirestrip{background:var(--paper);border:2px solid var(--ink);border-top:none;padding:6px 10px}
.pg-wl{font-family:var(--mono);font-size:11px;line-height:1.6;border-bottom:1px dotted var(--rule);
  white-space:normal;overflow-wrap:break-word;padding:2px 0}
.pg-wl.good{color:#2C6B45}.pg-wl.bad{color:var(--stamp)}.pg-wl.sys{color:var(--soft)}
.pg-build{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);opacity:.65;text-align:right;padding-top:4px}

.pg-modal{position:fixed;inset:0;background:rgba(18,26,20,.6);display:flex;align-items:center;
  justify-content:center;padding:12px;z-index:200}
.pg-panel{background:var(--paper);border:2px solid var(--ink);width:100%;max-width:520px;
  max-height:86vh;display:flex;flex-direction:column;box-shadow:7px 7px 0 rgba(0,0,0,.35)}
.pg-panelhead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;
  text-transform:uppercase;letter-spacing:.14em}
.pg-x{background:none;border:1px solid var(--paper);color:var(--paper);font-family:var(--mono);
  font-size:10px;padding:3px 7px;cursor:pointer;text-transform:uppercase}
.pg-panelbody{overflow:auto}

.pg-earnbar{background:var(--bar);border-bottom:2px solid var(--ink);padding:9px 12px;font-size:12px;line-height:1.5}
.pg-tabs{display:flex;border-bottom:2px solid var(--ink)}
.pg-nonsense-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.pg-nonsense-tabs>.pg-btn{width:100%;min-width:0;min-height:44px;padding:10px 6px;white-space:normal;overflow-wrap:anywhere}
.pg-tab{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:9px 4px;
  cursor:pointer;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.pg-tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--stamp)}

.pg-list{display:flex;flex-direction:column}
.pg-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;
  background:var(--paper);border:none;border-bottom:1px solid var(--rule);cursor:pointer;
  font-family:var(--sans);color:var(--ink)}
.pg-row.alt{background:var(--bar)}
.pg-row.static{cursor:default}
.pg-row.mine{box-shadow:inset 3px 0 0 var(--stamp)}
.pg-row.poor{opacity:.5;cursor:default}
.pg-row.done{opacity:.75;cursor:default}
.pg-ct{font-family:var(--mono);font-weight:700;width:24px;flex:none;text-align:center;color:var(--soft)}
.pg-main{flex:1;min-width:0}
.pg-main b{display:block;font-size:13px;line-height:1.32;overflow-wrap:break-word}
.pg-main span{display:block;font-size:11px;color:var(--soft);line-height:1.4;overflow-wrap:break-word}
.pg-right{text-align:right;flex:none;font-family:var(--mono)}
.pg-right b{display:block;font-size:12.5px}
.pg-right span{display:block;font-size:10px;color:var(--soft)}
.pg-dot{width:9px;height:9px;flex:none;border-radius:50%}
.pg-dot.good{background:#2C6B45}.pg-dot.bad{background:var(--stamp)}
.pg-note{padding:9px 12px;font-size:11.5px;color:var(--soft);line-height:1.55;background:var(--paper)}
.pg-pad{padding:12px}
.pg-pad p{margin:0 0 8px;font-size:13px;line-height:1.5}
.pg-big{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--brass)}
.pg-small{font-size:11.5px;color:var(--soft)}
.pg-memo{font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--soft);border-bottom:1px dotted var(--rule)}
.pg-memo.good{color:#2C6B45}.pg-memo.bad{color:var(--stamp)}
.pg-progress{height:12px;background:var(--bar);border:1px solid var(--rule);margin:6px 0}
.pg-progress i{display:block;height:100%;background:var(--brass)}
.pg-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border-bottom:2px solid var(--ink);border-top:2px solid var(--ink)}
.pg-stats>div{background:var(--paper);padding:9px 11px}
.pg-stats b{display:block;font-family:var(--mono);font-size:15px}
.pg-stats span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--soft)}
.pg-boss-hero{display:flex;gap:12px;align-items:center;padding:12px;background:var(--bar);border-bottom:2px solid var(--ink)}
.pg-bossdoor{width:44px;height:56px;flex:none;background:#5B412A;border:3px solid #3E2C1C;position:relative}
.pg-bossdoor::after{content:"";position:absolute;left:6px;right:6px;top:7px;height:22px;
  background:linear-gradient(160deg,#8FA8B8,#5D7480);border:2px solid #2F231A}
.pg-boss-hero b{display:block;font-size:15px}
.pg-boss-hero span{display:block;font-size:11.5px;color:var(--soft)}
.pg-picks{display:flex;gap:6px;overflow-x:auto;padding:10px}
.pg-pick{background:none;border:2px solid transparent;padding:4px;cursor:pointer;width:74px;flex:none}
.pg-pick.on{border-color:var(--stamp);background:var(--bar)}
.pg-pick span{display:block;font-size:10.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-face{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;
  background:var(--bar);border:2px solid var(--ink);flex:none;font-family:var(--mono)}
.pg-face img{width:100%;height:100%;object-fit:cover;display:block}
.pg-btn{background:var(--paper);border:2px solid var(--ink);padding:9px 13px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;box-shadow:3px 3px 0 var(--edge)}
.pg-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.pg-btn.danger{border-color:var(--stamp);color:var(--stamp)}
.pg-btn.ghost{box-shadow:none}
.pg-btn:disabled{opacity:.45;cursor:default}
.pg-btn em{font-style:normal;font-weight:400;font-size:11px;color:var(--soft);margin-left:6px}
.pg-card{background:var(--paper);border:2px solid var(--ink);padding:18px;max-width:400px;
  box-shadow:7px 7px 0 rgba(0,0,0,.35);max-height:86vh;overflow:auto}
.pg-card p{margin:6px 0;font-size:13px}
.pg-stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;transform:rotate(-2deg);margin-bottom:10px}
.pg-helph{margin:0 0 10px;font-size:16px}
.pg-helplist{margin:0 0 14px;padding-left:20px}
.pg-helplist li{font-size:13px;line-height:1.55;margin-bottom:8px}
.pg-inc{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule)}
.pg-inc b{display:block;font-size:13px}
.pg-inc span{display:block;font-size:10.5px;font-family:var(--mono)}
.pg-inc span.good{color:#2C6B45}.pg-inc span.bad{color:var(--stamp)}
.pg-inc em{display:block;font-style:normal;font-size:11.5px;color:var(--soft);margin-top:2px}
.pg-incbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pg-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);font-family:var(--mono);font-size:12px;padding:10px 14px;z-index:300;
  max-width:88vw;text-align:center;white-space:normal;overflow-wrap:break-word;line-height:1.45}
.pg-hirepage{max-width:430px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);padding:20px}
.pg-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.pg-h1{font-family:var(--mono);font-size:30px;text-transform:uppercase;margin:2px 0 10px;
  border-bottom:2px solid var(--ink);padding-bottom:8px}
.pg-lede{font-size:13.5px;line-height:1.6;margin:0 0 18px}
.pg-field{display:block;margin-bottom:16px}
.pg-field>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.pg-field input{width:100%;padding:10px;border:2px solid var(--ink);background:#fff;font-size:15px;font-family:var(--sans)}
.pg-photorow{display:flex;align-items:center;gap:12px}
.pg-count{font-style:normal;float:right;opacity:.7;letter-spacing:0}
.pg-fine{font-size:11px;color:var(--soft);margin-top:6px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.pg-chair{animation:none}}

.pg-unsaved{display:block;width:100%;background:var(--warn);color:#fff;border:2px solid var(--ink);
  border-top:none;padding:8px 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  cursor:pointer;text-align:left}
.pg-unsaved em{font-style:normal;float:right;text-decoration:underline}
.pg-wide{width:100%;margin-top:8px}
.pg-err{color:var(--stamp)}

.pg-hat{position:absolute;left:50%;transform:translateX(-50%);top:-24px;width:46px;z-index:6;pointer-events:none}
.pg-worn{position:absolute;left:50%;transform:translateX(-50%);top:124px;bottom:auto;white-space:nowrap;

  color:#FFE08A;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.pg-sign{position:absolute;left:50%;transform:translateX(-50%);top:44px;width:66px;background:#F2F3E8;

  text-align:center;padding:2px 1px;line-height:1.1;z-index:4}
.pg-body.big .pg-torso{width:66px;top:28px}
.pg-wearing{padding:12px;background:var(--bar);border-bottom:2px solid var(--ink)}
.pg-wearing b{display:block;font-size:13.5px}
.pg-wearing span{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
.pg-costume{width:30px;height:30px;flex:none;position:relative;display:flex;align-items:center;justify-content:center}
.pg-costume .pg-hat{position:static;transform:none;width:30px}
.pg-costume i{width:20px;height:20px;border:2px solid var(--ink);display:block}
.pg-closet{width:100%;height:100%;background:#7A5B3A;border:5px solid #5B412A;position:relative;

.pg-closet i{flex:1;background:#9A7A52;border:2px solid #5B412A}
.pg-closet span{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:40%;

.pg-event{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);

.pg-event b{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px}
.pg-event span{color:var(--soft);flex:1;min-width:120px}
.pg-event em{font-style:normal;font-family:var(--mono);font-weight:700;font-size:13px;

.pg-event.on.good em{background:#2C6B45;color:#fff;border-color:#2C6B45}
.pg-event.on.bad{background:#F0DCD9}
.pg-event.on.bad em{background:var(--stamp);color:#fff;border-color:var(--stamp)}
.pg-evhide{display:none}
@media(min-width:620px){.pg-evhide{display:block}}
.pg-evbell{background:none;border:1px solid var(--soft);color:var(--soft);font-family:var(--mono);
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;cursor:pointer}
.pg-desk.ghost{cursor:pointer;opacity:.75;filter:grayscale(.5)}
.pg-desk.ghost .pg-desklabel em{color:#C9CFBE}
.pg-feudhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;

.pg-tagline{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--stamp);
  margin:-6px 0 14px;text-transform:uppercase}
.pg-pitch{margin:0 0 14px;padding-left:18px}
.pg-pitch li{font-size:13px;line-height:1.5;margin-bottom:7px}
.pg-helpsub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin:14px 0 6px;border-top:1px solid var(--rule);padding-top:8px}

/* ---------------- characters: rig, walk cycle, emotes ---------------- */
.pg-body{position:relative;width:60px;height:88px;transform-origin:50% 100%}
.pg-flip{position:absolute;inset:0}
.pg-rig{position:absolute;inset:0}
.pg-body .pg-face{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:3}
.pg-torso{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:54px;z-index:2}
.pg-arm{position:absolute;top:38px;width:7px;height:20px;border-radius:4px;z-index:1;
  transform-origin:50% 0}
.pg-arm.left{left:6px}.pg-arm.right{right:6px}
.pg-leg{position:absolute;top:66px;width:8px;height:20px;border-radius:0 0 3px 3px;z-index:1;
  transform-origin:50% 0}
.pg-leg.left{left:19px}.pg-leg.right{right:19px}
.pg-shadow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:40px;height:8px;
  background:rgba(0,0,0,.3);border-radius:50%;z-index:0}
.pg-worn{position:absolute;left:50%;transform:translateX(-50%);top:124px;bottom:auto}
.pg-peername{position:absolute;left:50%;transform:translateX(-50%);top:90px;white-space:nowrap;
  font-size:10.5px;color:#F6F8EE;text-shadow:0 1px 3px rgba(0,0,0,.9);
  background:rgba(20,26,20,.55);padding:1px 6px;border-radius:3px}

.pg-body.idling .pg-rig{animation:pgbreathe 3.4s ease-in-out infinite}
.pg-body.walking .pg-rig{animation:pgstep .42s ease-in-out infinite}
.pg-body.walking .pg-leg.left{animation:pgswing .42s ease-in-out infinite}
.pg-body.walking .pg-leg.right{animation:pgswing .42s ease-in-out infinite reverse}
.pg-body.walking .pg-arm.left{animation:pgswing .42s ease-in-out infinite reverse}
.pg-body.walking .pg-arm.right{animation:pgswing .42s ease-in-out infinite}
@keyframes pgbreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes pgstep{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes pgswing{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}

.pg-bubble{z-index:20;position:absolute;left:50%;transform:translateX(-50%);top:-26px;z-index:9;
  background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:1px 7px;
  font-family:var(--mono);font-size:12px;font-weight:700;animation:pgpop .25s ease-out}
@keyframes pgpop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}

.pg-body.em-jump{animation:pgjump .5s ease-in-out 5}
@keyframes pgjump{0%,100%{transform:translateY(0)}35%{transform:translateY(-26px)}55%{transform:translateY(0)}}
.pg-body.em-dance .pg-rig{animation:pgdance .38s ease-in-out infinite}
@keyframes pgdance{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-5px)}}
.pg-body.em-dance .pg-arm.left{animation:pgswing .38s ease-in-out infinite}
.pg-body.em-dance .pg-arm.right{animation:pgswing .38s ease-in-out infinite reverse}
/* Raised hand, swaying above the shoulder. Rotating from the wrist with the
   arm down reads very differently and we are not doing that. */
.pg-body.em-wave .pg-arm.right{animation:pgwave .62s ease-in-out infinite;transform-origin:50% 0}
@keyframes pgwave{0%,100%{transform:rotate(158deg)}50%{transform:rotate(186deg)}}
.pg-body.em-panic .pg-rig{animation:pgshake .09s linear infinite}
@keyframes pgshake{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
.pg-body.em-shrug .pg-arm{animation:pgshrug 1.1s ease-in-out infinite}
@keyframes pgshrug{0%,100%{transform:rotate(0)}50%{transform:rotate(-58deg)}}
/* Arms held forward and still; the hunch does the work. */
.pg-body.em-type .pg-arm{transform:rotate(74deg)}
.pg-body.em-type .pg-rig{animation:pgtype .18s linear infinite}
@keyframes pgtype{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

.pg-emotes{display:flex;gap:4px;flex:none}
.pg-emote{width:30px;height:30px;border:2px solid var(--ink);background:var(--bar);cursor:pointer;
  font-family:var(--mono);font-size:13px;font-weight:700;line-height:1}
.pg-emote:active{transform:translateY(2px)}

/* ---------------- scenery ---------------- */
.pg-decor{position:absolute;pointer-events:none}
.pg-plant{width:36px;height:52px;background:
  radial-gradient(circle at 50% 30%,#3E6B45 0 16px,transparent 17px),

/* ---------------- coffee bar + fridge ---------------- */
.pg-coffeebar{width:100%;height:100%;background:#7C6A52;border:5px solid #574737;

.pg-machine{width:56px;height:66px;background:linear-gradient(#4A5058,#2E3339);border:3px solid #1E2225;
  position:relative;border-radius:3px 3px 0 0}
.pg-machine i{position:absolute;left:8px;right:8px;top:7px;height:12px;background:#8FA0AC;border:2px solid #1E2225}
.pg-machine b{position:absolute;left:50%;transform:translateX(-50%);top:26px;width:10px;height:14px;background:#C9B063}
.pg-machine u{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:26px;height:8px;
  background:#1E2225;border-top:3px solid #6E7076}
.pg-mugs{position:absolute;right:10px;bottom:10px;display:flex;gap:3px}
.pg-mugs span{width:10px;height:11px;background:#F2F3E8;border:2px solid #8A7248;border-radius:0 0 4px 4px}
.pg-fridge{width:100%;height:100%;background:#C8CFD4;border:5px solid #7E858A;position:relative;padding:7px}
.pg-glass{width:100%;height:100%;background:linear-gradient(160deg,rgba(190,225,235,.55),rgba(120,160,175,.5));
  border:3px solid #6E757A;display:flex;flex-direction:column;justify-content:space-between;padding:6px 4px}
.pg-shelf{display:flex;justify-content:space-around;border-bottom:2px solid rgba(80,95,100,.6);padding-bottom:3px}
.pg-shelf i{width:11px;height:19px;border-radius:2px;display:block}
.pg-shelf .c1{background:#B23B2E}.pg-shelf .c2{background:#2C6B45}
.pg-shelf .c3{background:#2B4B7A}.pg-shelf .c4{background:#C9B063}.pg-shelf .c5{background:#8A5B9E}
.pg-handle{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:5px;height:52px;
  background:#7E858A;border-radius:3px}
.pg-cup{width:22px;height:24px;flex:none;border:2px solid var(--ink);border-radius:0 0 6px 6px;background:var(--bar)}
.pg-cup.espresso{background:#3B2A1E}.pg-cup.drip{background:#6E4B2A}.pg-cup.flat{background:#C8B48A}
.pg-cup.energy{background:#C9B063;border-radius:2px}.pg-cup.protein{background:#D8D2C4;border-radius:2px}
.pg-cup.soda{background:#B23B2E;border-radius:2px}.pg-cup.water{background:#A9C3D6;border-radius:2px}

.pg-trophy{color:var(--brass);font-size:10px;letter-spacing:1px;margin-left:5px}
.pg-week{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--soft)}

.pg-jam.meet{background:#2E5C6E}
.pg-cowlevel{position:fixed;inset:0;z-index:9000;overflow:hidden;
  background:linear-gradient(160deg,#6FD36F 0%,#37B24D 34%,#F2C744 62%,#EE7BD0 100%)}
.pg-cowlevel.live{animation:pgcowtrip 5s linear infinite}
.pg-cowlevel.live.frantic{animation:pgcowtrip 1.6s linear infinite}
.pg-cowlevel.live.shaking{animation:pgcowtrip 5s linear infinite,pgcowshake .2s ease-out}
.pg-cowlevel.live.frantic.shaking{animation:pgcowtrip 1.6s linear infinite,pgcowshake .2s ease-out}
@keyframes pgcowshake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}
  50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}
  100%{transform:translate(0,0)}}
.pg-cow.runner{filter:drop-shadow(0 0 10px rgba(255,220,90,.95)) saturate(1.5)}
.pg-cowpop.gold i{background:#FBFCF7;border-color:#3F7449}
.pg-cowpop.gold b{color:#8A6A1E}
.pg-cowcombo{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:8;
  font-family:var(--mono);font-size:38px;font-weight:700;color:#FBFCF7;pointer-events:none;
  text-shadow:0 3px 0 rgba(0,0,0,.35);animation:pgcombopop .45s ease-out}
@keyframes pgcombopop{from{transform:translateX(-50%) scale(.4);opacity:0}
  60%{transform:translateX(-50%) scale(1.35);opacity:1}
  to{transform:translateX(-50%) scale(1);opacity:1}}
.pg-confetti{position:absolute;inset:0;pointer-events:none}
.pg-confetti i{position:absolute;left:50%;top:50%;width:12px;height:16px;border-radius:2px;
  background:hsl(calc(var(--n) * 41), 88%, 62%);
  animation:pgconfetti 1.5s ease-out forwards;
  animation-delay:calc(var(--n) * 18ms)}
@keyframes pgconfetti{
  from{transform:translate(-50%,-50%) rotate(0deg) scale(.4);opacity:1}
  to{transform:translate(calc(-50% + (var(--n) - 8.5) * 26px),
       calc(-50% + (var(--n) - 8.5) * (var(--n) - 8.5) * 3px - 220px)) rotate(540deg) scale(1);
     opacity:0}}
@keyframes pgcowtrip{0%{filter:hue-rotate(0deg) saturate(1.1)}
  50%{filter:hue-rotate(28deg) saturate(1.5)}100%{filter:hue-rotate(0deg) saturate(1.1)}}
.pg-cowsky{position:absolute;inset:-20%;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.20) 0 26px,rgba(0,0,0,0) 26px 60px);
  animation:pgcowdrift 1.6s linear infinite}
@keyframes pgcowdrift{from{background-position:0 0}to{background-position:120px 0}}
.pg-cowhaze{position:absolute;inset:-30%;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 45%),
             radial-gradient(circle at 72% 66%,rgba(120,255,220,.45) 0%,rgba(0,0,0,0) 50%);
  animation:pgcowswell 7s ease-in-out infinite alternate}
@keyframes pgcowswell{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.25) rotate(12deg)}}
.pg-cowjunk{position:absolute;left:-30%;font-family:var(--mono);font-size:26px;font-weight:700;
  color:rgba(255,255,255,.42);letter-spacing:.2em;white-space:nowrap;pointer-events:none;
  animation:pgcowfloat linear infinite}
@keyframes pgcowfloat{from{transform:translateX(0) rotate(-4deg)}
  to{transform:translateX(160vw) rotate(4deg)}}
.pg-cow{position:absolute;width:54px;height:76px;border:0;background:none;padding:0;
  cursor:pointer;animation:pgcowwalk ease-in-out infinite alternate;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.28));z-index:3}
.pg-cow svg{width:100%;height:100%;display:block;pointer-events:none}
@keyframes pgcowwalk{
  from{transform:translate(0,0) scaleX(var(--f))}
  to{transform:translate(var(--dx),var(--dy)) scaleX(var(--f))}}
.pg-splat{position:absolute;width:132px;height:132px;pointer-events:none;z-index:2;
  animation:pgsplatland .32s cubic-bezier(.2,1.6,.4,1)}
.pg-splat svg{width:100%;height:100%;display:block}
.pg-splat.gold svg path,.pg-splat.gold svg circle{fill:rgba(255,233,168,.9)}
@keyframes pgsplatland{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  to{opacity:1}}
.pg-cowpop{position:absolute;width:0;height:0;pointer-events:none;z-index:6}
.pg-cowpop u{position:absolute;width:15px;height:12px;border-radius:4px 4px 50% 50%;
  background:#E0A82E;box-shadow:inset 0 0 0 1.5px #B07E1C;
  animation:pgcowchunk .62s ease-out forwards}
.pg-cowpop u:nth-of-type(1){--px:-70px;--py:-52px}
.pg-cowpop u:nth-of-type(2){--px:66px;--py:-46px}
.pg-cowpop u:nth-of-type(3){--px:-58px;--py:56px}
.pg-cowpop u:nth-of-type(4){--px:74px;--py:44px}
@keyframes pgcowchunk{from{transform:translate(0,0) rotate(0deg);opacity:1}
  to{transform:translate(var(--px),var(--py)) rotate(540deg);opacity:0}}
.pg-cowpop i:nth-child(7){--px:-84px;--py:-8px}
.pg-cowpop i:nth-child(8){--px:82px;--py:6px}
.pg-cowpop i:nth-child(9){--px:-30px;--py:-72px}
.pg-cowpop i:nth-child(10){--px:34px;--py:70px}
.pg-cowpop i:nth-child(11){--px:-66px;--py:-62px}
.pg-cowpop i:nth-child(12){--px:62px;--py:66px}
.pg-cowpop i{position:absolute;width:11px;height:11px;border-radius:50%;background:#F2CE63;
  border:2px solid #8A5F12;animation:pgcowpop .6s ease-out forwards}
.pg-cowpop i:nth-child(1){--px:-46px;--py:-34px}
.pg-cowpop i:nth-child(2){--px:44px;--py:-30px}
.pg-cowpop i:nth-child(3){--px:-52px;--py:22px}
.pg-cowpop i:nth-child(4){--px:50px;--py:26px}
.pg-cowpop i:nth-child(5){--px:0px;--py:-54px}
.pg-cowpop i:nth-child(6){--px:6px;--py:48px}
@keyframes pgcowpop{from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--px),var(--py)) scale(.2);opacity:0}}
.pg-cowpop b{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);
  font-size:22px;font-weight:700;color:#2C2622;animation:pgcowmoo .6s ease-out forwards}
@keyframes pgcowmoo{from{transform:translate(-50%,-50%) scale(.6);opacity:1}
  to{transform:translate(-50%,-160%) scale(1.5);opacity:0}}
.pg-cowhud{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:8;
  display:flex;gap:16px;align-items:baseline;background:var(--ink);color:var(--paper);
  border-radius:14px;padding:7px 18px;font-family:var(--mono);letter-spacing:.1em}
.pg-cowhud b{font-size:19px}
.pg-cowfoot{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(0,0,0,.5);
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.pg-cowprize{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:center;border:0;background:none;cursor:pointer;z-index:9}
.pg-cowprizebox{width:96px;height:96px;border-radius:20px;background:#FBFCF7;border:4px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:52px;font-family:var(--mono);
  box-shadow:0 0 0 10px rgba(255,255,255,.4),0 0 46px 18px rgba(255,255,190,.85);
  animation:pgprizefloat 1.5s ease-in-out infinite alternate}
@keyframes pgprizefloat{from{transform:translateY(-12px) rotate(-5deg)}

.pg-cowprize em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(0,0,0,.6)}
.pg-cowopen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9}
.pg-petart{width:34px;height:34px;display:block}
.pg-petart.big{width:150px;height:150px;animation:pgpetreveal 1.5s ease-out forwards;

@keyframes pgpetreveal{
  0%{transform:scale(.2) rotate(0deg);opacity:0}
  30%{transform:scale(1.5) rotate(-9deg);opacity:1}

  50%{transform:scale(1.5) rotate(-7deg)}
  60%{transform:scale(1.5) rotate(7deg)}
  70%{transform:scale(1.5) rotate(-4deg)}

.pg-cowdone{position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;

.pg-cowloot{font-size:19px;font-weight:700;margin-top:4px}
.pg-cowsmall{font-size:12px;color:var(--soft);max-width:280px}
/* the pet itself, out on the floor beside you */
.pg-petcell{flex:none;width:34px;height:34px}
.pg-petcell.unknown{filter:brightness(0) opacity(.16)}
.pg-row.locked{opacity:.55;cursor:default}
.pg-mount{position:absolute;left:calc(50% + 7px);bottom:-2px;transform:translateX(-50%);
  width:86px;height:72px;pointer-events:none;z-index:0;
  animation:pgmountbob 1.9s ease-in-out infinite alternate}
.pg-body.walking .pg-mount{animation:pgmountbob .5s ease-in-out infinite alternate}
.pg-mount svg{width:100%;height:100%;display:block}

/* ================= THE PATRON GROUP: brand surfaces =================
   Dark marble and gold, used only on the way in. The office floor
   itself stays deliberately drab — that contrast is the joke.
   Drop /public/marble.jpg and /public/logo.png to use the real art;
   the gradients below stand in until you do. */
.pg-marble{
  min-height:100vh;
  background-image:
    url("/marble.jpg"),
    radial-gradient(130% 90% at 82% 6%, rgba(226,193,120,.20), rgba(0,0,0,0) 58%),
    linear-gradient(112deg, rgba(0,0,0,0) 45.6%, rgba(201,176,99,.5) 46.4%, rgba(0,0,0,0) 47.2%),
    linear-gradient(74deg,  rgba(0,0,0,0) 61.4%, rgba(201,176,99,.28) 62.2%, rgba(0,0,0,0) 63%),
    linear-gradient(138deg, rgba(0,0,0,0) 28%, rgba(201,176,99,.16) 28.6%, rgba(0,0,0,0) 29.4%),
    linear-gradient(158deg,#17171b 0%,#0c0c0f 42%,#1b1712 100%);
  background-size:cover,auto,auto,auto,auto,auto;
  background-position:center;
}
.pg-logo{display:block;margin:0 auto;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
.pg-markwrap{text-align:center}

.pg-wordmark{margin-top:8px;font-family:var(--mono)}

  background:linear-gradient(#F2D999,#C9A253 55%,#8A6A2A);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.pg-wordmark i{display:block;font-style:normal;font-size:10px;letter-spacing:.5em;text-indent:.5em;
  color:#C9A253;margin-top:5px;position:relative}
.pg-wordmark i::before,.pg-wordmark i::after{content:"";position:absolute;top:50%;width:22%;height:1px;

/* --- the invite door: let the artwork behind it do the talking --- */
.pg-door-page{position:relative;top:8vh;max-width:392px;margin:0 auto;padding:38px 36px 28px;
  text-align:center;
  background:linear-gradient(180deg,rgba(13,13,16,.90),rgba(8,8,10,.94));
  border:1px solid rgba(201,176,99,.40);
  box-shadow:0 40px 90px rgba(0,0,0,.72), 0 0 190px 110px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(7px) saturate(1.1);
  -webkit-backdrop-filter:blur(7px) saturate(1.1)}
/* a second hairline, set in from the first — the detail that reads as expensive */
.pg-door-page::before{content:"";position:absolute;inset:9px;pointer-events:none;
  border:1px solid rgba(201,176,99,.16)}
/* corner ticks */
.pg-door-page::after{content:"";position:absolute;inset:9px;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(201,176,99,.55) 0 14px,rgba(0,0,0,0) 14px) 0 0/100% 1px no-repeat,
    linear-gradient(270deg,rgba(201,176,99,.55) 0 14px,rgba(0,0,0,0) 14px) 100% 0/100% 1px no-repeat,
    linear-gradient(90deg,rgba(201,176,99,.55) 0 14px,rgba(0,0,0,0) 14px) 0 100%/100% 1px no-repeat,
    linear-gradient(270deg,rgba(201,176,99,.55) 0 14px,rgba(0,0,0,0) 14px) 100% 100%/100% 1px no-repeat}

.pg-dooreyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.44em;text-indent:.44em;

.pg-goldtitle{font-family:var(--mono);font-size:31px;font-weight:700;text-transform:uppercase;

  background:linear-gradient(180deg,#FBF0D2 0%,#E0C176 38%,#B8934A 62%,#7E6224 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}

.pg-doorlede{color:rgba(233,228,214,.78);font-size:12.5px;letter-spacing:.01em;margin:0 0 18px}

/* the sink, and the mug that lives in it */
.pg-sink{width:100%;height:100%;background:#C3C8BC;border:4px solid #8A9084;position:relative}

.pg-sink span{position:absolute;left:50%;transform:translateX(-50%);top:-9px;width:6px;height:16px;

/* scenery */
.pg-wetfloor{width:40px;height:52px;background:linear-gradient(#E8B23C,#D89A22);

.pg-watercooler{width:46px;height:78px;background:#DDE2D4;border:3px solid #8A9084;border-radius:4px}

/* ---------------- doors to rooms nobody enters ---------------- */
.pg-door{position:absolute;inset:0}
.pg-door i{position:absolute;display:block}
.pg-door .frame{inset:0;background:#5E4A33;border:4px solid #46381F}
.pg-door .panel{inset:12px;background:#7C6647;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.pg-door .knob{right:20px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;

.pg-door .sign{position:absolute;left:50%;top:34%;transform:translateX(-50%);
  background:#B23B2E;color:#FFF3E6;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  padding:3px 8px;white-space:nowrap;border:2px solid #7A2119}
.pg-door.meeting .sign{background:#2C6B45;border-color:#1D4A2F}
.pg-door.lounge .tape{left:-4px;right:-4px;top:58%;height:16px;transform:rotate(-8deg);

.pg-door.restroom .vac{left:50%;bottom:16%;width:26px;height:26px;margin-left:-13px;

/* the kitchen: an alcove, not a sealed room */
.pg-kitchenfloor{position:absolute;width:700px;height:560px;
  background:#8E937F;border:6px solid #7C8071;border-radius:4px;

.pg-kitchenfloor i{position:absolute;left:0;right:0;top:0;height:56px;
  background:repeating-linear-gradient(90deg,#D7DBCE 0 26px,#C9CFBE 26px 52px);
  border-bottom:5px solid #A89878}
.pg-kitchenfloor span{position:absolute;left:12px;bottom:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(30,40,30,.45)}

.pg-art{position:absolute;inset:10px;pointer-events:none}
.pg-art i{position:absolute;display:block}
.pg-artnote{position:absolute;left:50%;bottom:14%;transform:translateX(-50%) rotate(-3deg);
  background:#E8B23C;color:#3A2E10;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  padding:3px 8px;border:2px solid #8A6A1E;white-space:nowrap}
/* conference room B */
.confb .tbl{left:18%;top:34%;right:18%;height:34%;background:#7C6647;border:3px solid #5E4C33;border-radius:40px}
.confb .ch{width:20px;height:20px;background:#4A5568;border-radius:4px}
.confb .ch.a{left:12%;top:30%} .confb .ch.b{left:12%;bottom:26%}
.confb .ch.c{right:12%;top:30%} .confb .ch.d{right:12%;bottom:26%}
.confb .scr{left:50%;top:6%;width:38%;height:16%;margin-left:-19%;background:#20262B;border:3px solid #454D42}
.confb .cord{left:50%;top:22%;width:2px;height:12%;background:#454D42}
/* the cigar lounge, forever unfinished */
.lounge .sheet{left:6%;top:6%;width:44%;height:56%;background:rgba(230,235,225,.35);
  border:2px dashed rgba(255,255,255,.5)}
.lounge .scaffold{right:8%;top:10%;width:34%;height:60%;
  background:repeating-linear-gradient(0deg,#8A7A4A 0 4px,rgba(0,0,0,0) 4px 22px),
             repeating-linear-gradient(90deg,#8A7A4A 0 4px,rgba(0,0,0,0) 4px 40px)}
.lounge .chair{left:16%;bottom:16%;width:52px;height:38px;background:#6B3B2E;border:3px solid #4A2820;border-radius:8px 8px 3px 3px}
.lounge .bucket{right:16%;bottom:14%;width:26px;height:22px;background:#9AA294;border:2px solid #6E756B;border-radius:0 0 5px 5px}

.lounge .web.w1{left:2px;top:2px} .lounge .web.w2{right:2px;top:2px;transform:scaleX(-1)}
/* restroom */
.restroom .stall{top:8%;width:38%;height:52%;background:#B8C0B2;border:3px solid #8A9084}
.restroom .stall.a{left:6%} .restroom .stall.b{right:6%}
.restroom .basin{left:50%;bottom:14%;width:34%;height:16%;margin-left:-17%;background:#DDE2D4;border:3px solid #8A9084;border-radius:6px}
.restroom .mirror{left:50%;bottom:34%;width:26%;height:14%;margin-left:-13%;background:#C9D6DC;border:2px solid #8A9084}
/* meeting room */
.meeting .tbl{left:14%;top:26%;right:14%;height:40%;background:#7C6647;border:3px solid #5E4C33}
.meeting .ch{width:20px;height:20px;background:#4A5568;border-radius:4px}
.meeting .ch.a{left:6%;top:44%} .meeting .ch.b{right:6%;top:44%}
.meeting .board{left:20%;top:6%;right:20%;height:14%;background:#EDF0E6;border:3px solid #8A9084}
/* kitchen */
.kitchen .counter{left:0;bottom:0;right:0;height:16%;background:#A89878;border-top:4px solid #7C6B4A}
.kitchen .tile{left:0;right:0;top:0;height:26%;
  background:repeating-linear-gradient(90deg,#D7DBCE 0 22px,#C9CFBE 22px 44px)}

/* clearer scenery */
.pg-wetfloor{width:44px;height:58px;background:linear-gradient(#F0C24A,#D89A22);
  clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:4px solid #8A6A1E;position:relative}
.pg-wetfloor::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:10px;height:18px;background:#3A2E10;
  clip-path:polygon(40% 0,60% 0,60% 40%,100% 100%,70% 100%,50% 60%,30% 100%,0 100%,40% 40%)}

/* offices whose door is on the bottom wall (Chance's corner office) */
.pg-office.bottom::before,.pg-office.bottom::after{top:auto;bottom:-10px}
.pg-office.bottom .pg-officedoor{top:auto;bottom:-3px}
.pg-officeplate.bottom{top:auto;bottom:-44px}

/* a water cooler that reads as a water cooler */
.pg-wcooler{width:100%;height:100%;position:relative;background:#DDE2D4;border:3px solid #7C8378;
  border-radius:4px}
.pg-wcooler i{position:absolute;left:8px;right:8px;top:4px;height:38px;background:#9FC4D8;
  border:2px solid #6E8FA0;border-radius:6px 6px 2px 2px}
.pg-wcooler b{position:absolute;left:50%;transform:translateX(-50%);top:48px;width:16px;height:10px;
  background:#5D6C5B;border-radius:0 0 3px 3px}
.pg-wcooler u{position:absolute;left:10px;bottom:6px;width:14px;height:16px;background:#F2F3E8;
  border:2px solid #7C8378;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%)}
.pg-office.ghost{opacity:.9}
.pg-office.ghost .pg-officefloor{filter:grayscale(.45) brightness(.92)}

/* small objects get an invisible tap margin so a finger can hit them */
.pg-fx::before{content:"";position:absolute;inset:-14px;}

/* the landing card sits on the artwork; it doesn't need the mark repeated */
.pg-gatehead{font-family:var(--mono);font-size:10px;letter-spacing:.4em;text-indent:.4em;
  text-transform:uppercase;color:var(--soft);text-align:center;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--rule)}

/* ---------------- the landing card, matched to the invite door ----------------
   Door and landing are the brand. The badge and the paperwork stay on paper,
   because those are documents. */
.pg-hirepage.pg-gate{
  background:linear-gradient(180deg,rgba(13,13,16,.90),rgba(8,8,10,.94));
  border:1px solid rgba(201,176,99,.40);
  box-shadow:0 40px 90px rgba(0,0,0,.72), 0 0 190px 110px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(7px) saturate(1.1);
  -webkit-backdrop-filter:blur(7px) saturate(1.1);
  position:relative;color:rgba(233,228,214,.82)}
.pg-gate::before{content:"";position:absolute;inset:9px;pointer-events:none;
  border:1px solid rgba(201,176,99,.16)}
.pg-gate .pg-gatehead{color:rgba(201,176,99,.72);border-bottom-color:rgba(201,176,99,.22)}
.pg-gate .pg-eyebrow{color:rgba(201,176,99,.55)}
.pg-gate .pg-h1{
  background:linear-gradient(180deg,#FBF0D2 0%,#E0C176 38%,#B8934A 62%,#7E6224 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.pg-gate .pg-tagline{color:#C9A253;border-color:rgba(201,176,99,.35)}
.pg-gate .pg-pitch li{color:rgba(233,228,214,.80)}
.pg-gate .pg-pitch li b{color:#F6E3AE}
.pg-gate .pg-fine{color:rgba(196,190,172,.45)}
.pg-gate .pg-work{background:linear-gradient(180deg,#C9A253,#8A6A2A);color:#14140F;

.pg-gate .pg-btn.ghost{background:rgba(0,0,0,0);color:#E8DFC4;
  border:1px solid rgba(201,176,99,.45)}
.pg-gate .pg-field span{color:rgba(201,176,99,.7)}
.pg-gate .pg-field input{background:rgba(0,0,0,.35);color:#F6E3AE;

.pg-gate .pg-stamp{color:#C9A253;border-color:rgba(201,176,99,.5)}
.pg-gate .pg-pad p{color:rgba(233,228,214,.8)}
.pg-gate .pg-pad p b{color:#F6E3AE}

/* nicknames, out of office, and the stag that briefly behaves */
.pg-nick{position:absolute;left:50%;transform:translateX(-50%);top:107px;white-space:nowrap;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:#FFD2CE;
  background:rgba(120,30,26,.72);padding:1px 6px;border-radius:3px;
  text-shadow:0 1px 2px rgba(0,0,0,.9)}
.pg-ooo{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;
  text-transform:uppercase;color:#C9A253;margin-top:1px}
/* the one piece of scenery that is not scenery: .pg-decor sets pointer-events:none
   for everything on the walls, which silently ate this frame's onClick */
.pg-mascotframe{cursor:pointer;pointer-events:auto}
.pg-mascotframe.real{background-image:url("./logo.png");background-size:contain;
  background-repeat:no-repeat;background-position:center;background-color:#14140F;
  box-shadow:0 0 26px rgba(201,162,83,.55)}
.pg-mascotframe.real > *{opacity:0;transition:opacity .2s}
.pg-nickbox{border:1px solid var(--rule);padding:12px;margin:12px 0;background:rgba(0,0,0,.02)}

/* whatever the machine gave you, said where you can actually read it */
.pg-vendout{margin:10px 0 0;padding:10px 12px;background:#1B211C;color:#F6E3AE;
  font-family:var(--mono);font-size:11.5px;line-height:1.45;border-left:3px solid #C9A253}

/* ---------------- mail order: things that do nothing ---------------- */
.pg-catswitch{display:flex;gap:8px;margin:10px 0 14px}
.pg-catswitch .pg-btn{flex:1}
.pg-catswitch .pg-btn.on,.pg-nonsense-tabs .pg-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pg-catslot{margin-bottom:16px}
.pg-row.done{opacity:.6}
.pg-row.done .pg-right b{color:#2C6B45}

/* glow — a ring of light around the whole person */
.pg-body.glow-g1{filter:drop-shadow(0 0 6px rgba(255,236,190,.55))}
.pg-body.glow-g2{filter:drop-shadow(0 0 9px rgba(201,162,83,.85))}
.pg-body.glow-g3{filter:drop-shadow(0 0 11px rgba(96,158,214,.9))}
.pg-body.glow-g4{filter:drop-shadow(0 0 13px rgba(200,60,45,.92))}
.pg-body.glow-g5{filter:drop-shadow(0 0 13px rgba(70,205,120,.92))}
.pg-body.glow-g6{filter:drop-shadow(0 0 16px rgba(168,88,232,.95))
  drop-shadow(0 0 30px rgba(168,88,232,.5))}

/* presence */
.pg-body.size-s1{transform:scale(1.10);transform-origin:50% 100%}
.pg-body.size-s2{transform:scale(1.20);transform-origin:50% 100%}
.pg-body.size-s3{transform:scale(1.35);transform-origin:50% 100%}

/* something to carry */
.pg-held{position:absolute;right:-14px;top:64px;display:block;z-index:6}
.pg-held.held-h1{width:13px;height:14px;background:#E8EAE0;border:2px solid #6E756B;
  border-radius:0 0 4px 4px}
.pg-held.held-h2{width:14px;height:19px;background:#C9A96E;border:2px solid #6B5433}
.pg-held.held-h3{width:22px;height:16px;background:#5E4A33;border:2px solid #3A2C1C;border-radius:2px}
.pg-held.held-h4{width:14px;height:20px;background:linear-gradient(#F3D68B,#B8933F);
  border:2px solid #7E6224;border-radius:7px 7px 2px 2px}
.pg-held.held-h5{width:18px;height:12px;background:linear-gradient(#FBEFC8,#C9A253);
  border:2px solid #8A6A2A;border-radius:3px;box-shadow:0 0 10px rgba(201,162,83,.9)}

/* atmosphere */
/* atmosphere — its own element, so it can't fight the shadow rule */
.pg-aura{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);
  width:86px;height:86px;border-radius:50%;pointer-events:none;z-index:-1;display:block}
.pg-aura.aura-a1{background:radial-gradient(circle,rgba(255,240,190,.55) 0%,rgba(255,230,150,.18) 45%,rgba(0,0,0,0) 72%);
  animation:pgShimmer 3.4s ease-in-out infinite}
.pg-aura.aura-a2{background:radial-gradient(circle,rgba(206,238,255,.72) 0%,rgba(150,210,255,.28) 45%,rgba(0,0,0,0) 72%);
  animation:pgShimmer 2.2s ease-in-out infinite}
.pg-aura.aura-a3{background:radial-gradient(circle,rgba(255,170,50,.85) 0%,rgba(210,70,10,.35) 45%,rgba(0,0,0,0) 74%);

@keyframes pgShimmer{0%,100%{opacity:.45}50%{opacity:1}}

/* the office fittings */
.pg-officedesk[data-desk="d1"]{background:#A08A62}

/* hung on the office wall, not lying on the floor: frame, mount, glass and wire */
.pg-officeart{position:absolute;left:14px;top:-6px;

   All the words and the map live here.

   Edit anything in this file freely; it can never corrupt a save.
   ================================================================== */

const ROOM = { w: 3400, h: 1700 };
const WALL_H = 130;
const HEAT_LIMIT = 5;

/* Eight private offices along the bottom of the floor. Your desk lives in
   yours, and work only happens there. */
const DOOR_W = 90;

/* ------------------------------------------------------------------
   THE FLOOR PLAN
   A wide central hall with a wing on each side and offices along the
   bottom in two clusters, split by a lobby. Every door opens onto the
   hall, nothing is more than a few seconds' walk from anything else,
   and the rooms nobody can enter are visible from the hall so the joke
   lands without a detour.
   ------------------------------------------------------------------ */
const mk = (o) => ({
  ...o,
  doorX: o.door === "top" || o.door === "bottom"
    ? o.x + (o.w - DOOR_W) / 2 : null,
  doorY: o.door === "left" || o.door === "right"
    ? o.y + (o.h - DOOR_W) / 2 : null,
  cx: o.x + o.w / 2,
  cy: o.y + o.h / 2,
});

/* Offices: two clusters of four, staggered depths so it doesn't read as
   a row of lockers. Chance's is off on its own in the far corner. */
const OFF_W = 300;
const OFFICES = [
  mk({ i: 0, x: 120,  y: 1300, w: OFF_W, h: 380, door: "top" }),
  mk({ i: 1, x: 440,  y: 1340, w: OFF_W, h: 340, door: "top" }),
  mk({ i: 2, x: 760,  y: 1300, w: OFF_W, h: 380, door: "top" }),
  mk({ i: 3, x: 1080, y: 1340, w: OFF_W, h: 340, door: "top" }),
  mk({ i: 4, x: 1800, y: 1340, w: OFF_W, h: 340, door: "top" }),
  mk({ i: 5, x: 2120, y: 1300, w: OFF_W, h: 380, door: "top" }),
  mk({ i: 6, x: 2440, y: 1340, w: OFF_W, h: 340, door: "top" }),
  mk({ i: 7, x: 2760, y: 1300, w: OFF_W, h: 380, door: "top" }),
  // the desk at the end of the row that nobody reassigned
  mk({ i: 8, x: 3080, y: 1340, w: OFF_W, h: 340, door: "top" }),
].map((o) => ({ ...o, deskX: o.x + 50,
                deskY: o.door === "bottom" ? o.y + 70 : o.y + o.h - 170,
                deskW: 200, deskH: 100 }));
const STAFF_OFFICES = 8;

/** Offices are the only walled rooms. Everything else is a door or an alcove,
    so the whole floor stays walkable. */
function wallsFor(b, gapSize) {
  const gx = b.x + (b.w - gapSize) / 2;
  const hRow = (y, gap) => gap
    ? [{ x: b.x, y, w: gx - b.x, h: 10 },
       { x: gx + gapSize, y, w: b.x + b.w - gx - gapSize, h: 10 }]
    : [{ x: b.x, y, w: b.w, h: 10 }];
  return [
    ...hRow(b.y, b.door === "top"),
    ...hRow(b.y + b.h - 10, b.door === "bottom"),
    { x: b.x, y: b.y, w: 10, h: b.h },
    { x: b.x + b.w - 10, y: b.y, w: 10, h: b.h },
  ];
}
const WALLS = OFFICES.flatMap((o) => wallsFor(o, DOOR_W));

function officeAt(x, y) {
  return OFFICES.find((o) => x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h) || null;
}


function officeFor(board, id) {
  const order = [...board].sort((a, b) =>
    new Date(a.created_at || 0) - new Date(b.created_at || 0));
  const i = order.findIndex((p) => p.id === id);
  return i < 0 ? null : OFFICES[i % STAFF_OFFICES];
}

// Shared-clock shuffle bag: every visitor gets one turn per round before
// anyone repeats. Fisher-Yates uses a deterministic seed so all browsers
// agree on who appears, without storing or syncing client-side state.
// Memoized shared-clock eligibility count; prevents a full-floor interval
// from silently consuming a visitor's turn. Initialized at this season's reset.
const visitorOriginSlot=Math.floor(Date.UTC(2026,9,20)/(4*60000));
let visitorLastSlot=visitorOriginSlot-1;
let visitorEligibleCount=0;
let visitorLastResult=null;
function visitorOrdinal(slot){
 if(slot<visitorOriginSlot)return ((slot%OFFICE_CAST.length)+OFFICE_CAST.length)%OFFICE_CAST.length;
 if(slot<visitorLastSlot){
   visitorLastSlot=visitorOriginSlot-1;visitorEligibleCount=0;
 }
 if(slot===visitorLastSlot)return visitorLastResult;
 while(visitorLastSlot<slot){
   visitorLastSlot++;
   const stamp=visitorLastSlot*4*60000;
   const blocked=false;
   if(!blocked)visitorEligibleCount++;
   visitorLastResult=blocked?null:visitorEligibleCount-1;
 }
 return visitorLastResult;
}

function fmt(n) {
  if (!isFinite(n) || n < 0) return "0";
  if (n < 1000) return n < 10 ? String(Math.round(n * 10) / 10) : String(Math.floor(n));
  let t = 0;
  while (n >= 1000 && t < SUF.length - 1) { n /= 1000; t++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[t];
}

  return "Senior Meeting Attendee, allegedly";
}
function ago(t) {
  const s = Math.max(1, Math.round((Date.now() - new Date(t).getTime()) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

/* Mirrors the SQL so the client can tick smoothly between syncs.
   The server number always wins — this is only for the animation. */
function itemMult(upgrades, catalogUpgrades, id) {
  let m = 1;
  for (const u of catalogUpgrades || []) {
    if (!(upgrades || []).includes(u.id)) continue;
    if (u.t === "item" && u.target === id) m *= u.mult;
    if (u.t === "all") m *= u.mult;
  }
  return m;
}
function calcRate(p, cat) {
  let r = 0;
  for (const it of cat.items || []) {
    const c = (p.owned || {})[it.id] || 0;
    if (c) r += c * it.rate * itemMult(p.upgrades, cat.upgrades, it.id);
  }
  return r;
}
/** Must stay in step with live_mult() in Postgres. The server pays out; if the
    two disagree, the screen is lying. Order and terms mirror the SQL exactly.
    `ctx` carries the office-wide pieces the player row doesn't hold:
    { tiers, streak, tz }. */
function liveMult(p, ctx = {}) {
  const now = Date.now();
  let m = 1 + (p.equity || 0) * 0.03 + Math.min(p.goodwill || 0, 30) * 0.01 + (p.raises || 0) * 0.02;
  m *= 1 + 0.05 * perkCount(p, "compound");
  if (p.dept === "finance") m *= 1.12;
  if ((p.heat || 0) >= HEAT_LIMIT) m *= 0.75;
  for (const b of p.buffs || []) {
    // Delayed starts live in `start`. Older rows put a timestamp in `from`,
    // and older rows still put a *label* there — so only trust a real date.
    const raw = b.start || (/^\d{4}-\d{2}-\d{2}/.test(b.from || "") ? b.from : null);
    const started = !raw || Date.parse(raw) <= now;
    if (started && new Date(b.until).getTime() > now) m *= b.mult;
  }
  if (p.frenzy_until && new Date(p.frenzy_until).getTime() > now) m *= 7;
  m *= 1 + 0.03 * (ctx.tiers || 0);
  m *= 1 + 0.02 * Math.min(ctx.streak || 0, 10);
  const h = officeHour(ctx.tz);
  if (h.hour >= 18 || h.hour < 7 || h.dow > 5) m *= 1.15;
  return m * (noraDrinksAt(now)?.mult || 1);
}

/** How many of a perk you hold — mirrors perk_of() in Postgres. */
function perkCount(p, key) {
  const list = p?.perks;
  if (Array.isArray(list)) return list.filter((x) => x === key || x?.id === key).length;
  if (list && typeof list === "object") return Number(list[key] || 0);
  return 0;
}

/** The office clock, not yours — after-hours pays the same for everybody. */
function officeHour(tz = "America/New_York") {
  try {
    const f = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hour: "numeric", hour12: false, weekday: "short",
    }).formatToParts(new Date());
    const hour = Number(f.find((x) => x.type === "hour").value) % 24;
    const days = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
    return { hour, dow: days[f.find((x) => x.type === "weekday").value] || 1 };
  } catch {
    const d = new Date();
    return { hour: d.getHours(), dow: ((d.getDay() + 6) % 7) + 1 };
  }
}

/** Where Chance is right now, or null. Derived from the clock so everyone
    in the office sees him on the floor at the same moment. */
function wesAt(t = Date.now(), extra = []) {
  const bucket = Math.floor((t - CHANCE.offsetMs) / CHANCE.everyMs);
  const start = bucket * CHANCE.everyMs + CHANCE.offsetMs;
  const into = t - start;
  if (into < 0 || into > CHANCE.stayMs) return null;
  const legs = CHANCE.path.length - 1;
  const per = CHANCE.stayMs / legs;
  const leg = Math.min(legs - 1, Math.floor(into / per));
  const f = (into - leg * per) / per;
  const a = CHANCE.path[leg], b = CHANCE.path[leg + 1];
  const pool = CHANCE.mumbles.concat(extra || []);
  const line = pool[(Math.abs(bucket) * 3 + Math.floor(into / 7000)) % pool.length];
  return {
    x: a.x + (b.x - a.x) * f,
    y: a.y + (b.y - a.y) * f,
    facing: b.x >= a.x ? 1 : -1,
    line,
    leaving: into > CHANCE.stayMs - 12000,
  };
}

/** Where Dave is right now, or null. Same clock-derived scheme as wesAt,
    so the whole office sees him step out at the same moment. Deliberately a
    separate function rather than a refactor of wesAt — Chance's timing is
    load-bearing and already correct. */
function halAt(t = Date.now(), extra = []) {
  const bucket = Math.floor((t - DAVE.offsetMs) / DAVE.everyMs);
  const start = bucket * DAVE.everyMs + DAVE.offsetMs;
  const into = t - start;
  if (into < 0 || into > DAVE.stayMs) return null;
  const legs = DAVE.path.length - 1;
  const per = DAVE.stayMs / legs;
  const leg = Math.min(legs - 1, Math.floor(into / per));
  const f = (into - leg * per) / per;
  const a = DAVE.path[leg], b = DAVE.path[leg + 1];
  const pool = DAVE.lines.concat(extra || []);
  return {
    x: a.x + (b.x - a.x) * f,
    y: a.y + (b.y - a.y) * f,
    facing: b.x >= a.x ? 1 : -1,
    line: pool[Math.abs(bucket) % pool.length],   // one line per visit, not per leg
    leaving: into > DAVE.stayMs - 10000,
  };
}

/** Mirrors printer_window() in Postgres — 4 minutes of jam every third
    20-minute bucket. Change one, change both. */
function printerJam(t = Date.now()) {
  const sec = Math.floor(t / 1000);
  const bucket = Math.floor(sec / 1200);
  const into = sec % 1200;
  if (bucket % 3 !== 1 || into >= 240) return null;
  return { window: bucket, endsIn: (240 - into) * 1000 };
}

/** Mirrors meeting_window() in Postgres: one meeting an hour in Conference Room B,
    a two minute window, offset drifting across the hour. Integer maths only on both
    sides so the two agree exactly. Change one, change both. */
const MEET_EVERY = 3600, MEET_LEN = 120, MEET_SPREAD = 3480;
function meetingOffset(bucket) { return (bucket * 1237) % MEET_SPREAD; }
function meetingAt(t = Date.now()) {
  const sec = Math.floor(t / 1000);
  const bucket = Math.floor(sec / MEET_EVERY);
  const into = sec % MEET_EVERY;
  const off = meetingOffset(bucket);
  if (into >= off && into < off + MEET_LEN) {
    return { window: bucket, endsIn: (off + MEET_LEN - into) * 1000 };
  }
  // otherwise say when the next one starts
  let nb = bucket, ns = off;
  if (into >= off + MEET_LEN) { nb = bucket + 1; ns = meetingOffset(nb); }
  const at = nb * MEET_EVERY + ns;
  return { window: null, startsIn: (at - sec) * 1000 };
}

// Full-map, equally weighted safe positions. Cached only after the complete map is initialized.
// Chair art is 46x54; padding also keeps its bobbing animation and nearby labels clear.
let chairSpawnCache=null;
function goodChairSpawns(){
 if(chairSpawnCache)return chairSpawnCache;
 const props=DECOR.filter(d=>["plant","deadplant","boxes","wetfloor"].includes(d.t)).map(d=>({...d,w:d.t==="boxes"?80:45,h:d.t==="boxes"?62:64}));
 const obstacles=[...OFFICES,...FIXTURES.map(f=>({x:f.x-30,y:f.y-10,w:f.w+60,h:f.h+50})),...SCENERY.map(p=>({...p,h:p.h+22})),...props];
 const points=[];
 for(let cy=WALL_H+70;cy<=ROOM.h-60;cy+=40){
  for(let cx=60;cx<=ROOM.w-60;cx+=40){
   const x=cx-23,y=cy-27;
   if(obstacles.some(b=>x<b.x+b.w+18&&x+46>b.x-18&&y<b.y+b.h+18&&y+54>b.y-18))continue;
   if(blocked(cx,cy)||blocked(cx,cy+27))continue;
   points.push({x,y});
  }
 }
 if(!points.length)throw new Error("No safe good-chair spawn positions in the floor plan");
 chairSpawnCache=points;
 return points;
}
/** Timing mirrors chair_window() in Postgres: every 7 minutes, visible for 40 seconds.
    Placement is client-side and deterministic per window, so all clients see the same chair.
    Claims and rewards remain server-authoritative and are unchanged. */
function chairAt(t = Date.now()) {
 const sec=Math.floor(t/1000),into=sec%420;
 if(into>=40)return null;
 const w=Math.floor(sec/420),points=goodChairSpawns();
 const point=points[officeHash(w^0x43484149)%points.length];
 return {window:w,x:point.x,y:point.y,endsIn:(40-into)*1000};
}

/* ==================================================================
   OFFICE-WIDE EVENTS
   No cron job, no server writes, no push infrastructure. The schedule
   is a pure function of the clock, so every browser and the database
   independently agree on what is happening right now.
   The identical function exists in supabase/003_events.sql — if you
   change one, change both or people will see the wrong countdown.
   ================================================================== */

const EVENTS = [
  { id: "drill",   mult: 0.3,  name: "Fire Drill",
    line: "Everybody outside. Nobody earns. Attendance is taken." },
  { id: "lunch",   mult: 2.5,  name: "Catered Lunch",
    line: "Someone ordered too much. Morale and output both spike." },
  { id: "allhands", mult: 0.5, name: "Surprise All-Hands",
    line: "Ninety minutes of content compressed into four. Cameras on." },
  { id: "printer", mult: 2,    name: "The Printer Works",
    line: "Somebody fixed it. Nobody knows who. Print everything now." },
  { id: "outage",  mult: 0.35, name: "Power Flicker",
    line: "Everything unsaved is gone. Everything saved is also gone." },
  { id: "donuts",  mult: 3,    name: "Unclaimed Donuts",
    line: "A box appeared in the kitchen. No name on it. Move fast." },
  { id: "audit",   mult: 0.6,  name: "Surprise Audit",
    line: "Everyone looks extremely busy. Nobody is doing anything." },
  { id: "casual",  mult: 1.8,  name: "Casual Friday (on a Tuesday)",
    line: "Declared without warning. Nobody is arguing with it." },
];

const CYCLE = 12;        // 12 hourly slots, 8 of which have an event
const DURATION_MIN = 4;

/** Which event, if any, is running at time t (ms). */
function eventAt(t = Date.now()) {
  const bucket = Math.floor(t / 3600000);
  const idx = ((bucket % CYCLE) + CYCLE) % CYCLE;
  if (idx >= EVENTS.length) return null;
  const startMin = ((bucket * 17) % 45 + 45) % 45;
  const hourStart = bucket * 3600000;
  const start = hourStart + startMin * 60000;
  const end = start + DURATION_MIN * 60000;
  if (t < start || t >= end) return null;
  return { ...EVENTS[idx], start, end };
}

/** The next event after time t, for the countdown. */
function nextEvent(t = Date.now()) {
  for (let i = 0; i < CYCLE + 1; i++) {
    const bucket = Math.floor(t / 3600000) + i;
    const idx = ((bucket % CYCLE) + CYCLE) % CYCLE;
    if (idx >= EVENTS.length) continue;
    const startMin = ((bucket * 17) % 45 + 45) % 45;
    const start = bucket * 3600000 + startMin * 60000;
    if (start <= t) continue;
    return { ...EVENTS[idx], start, end: start + DURATION_MIN * 60000 };
  }
  return null;
}

function countdown(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, "0")}`;
}

/* ==================================================================
   SOUND
   Everything here is synthesised at runtime — no audio files, so
   nothing extra to upload and nothing extra to load. Short, quiet,
   and office-safe: somebody will be playing this with the volume up
   at a desk two feet from a colleague.

let ctx = null, master = null;
let muted = false, soundLevel = 1;
const soundLast = {}, soundBurst = [];
try { const saved=localStorage.getItem("ih_sound_level"); if(saved!==null&&Number.isFinite(Number(saved)))soundLevel=Math.max(0,Math.min(1,Number(saved))); } catch {}
function syncAudioGain(){if(master)try{master.gain.value=muted||document.hidden?0:soundLevel;}catch{}}
document.addEventListener?.("visibilitychange",syncAudioGain);
function getSoundLevel(){return soundLevel;}
function setSoundLevel(v){
 if(!Number.isFinite(Number(v)))return soundLevel;
 soundLevel=Math.max(0,Math.min(1,Number(v)));
 try{localStorage.setItem("ih_sound_level",String(soundLevel));syncAudioGain();}catch{}
 return soundLevel;
}

try {
  muted = localStorage.getItem("ih_muted") === "1";
} catch { /* private mode */ }

function isMuted() { return muted; }

function setMuted(v) {
  muted = !!v;
  syncAudioGain();
  try { localStorage.setItem("ih_muted", muted ? "1" : "0"); } catch { /* ignore */ }
  return muted;
}

/** Browsers won't let audio start until the user has interacted. */
function wakeAudio() {
  if (muted) return;
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=muted?0:soundLevel;master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  } catch { ctx = null; }
}

function tone({ freq = 440, to = null, dur = 0.14, type = "sine", vol = 0.09, delay = 0 }) {
  if (muted || !ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
  // quick attack, smooth tail — no clicks
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(master || ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function noise({ dur = 0.18, vol = 0.05, delay = 0, hp = 800 }) {
  if (muted || !ctx) return;
  const t0 = ctx.currentTime + delay;
  const frames = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < frames; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / frames);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = "highpass";
  filt.frequency.value = hp;
  const gain = ctx.createGain();
  gain.gain.value = vol;
  src.connect(filt).connect(gain).connect(master || ctx.destination);
  src.start(t0);
}

function sfx(name) {
  if (muted || soundLevel===0 || document.hidden) return false;
  const fn=SOUNDS[name];if(!fn)return false;
  const now=Date.now(),gap={work:100,buy:250,kind:700,event:3500,jam:5000,pop:500,filed:800,break:1500}[name]||250;
  if(now-(soundLast[name]??-Infinity)<gap)return false;
  while(soundBurst.length&&now-soundBurst[0]>400)soundBurst.shift();
  if(soundBurst.length>=4)return false;
  soundLast[name]=now;soundBurst.push(now);wakeAudio();
  try { fn();return !!ctx; } catch { return false; }
}

/**
 * Returns the signed-in user, or null.
 *
 * Deliberately does NOT create an account. If we auto-created an anonymous
 * user on every page load, someone opening the game on a second device would
 * silently get a brand new empty desk instead of a chance to sign in.
 */
async function getUser() {
  const { data } = await supabase.auth.getSession();
  return data.session?.user || null;
}

/** New player, no email yet. Their desk lives in this browser until they save it. */
async function startAnonymous() {
  const { data, error } = await supabase.auth.signInAnonymously();
  if (error) throw error;
  return data.user;
}

/**
 * Attaches an email to the current (anonymous) account, making it permanent.
 * Supabase emails a confirmation link; once clicked, the same desk is
 * reachable from any device.
 */
async function linkEmail(email) {
  const { error } = await supabase.auth.updateUser(
    { email },
    { emailRedirectTo: window.location.origin }
  );
  if (error) throw error;
}

/** Signs an existing player in on a new device / after clearing data. */
async function sendMagicLink(email) {

async function prepareBadgePhoto(file) {
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))throw Error("Choose a JPG, PNG, WebP or GIF image.");
 if(file.size>10*1024*1024)throw Error("Choose a photo smaller than 10 MB.");
 const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error("Could not read that photo. Try another file."));r.readAsDataURL(file);});
 const im=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error("That image could not be opened. Try another photo."));image.src=data;});
 const cv=document.createElement("canvas");cv.width=cv.height=256;const ctx=cv.getContext("2d"),side=Math.min(im.naturalWidth,im.naturalHeight);
 ctx.drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-side)/2,side,side,0,0,256,256);
 // PNG retains fully transparent and translucent pixels through the square crop.
 return cv.toDataURL("image/png");
}

async function uploadBadge(userId, dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${userId}.png`;
  const { error } = await supabase.storage
    .from("badges")
    .upload(path, blob, { upsert: true, contentType: "image/png" });
  if (error) throw error;
  const { data } = supabase.storage.from("badges").getPublicUrl(path);
  // same filename every time, so bust the cache or everyone keeps seeing the old face
  return data.publicUrl + "?v=" + Date.now();
}

/**
 * Live positions and emotes. This is broadcast-only — it never touches the
 * database, so people can wander around the floor without writing a row every
 * 200ms. If someone goes quiet for 15s we just park them back at their desk.
 */
function joinLive(meId, onPeer, onMoment, onStatus) {
  const ch = supabase.channel("floor-live", { config: { broadcast: { self: false } } });
  let ready=false;
  ch.on("broadcast", { event: "pos" }, ({ payload }) => {
    if (payload && payload.id !== meId) onPeer(payload);
  }).on("broadcast",{event:"moment"},({payload})=>{if(payload&&payload.id!==meId)onMoment?.(payload);})
    .subscribe(status=>{ready=status==="SUBSCRIBED";onStatus?.(ready);});
  return {
    send: (payload) => ch.send({ type: "broadcast", event: "pos", payload }),
    sendMoment: async payload=>{if(!ready)return false;try{return await ch.send({type:"broadcast",event:"moment",payload})==="ok";}catch{return false;}},
    leave: () => supabase.removeChannel(ch),
  };
}

function normalizeBreakInvite(payload,now,players){
 if(!payload||payload.kind!=="break"||typeof payload.id!=="string"||!players.some(p=>p.id===payload.id)||!Number.isFinite(payload.t)||!Number.isInteger(payload.t))return null;
 if(payload.t>now+5000||now-payload.t>45000)return null;
 return {id:payload.id,t:payload.t,until:Math.min(payload.t+45000,now+45000)};
}
function officeSceneAt(t){return Math.floor(t/1800000)%3;}

/** Live updates: any change to any player or deed pushes instantly. */
function subscribeFloor(onChange) {
  const ch = supabase
    .channel("floor")
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, onChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "deeds" }, onChange)
    .subscribe();
  return () => supabase.removeChannel(ch);
}

/** Two people trading hostilities is a story. Count the exchanges and name it. */
function buildFeuds(deeds, names) {
  const pairs = {};
  const cutoff = Date.now() - 24 * 3600e3;
  for (const d of deeds) {
    const T = DEED_TEXT[d.kind];
    if (!T || T.good) continue;
    if (new Date(d.created_at).getTime() < cutoff) continue;
    const key = [d.actor, d.target].sort().join("|");
    const p = pairs[key] || (pairs[key] = { a: null, b: null, n: 0, by: {}, last: 0 });
    p.n++;
    p.by[d.actor] = (p.by[d.actor] || 0) + 1;
    p.last = Math.max(p.last, new Date(d.created_at).getTime());
    [p.a, p.b] = key.split("|");
  }
  return Object.values(pairs)
    .filter((p) => p.n >= 3 && Object.keys(p.by).length > 1)   // mutual, not one-sided
    .map((p) => ({
      ...p,
      names: [names[p.a] || "someone", names[p.b] || "someone"],
      heat: p.n >= 8 ? "open warfare" : p.n >= 5 ? "escalating" : "brewing",
    }))
    .sort((x, y) => y.n - x.n)
    .slice(0, 5);
}

/** Feet-sized collision against the office walls. */
function blocked(x, y) {
  for (const w of WALLS) {
    if (x > w.x - 13 && x < w.x + w.w + 13 && y > w.y - 6 && y < w.y + w.h + 10) return true;
  }
  return false;
}

function prettyError(e) {
  const raw = e?.message || e?.error_description || e?.details || String(e || "");
  const m = raw.toLowerCase();
  if (m.includes("afford")) return "Not enough Busywork.";
  if (m.includes("cooling")) return "Cooling off. One office favor at a time.";
  if (m.includes("goodwill")) return "Dave asks what you've done for anyone lately.";
  if (m.includes("clear your file")) return "Clear your file first. Read the room.";
  if (m.includes("nothing on file")) return "Nothing on your file. Enjoy it.";
  if (m.includes("cover up")) return "Nothing to cover up. Yet.";
  if (m.includes("too early")) return "The cooler opens at eleven. Have some water.";
  if (m.includes("caffeinated")) return "You just had something. Give it twenty minutes.";
  if (m.includes("cycle")) return "Not enough earned this cycle yet.";
  if (m.includes("unlocked")) return "Not unlocked yet — hire more of that first.";
  if (m.includes("already owned")) return "You already have that one.";
  if (m.includes("maxed")) return "That's maxed out.";
  if (m.includes("equity")) return "Not enough Seniority.";
  if (m.includes("closed")) return "The office is closed to new staff.";
  if (m.includes("full")) return "The office is full.";
  if (m.includes("fetch") || m.includes("network") || m.includes("failed to"))
    return "Lost the connection for a second. Try again.";
  // Nothing matched — show the real thing rather than a shrug, so a bug
  // reports itself instead of hiding behind a friendly sentence.
  return raw ? "Error: " + raw.slice(0, 120) : "That didn't work.";
}
