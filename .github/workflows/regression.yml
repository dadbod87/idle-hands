name: Idle Hands regression gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  economy-and-office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only parser
        run: npm install --no-save --no-package-lock @babel/parser@7
      - name: Run source and economy regression checks
        run: node tests/economy-and-office.test.cjs
